name: Achievement exhibition browser QA
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/achievement-exhibition-v1.css'
      - 'assets/achievement-gallery-v1621.*'
      - 'scripts/qa-achievement-exhibition-v1-browser.mjs'
      - 'scripts/qa-achievement-live-browser.mjs'
      - 'scripts/qa-first-paint-guard-v1-browser.mjs'
      - '.github/workflows/qa-achievement-exhibition-v1.yml'
permissions:
  contents: read
jobs:
  exhibition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Korean fonts for visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
      - name: Render and validate gallery hover and detail
        env:
          MWS_HALL_CAPTURE: '1'
        run: node scripts/qa-achievement-exhibition-v1-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: achievement-hall-interaction-browser
          path: visual-achievement-hall/*.jpg
          if-no-files-found: ignore
      - run: node scripts/run-phase90-achievement-gallery-audit.mjs
      - run: node scripts/run-phase93-achievement-touch-audit.mjs
      - name: Check complete pre-deployment integration audits
        run: |
          node --check scripts/qa-achievement-live-browser.mjs
          node --check assets/achievement-gallery-v1621.js
          node scripts/run-current-full-integration-audit.mjs
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unstyled first-frame safeguards at 4 viewports
        env:
          MWS_FIRST_PAINT_CAPTURE: '1'
        run: node scripts/qa-first-paint-guard-v1-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-first-paint-chromium
          path: visual-first-paint/*.jpg
          if-no-files-found: ignore
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Korean fonts for real public screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
      - name: Actual Cloudflare site - candidate hover and detail, read-only
        env:
          MWS_HALL_CAPTURE: '1'
        run: node scripts/qa-achievement-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: achievement-hall-real-public-chromium
          path: visual-achievement-live/*.jpg
          if-no-files-found: ignore
