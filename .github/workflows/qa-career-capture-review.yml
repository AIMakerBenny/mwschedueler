name: Review career timeline capture
on:
  push:
    branches: ['qa/career-motion-capture-review-20261121']
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh run download 44906460588 --repo "$GITHUB_REPOSITORY" --name career-motion-browser --dir capture
      - run: |
          for f in capture/2022-april-1366.png capture/2024-march-1366.png capture/search-1366.png; do
            echo "CAPTURE_BEGIN $(basename "$f")"
            base64 -w 4096 "$f"
            echo CAPTURE_END
          done
