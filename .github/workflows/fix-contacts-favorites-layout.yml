name: Fix contacts favorites layout

on:
  push:
    paths:
      - '.github/workflows/fix-contacts-favorites-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contacts favorites layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = 'body:not([data-resolution="mobile"]) #contacts.active .contact-board-main{grid-column:2!important;min-width:0!important}'
          new = "\n".join([
              'body:not([data-resolution="mobile"]) #contacts.active .contact-board-layout:not(.maintenance-mode) .contact-board-main{grid-column:2!important;min-width:0!important}',
              'body:not([data-resolution="mobile"]) #contacts.active .contact-board-layout.maintenance-mode{grid-template-columns:minmax(0,1fr)!important}',
              'body:not([data-resolution="mobile"]) #contacts.active .contact-board-layout.maintenance-mode .contact-board-main{grid-column:1!important;min-width:0!important}',
              'body:not([data-resolution="mobile"]) #contacts.active .contact-board-layout.maintenance-mode .contact-tag-banner-area{display:none!important}',
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target rule, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix contacts favorites layout"
          git push
