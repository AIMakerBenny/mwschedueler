name: QA Legacy Hub V1
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/app-core.js'
      - 'assets/legacy-hub-v1.css'
      - 'scripts/qa-legacy-hub-v1.test.mjs'
      - 'scripts/run-phase116-wardogs-navigation-shell-audit.mjs'
      - '.github/workflows/qa-legacy-hub-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check --input-type=commonjs < assets/app-core.js
          node --test scripts/qa-legacy-hub-v1.test.mjs
          node scripts/run-phase116-wardogs-navigation-shell-audit.mjs
