name: QA Legacy Hub V1
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/app-core.js'
      - 'assets/legacy-hub-v1.css'
      - 'assets/bsandong-v1.js'
      - 'assets/sidebar-hover-v2.js'
      - 'assets/sidebar-compact-v1.css'
      - 'assets/calendar-content-groups-v2.css'
      - 'assets/bsandong-v1.css'
      - 'scripts/qa-bsandong-v1.test.mjs'
      - 'scripts/qa-bsandong-v1-browser.mjs'
      - 'scripts/qa-request-budget-full-app-v2-browser.mjs'
      - 'scripts/qa-workspace-navigation-v1-browser.mjs'
      - 'scripts/qa-legacy-hub-v1.test.mjs'
      - 'scripts/run-phase116-wardogs-navigation-shell-audit.mjs'
      - '.github/workflows/qa-legacy-hub-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  MWS_QA_OFFLINE: '1'
jobs:
  legacy-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          node --check --input-type=commonjs < assets/app-core.js
          node --check assets/bsandong-v1.js
          node --check assets/sidebar-hover-v2.js
          MWS_QA_SIDEBAR_HOVER=1 node scripts/qa-request-budget-full-app-v2-browser.mjs
          node --check assets/calendar-content-groups-v2.js
          node --check assets/calendar-details-v1.js
          node --test scripts/qa-calendar-groups-cloud-save-v1.test.mjs scripts/qa-active-cloudflare-core-groups-v1.test.mjs
          node --test scripts/qa-bsandong-v1.test.mjs scripts/qa-legacy-hub-v1.test.mjs
          node scripts/run-phase116-wardogs-navigation-shell-audit.mjs
          node scripts/qa-bsandong-v1-browser.mjs
          node scripts/qa-workspace-navigation-v1-browser.mjs
          MWS_QA_BSANDONG=1 MWS_QA_IDLE_MODE=public node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_BSANDONG=1 MWS_QA_IDLE_MODE=admin node scripts/qa-request-budget-full-app-v2-browser.mjs
