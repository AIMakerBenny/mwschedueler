name: V1.0.17 emoticon safety one-off

on:
  push:
    branches:
      - mws-v1.0.17-emoticon-persistence
    paths:
      - .github/workflows/v1017-emoticon-safety-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.17-emoticon-persistence
          fetch-depth: 0
      - name: Keep contactMeta lazy but require it before emoticon manager use
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/cloud-v5.5.js')
          s=p.read_text(encoding='utf-8')
          old="const INITIAL_PARTS=['core','contacts','contactMeta','events','posts','activity'];"
          new="const INITIAL_PARTS=['core','contacts','events','posts','activity'];"
          if old not in s: raise SystemExit('INITIAL_PARTS target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('assets/content-planner-host.js')
          s=p.read_text(encoding='utf-8')
          old="document.getElementById('mwsEmoticonOpenV114').onclick=()=>{renderEmoticonManagerV114();modal.classList.add('open')}"
          new="document.getElementById('mwsEmoticonOpenV114').onclick=async()=>{try{if(typeof window.mwsV55EnsureParts==='function')await window.mwsV55EnsureParts('export');syncGlobals();renderEmoticonManagerV114();modal.classList.add('open')}catch(err){alert(err?.message||String(err))}}"
          if old not in s: raise SystemExit('emoticon open target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          cloud=Path('assets/cloud-v5.5.js').read_text(encoding='utf-8')
          host=Path('assets/content-planner-host.js').read_text(encoding='utf-8')
          assert "const INITIAL_PARTS=['core','contacts','events','posts','activity'];" in cloud
          assert "emoticons:clone(Array.isArray(d.emoticons)?d.emoticons:[])" in cloud
          assert "mwsV55EnsureParts('export')" in host
          assert 'persistEmoticonsV117' in host
          Path('.github/workflows/v1017-emoticon-safety-oneoff.yml').unlink()
          PY
      - name: Syntax checks
        run: |
          node --check assets/cloud-v5.5.js
          node --check assets/content-planner-host.js
          node --check src/cf-v57.js
          node --check src/cf-v571.js
      - name: Commit hardened V1.0.17
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden custom emoticon persistence V1.0.17"
          git push origin HEAD:mws-v1.0.17-emoticon-persistence
