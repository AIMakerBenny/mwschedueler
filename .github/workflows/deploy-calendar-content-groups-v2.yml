name: Deploy Calendar Editor Sidebar V5 - Scoped Production
on:
  push:
    branches:
      - cloudflare-production
    paths:
      - '.github/workflows/deploy-calendar-content-groups-v2.yml'
      - 'assets/calendar-responsive-cards-v1.css'
      - 'assets/calendar-stable-layout-v1.css'
      - 'assets/app-core.js'
      - 'scripts/qa-calendar-stable-layout-v1-browser.mjs'
      - 'assets/sidebar-rail-scrollbar-v1.css'
      - 'scripts/qa-sidebar-rail-scrollbar-v1-browser.mjs'
      - 'index.html'
      - 'scripts/qa-calendar-responsive-v1-browser.mjs'
      - 'assets/steam-game-v111.js'
      - 'assets/cloud-v1.1.js'
      - 'assets/cloud-runtime-v130.js'
      - 'assets/cloud-v1.1-loader.js'
      - 'src/index.js'
      - 'src/cf-v111-auth.js'
      - 'scripts/qa-active-cloudflare-core-groups-v1.test.mjs'
      - 'scripts/qa-live-calendar-core-summary-v1.mjs'
      - 'scripts/qa-game-library-v1.test.mjs'
      - 'scripts/qa-game-library-v1-browser.mjs'

permissions:
  contents: read
  statuses: write

concurrency:
  group: calendar-content-groups-v2-single-deploy
  cancel-in-progress: false

jobs:
  scoped-calendar-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Calendar and existing feature syntax
        run: |
          node --check --input-type=commonjs < assets/app-core.js
          node --check assets/calendar-continuous-series-v1.js
          node --check assets/calendar-content-groups-v2.js
          node --check assets/event-sidebar-tabs-v5.js
          node --check assets/calendar-move-guard-v4.js
          node --check assets/cloud-v5.5.js
          node --check src/index.js
          node --check src/cf-v111-entry.js
          node --check src/cf-v111-auth.js
          node --check assets/soop-contact-autofill-v1.js
          node --check assets/steam-game-v111.js
          node --check assets/cloud-v1.1-loader.js
      - name: Calendar content group, hover and duration regression
        run: |
          node --test scripts/qa-calendar-continuous-series-v1.test.mjs
          node --test scripts/qa-calendar-broadcast-duration-v1.test.mjs
          node scripts/qa-calendar-continuous-series-browser-v1.mjs
          node scripts/qa-calendar-content-groups-v2-browser.mjs
          node scripts/qa-calendar-content-groups-v3-search-browser.mjs
          node scripts/qa-calendar-toolbar-v4-browser.mjs
          node scripts/qa-calendar-responsive-v1-browser.mjs
          node scripts/qa-calendar-stable-layout-v1-browser.mjs
          node scripts/qa-sidebar-rail-scrollbar-v1-browser.mjs
          node scripts/qa-game-library-v1-browser.mjs
          node --test scripts/qa-game-library-v1.test.mjs
          node scripts/qa-event-sidebar-tabs-v5-browser.mjs
          node --test scripts/qa-calendar-groups-cloud-save-v1.test.mjs
          node --test scripts/qa-active-cloudflare-core-groups-v1.test.mjs
          node --test scripts/qa-soop-contact-autofill-v1.test.mjs
      - name: Install deployment dependencies
        run: npm install
      - name: Deploy identical Cloudflare Worker with production bindings
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live calendar group frontend was published
        shell: bash
        run: |
          set -euo pipefail
          base='https://mawang-scheduler.majoku.workers.dev'
          ok=0
          for i in $(seq 1 3); do
            t=$(date +%s)
            if curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$base/?scoped-calgroup-v2=$t" -o /tmp/group-index.html \
                && grep -Fq 'calendar-content-groups-v2.js?v=5' /tmp/group-index.html \
                && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$base/assets/calendar-content-groups-v2.js?v=5&check=$t" -o /tmp/group-manager.js \
                && grep -Fq 'mwsCalendarContentGroupsV2' /tmp/group-manager.js \
                && grep -Fq 'renderGroupSearch' /tmp/group-manager.js \
                && grep -Fq 'evContentGroupSearchV3' /tmp/group-index.html \
                && grep -Fq 'calendarGroupSearchPanelV3' /tmp/group-index.html \
                && grep -Fq 'assets/calendar-content-groups-v2.css?v=3' /tmp/group-index.html \
                && grep -Fq 'assets/calendar-toolbar-v4.css?v=1' /tmp/group-index.html \
                && grep -Fq 'assets/calendar-responsive-cards-v1.css?v=1' /tmp/group-index.html \
                && grep -Fq 'assets/calendar-stable-layout-v1.css?v=1' /tmp/group-index.html \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/calendar-stable-layout-v1.css?check=$t" -o /tmp/calendar-stable.css \
                && grep -Fq 'grid-template-rows:2.8em 1.3em' /tmp/calendar-stable.css \
                && grep -Fq 'assets/sidebar-rail-scrollbar-v1.css?v=1' /tmp/group-index.html \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/sidebar-rail-scrollbar-v1.css?check=$t" -o /tmp/sidebar-rail.css \
                && grep -Fq 'scrollbar-gutter:stable' /tmp/sidebar-rail.css \
                && grep -Fq 'grid-template-columns:72px' /tmp/sidebar-rail.css \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/cloud-v1.1-loader.js?check=$t" -o /tmp/game-loader.js \
                && grep -Fq '1.1.4-perf30&game-library-v1=1' /tmp/game-loader.js \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/steam-game-v111.js?check=$t" -o /tmp/game-panel.js \
                && grep -Fq 'gameManualFormV1' /tmp/game-panel.js \
                && grep -Fq 'gameLibListV1' /tmp/game-panel.js \
                && grep -Fq '__mwsSteamSlotHandlersV1' /tmp/game-panel.js \
                && grep -Fq 'class="calendar-responsive-scroll-v1"' /tmp/group-index.html \
                && grep -Fq 'assets/calendar-move-guard-v4.js?v=1' /tmp/group-index.html \
                && grep -Fq 'calendarGroupManageToggleV4' /tmp/group-index.html \
                && grep -Fq 'calendarUndoLastMoveV4' /tmp/group-index.html \
                && grep -Fq 'id="eventSeriesPaneV5"' /tmp/group-index.html \
                && grep -Fq 'id="eventMemoPaneV5"' /tmp/group-index.html \
                && grep -Fq 'assets/event-sidebar-tabs-v5.js?v=1' /tmp/group-index.html \
                && grep -Fq 'assets/event-sidebar-tabs-v5.css?v=1' /tmp/group-index.html \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/event-sidebar-tabs-v5.js?check=$t" -o /tmp/event-sidebar-tabs-v5.js \
                && grep -Fq 'mwsEventSidebarTabsV5' /tmp/event-sidebar-tabs-v5.js \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/event-sidebar-tabs-v5.css?check=$t" -o /tmp/event-sidebar-tabs-v5.css \
                && grep -Fq '.event-side-tabpanel-v5' /tmp/event-sidebar-tabs-v5.css \
                && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$base/assets/calendar-content-groups-v2.css?v=3&check=$t" -o /tmp/group-style.css \
                && grep -Fq '.calendar-group-search-v3' /tmp/group-style.css \
                && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$base/assets/app-core.js?check=$t" -o /tmp/group-core.js \
                && grep -Fq 'contentGroupId:document.getElementById' /tmp/group-core.js \
                && grep -Fq 'grid.onpointermove=pointerPreview' /tmp/group-core.js \
                && grep -Fq 'calendar-event-drag-handle-v4' /tmp/group-core.js \
                && grep -Fq 'mws-steam-host-v111' /tmp/group-core.js \
                && grep -Fq 'mwsCalendarMoveGuardV4?.recordMove' /tmp/group-core.js \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/cloud-v1.1.js?check=$t" -o /tmp/group-cloud.js \
                && node -e "const s=require('fs').readFileSync('/tmp/group-cloud.js','utf8');const m=s.match(/const CORE_KEYS=\\[([^\\]]*)\\]/);if(!m||!m[1].includes('contentGroups')||!m[1].includes('gameLibrary'))process.exit(1)" \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/cloud-runtime-v130.js?check=$t" -o /tmp/group-cloud-v130.js \
                && node -e "const s=require('fs').readFileSync('/tmp/group-cloud-v130.js','utf8');const m=s.match(/const CORE_KEYS=\\[([^\\]]*)\\]/);if(!m||!m[1].includes('contentGroups')||!m[1].includes('gameLibrary'))process.exit(1)" \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/calendar-move-guard-v4.js?check=$t" -o /tmp/group-undo.js \
                && grep -Fq 'undoLast' /tmp/group-undo.js \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/calendar-responsive-cards-v1.css?check=$t" -o /tmp/group-responsive.css \
                && grep -Fq '@container mws-calendar-day' /tmp/group-responsive.css \
                && curl --fail --silent --show-error --max-time 15 "$base/assets/calendar-toolbar-v4.css?check=$t" -o /tmp/group-toolbar.css \
                && grep -Fq '.calendar-topbar-v4' /tmp/group-toolbar.css; then
              ok=1
              break
            fi
            if [ "$i" = "1" ]; then
              echo "Live Cloudflare core fetch probe:"
              curl -sS -L --max-time 15 -w 'HTTP %{http_code} ContentType %{content_type} Bytes %{size_download}\n' "$base/assets/cloud-v1.1.js?diagnostic=$t" -o /tmp/group-core-diagnostic.js || true
              wc -c /tmp/group-core-diagnostic.js || true
              grep -m1 'CORE_KEYS' /tmp/group-core-diagnostic.js | cut -c1-260 || true
              head -c 180 /tmp/group-core-diagnostic.js || true
              echo
              echo "Live Core keys:"
              grep -m1 'const CORE_KEYS=' /tmp/group-cloud.js || true
              echo "Live HTML markers:"
              grep -oE 'calendar-(toolbar|move-guard)-v4[^" ]*' /tmp/group-index.html | head -n 5 || true
            fi
            echo "Live calendar groups not yet propagated, attempt $i"
            sleep 10
          done
          test "$ok" = 1
          echo "EVENT_SIDEBAR_V5_PRODUCTION_OK"
      - name: Read-only production group and linked-event health
        continue-on-error: true
        run: node scripts/qa-live-calendar-core-summary-v1.mjs
      - name: Publish scoped Cloudflare deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state="$JOB_STATUS"
          if [ "$state" != 'success' ]; then state='failure'; fi
          STATE="$state" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,context:'Cloudflare Calendar Groups Scoped',description:process.env.STATE==='success'?'Calendar and SOOP tests, deploy and live smoke passed':'Scoped Worker deploy failed',target_url:process.env.RUN_URL}))" > /tmp/scoped-deploy-status.json
          curl -fsSL --max-time 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/scoped-deploy-status.json
