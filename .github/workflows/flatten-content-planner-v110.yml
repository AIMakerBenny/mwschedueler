name: Flatten Content Planner V1.0.10

on:
  push:
    branches:
      - cloudflare-production
    paths:
      - .github/workflows/flatten-content-planner-v110.yml

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0

      - name: Flatten planner runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false acorn@8
          node <<'NODE'
          const fs = require('fs');
          const acorn = require('acorn');
          const path = 'content-planner.html';
          let html = fs.readFileSync(path, 'utf8');
          const marker = "<script>\n'use strict';";
          const open = html.indexOf(marker);
          if (open < 0) throw new Error('Planner inline script marker not found');
          const jsStart = open + '<script>\n'.length;
          const close = html.indexOf('</script>', jsStart);
          if (close < 0) throw new Error('Planner inline script closing tag not found');
          let js = html.slice(jsStart, close);
          const ast = acorn.parse(js, {ecmaVersion:'latest', sourceType:'script'});
          const groups = new Map();
          for (const node of ast.body) {
            if (node.type === 'FunctionDeclaration' && node.id?.name) {
              const arr = groups.get(node.id.name) || [];
              arr.push(node);
              groups.set(node.id.name, arr);
            }
          }
          const duplicates = [...groups.entries()].filter(([,nodes]) => nodes.length > 1);
          if (!duplicates.length) throw new Error('No duplicate top-level planner functions found');
          const expected = ['loadDraft','touch','syncHeader','syncMetaInputs','switchMode','setZoom','setTool','setBackground','addText','addSticky','addShape','addArrow','addSticker','nodeHtml','render','bindNodes','beginDrag','beginResize','renderPositions','renderConnectors','applyTextStyle','staticNodeHtml','renderStaticBoard','renderBoardToCanvas','paintBackground','boardPoint'];
          const names = new Set(duplicates.map(([name]) => name));
          const missing = expected.filter(name => !names.has(name));
          if (missing.length) throw new Error('Expected layered functions were not duplicated: ' + missing.join(', '));
          const removals = [];
          for (const [name,nodes] of duplicates) {
            for (const node of nodes.slice(0,-1)) removals.push({start:node.start,end:node.end,name});
          }
          removals.sort((a,b) => b.start-a.start);
          for (const r of removals) js = js.slice(0,r.start) + `\n/* flattened: removed superseded ${r.name} implementation */\n` + js.slice(r.end);

          // The old defaultState implementation was not a duplicate declaration because the later layer reassigned it.
          // Make the final planner default implementation the only implementation while preserving execution order.
          let ast2 = acorn.parse(js, {ecmaVersion:'latest', sourceType:'script'});
          const oldDefault = ast2.body.find(n => n.type === 'FunctionDeclaration' && n.id?.name === 'defaultState');
          const finalDefault = ast2.body.find(n => n.type === 'FunctionDeclaration' && n.id?.name === 'v104DefaultState');
          if (!oldDefault || !finalDefault) throw new Error('Planner default-state flatten targets not found');
          js = js.slice(0,oldDefault.start) + '\n/* flattened: removed superseded defaultState implementation */\n' + js.slice(oldDefault.end);
          js = js.replace('let state=defaultState(),', 'let state=v104DefaultState(),');
          js = js.replace(/\ndefaultState=v104DefaultState;\n/, '\n');
          if (js.includes('defaultState=v104DefaultState')) throw new Error('Legacy defaultState reassignment remains');

          js = js.replace('/* ===== CF MWS V 1.0.5 planner update ===== */','/* ===== CF MWS V 1.0.10 planner runtime ===== */');
          html = html.slice(0,jsStart) + js + html.slice(close);
          html = html.replace('id="mws-planner-v104-style"','id="mws-planner-v110-style"');
          fs.writeFileSync(path, html, 'utf8');

          // Re-parse and assert that the runtime now has one top-level declaration per function name.
          const finalHtml = fs.readFileSync(path,'utf8');
          const finalOpen = finalHtml.indexOf(marker);
          const finalStart = finalOpen + '<script>\n'.length;
          const finalClose = finalHtml.indexOf('</script>', finalStart);
          const finalJs = finalHtml.slice(finalStart, finalClose);
          const finalAst = acorn.parse(finalJs,{ecmaVersion:'latest',sourceType:'script'});
          const seen = new Set();
          const dupFinal = [];
          for (const node of finalAst.body) {
            if (node.type !== 'FunctionDeclaration' || !node.id?.name) continue;
            if (seen.has(node.id.name)) dupFinal.push(node.id.name);
            seen.add(node.id.name);
          }
          if (dupFinal.length) throw new Error('Duplicate top-level functions remain: ' + [...new Set(dupFinal)].join(', '));
          if (finalHtml.includes('CF MWS V 1.0.5 planner update')) throw new Error('Old planner layer marker remains');
          if (!finalHtml.includes('CF MWS V 1.0.10 planner runtime')) throw new Error('V1.0.10 runtime marker missing');
          if (!finalHtml.includes('mws-planner-v110-style')) throw new Error('V1.0.10 planner style id missing');
          if (!finalHtml.includes("return dbPut(payload)")) throw new Error('Proposal storage adapter changed unexpectedly');
          if (!finalHtml.includes("switchMode('creator')")) throw new Error('Creator initialization missing');
          console.log('Removed superseded declarations:', removals.length + 1);
          console.log('Flattened duplicate groups:', duplicates.map(([n,v]) => `${n}:${v.length}`).join(', '));
          console.log('Final planner bytes:', Buffer.byteLength(finalHtml));
          fs.writeFileSync('/tmp/planner-inline.js', finalJs, 'utf8');
          NODE
          node --check /tmp/planner-inline.js
          grep -q 'MAWANG Content Planner V1.0.10' content-planner.html
          grep -q 'CF MWS V 1.0.10 planner runtime' content-planner.html
          ! grep -q 'CF MWS V 1.0.5 planner update' content-planner.html

      - name: Commit flattened planner and remove temporary workflow
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/flatten-content-planner-v110.yml
          git add content-planner.html
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No flatten changes to commit"
            exit 1
          fi
          git commit -m "Flatten Content Planner V1.0.10 runtime"
          git push origin HEAD:cloudflare-production
