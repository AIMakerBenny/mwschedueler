name: Majoku Castle Rebuild Check

on:
  push:
    branches:
      - feature/majoku-castle-cloudflare-20260916
    paths:
      - '.majoku-upload/**'
      - '.github/workflows/majoku-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/majoku-castle-cloudflare-20260916
          fetch-depth: 0

      - name: Rebuild Majoku Castle HTML
        shell: bash
        run: |
          set -euo pipefail
          ls .majoku-upload/part-*.txt | sort -V > /tmp/parts.txt
          test "$(wc -l < /tmp/parts.txt)" -eq 25
          xargs cat < /tmp/parts.txt | tr -d '\r\n\t ' > /tmp/majoku.b64
          base64 --decode /tmp/majoku.b64 > /tmp/majoku.html.gz

          set +e
          gzip -dc /tmp/majoku.html.gz > majoku-castle.html 2>/tmp/gzip.err
          GZIP_STATUS=$?
          set -e

          echo "gzip_status=${GZIP_STATUS}"
          cat /tmp/gzip.err || true
          test -s majoku-castle.html
          grep -qi '<html' majoku-castle.html
          grep -qi '</html>' majoku-castle.html
          grep -qi 'Majoku Castle' majoku-castle.html
          echo "bytes=$(wc -c < majoku-castle.html)"
          echo "gzip_bytes=$(wc -c < /tmp/majoku.html.gz)"
          sha256sum majoku-castle.html

          python3 - <<'PY'
          import pathlib, struct, zlib
          html = pathlib.Path('majoku-castle.html').read_bytes()
          gz = pathlib.Path('/tmp/majoku.html.gz').read_bytes()
          exp_crc, exp_size = struct.unpack('<II', gz[-8:])
          print('expected_crc=%08x expected_size=%d' % (exp_crc, exp_size))
          print('actual_crc=%08x actual_size=%d' % (zlib.crc32(html) & 0xffffffff, len(html)))
          print('tail_repr=', repr(html[-32:]))
          matched = False
          for cut in range(0, 65):
              d = html[:-cut] if cut else html
              if (len(d) & 0xffffffff) == exp_size and (zlib.crc32(d) & 0xffffffff) == exp_crc:
                  print('TRAILER_MATCH_AFTER_TRIM=', cut)
                  pathlib.Path('majoku-castle.html').write_bytes(d)
                  matched = True
                  break
          if not matched and len(html) != exp_size:
              delta = len(html) - exp_size
              print('size_delta=', delta)
          pathlib.Path('/tmp/trailer_match').write_text('1' if matched else '0')
          PY

          grep -qi '</html>' majoku-castle.html

          if [ "$GZIP_STATUS" -ne 0 ] && [ "$(cat /tmp/trailer_match)" != "1" ]; then
            echo 'Gzip validation failed and could not be explained by trailing bytes. Not committing reconstruction.'
            exit 1
          fi

          echo 'Verified reconstruction:'
          echo "bytes=$(wc -c < majoku-castle.html)"
          sha256sum majoku-castle.html

      - name: Commit verified reconstruction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- majoku-castle.html && git ls-files --error-unmatch majoku-castle.html >/dev/null 2>&1; then
            echo 'No reconstruction change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add majoku-castle.html
          git commit -m 'Rebuild verified Majoku Castle HTML'
          git push origin HEAD:feature/majoku-castle-cloudflare-20260916
