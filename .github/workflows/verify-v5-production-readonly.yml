name: Verify V5 production deployment identity
on:
  push:
    branches: [audit-v5-production-nov24]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Cloudflare management API only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MWS_EXPECTED_SHA: 0a00995de034bdc76388761065bbca8858ee8326
        run: |
          for attempt in $(seq 1 18); do
            if node scripts/verify-cloudflare-deployment-v3.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
