name: V1.0.17 auth-safe emoticon one-off

on:
  push:
    branches:
      - mws-v1.0.17-emoticon-persistence
    paths:
      - .github/workflows/v1017-auth-safe-emoticon-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.17-emoticon-persistence
          fetch-depth: 0
      - name: Put R2 write behind authenticated save handler
        shell: bash
        run: |
          git checkout origin/cloudflare-production -- src/cf-v57.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          marker = "    out.contactTagBanners = banners;\n    return out;\n  }\n\n  if (part === 'miniGames') {"
          insert = "    out.contactTagBanners = banners;\n    const emoticons = Array.isArray(out.emoticons) ? out.emoticons : [];\n    for (let i = 0; i < emoticons.length; i++) {\n      const item = emoticons[i];\n      if (!item || typeof item !== 'object') continue;\n      const src = item.src;\n      if (parseDataImage(src)) {\n        const seed = String(item.id || item.name || `item-${i + 1}`);\n        const key = `emoticon-${await shortHash(seed)}`;\n        item.src = await storeDataImage(env, 'workspace', key, src, true);\n      } else item.src = await normalizeManagedString(env, src);\n    }\n    out.emoticons = emoticons;\n    return out;\n  }\n\n  if (part === 'miniGames') {"
          if s.count(marker) != 1:
              raise SystemExit(f'contactMeta target count={s.count(marker)}')
          p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
          worker = Path('src/index.js').read_text(encoding='utf-8')
          wrapper = Path('src/cf-v57.js').read_text(encoding='utf-8')
          cloud = Path('assets/cloud-v5.5.js').read_text(encoding='utf-8')
          host = Path('assets/content-planner-host.js').read_text(encoding='utf-8')
          assert "key = `emoticon-${await shortHash(seed)}`" in worker
          assert "storeDataImage(env, 'workspace', key, src, true)" in worker
          assert 'externalizeEmoticonsV117' not in wrapper
          assert "emoticons:clone(Array.isArray(d.emoticons)?d.emoticons:[])" in cloud
          assert 'persistEmoticonsV117' in host
          Path('.github/workflows/v1017-auth-safe-emoticon-oneoff.yml').unlink()
          PY
      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check src/cf-v57.js
          node --check src/cf-v571.js
          node --check assets/cloud-v5.5.js
          node --check assets/content-planner-host.js
      - name: Commit auth-safe V1.0.17
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep emoticon R2 writes behind authenticated save V1.0.17"
          git push origin HEAD:mws-v1.0.17-emoticon-persistence
