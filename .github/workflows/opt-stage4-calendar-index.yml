name: Optimize stage 4 calendar render

on:
  push:
    paths:
      - '.github/workflows/opt-stage4-calendar-index.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Index events by date during calendar render
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Verify JavaScript syntax and patch scope
        run: |
          node --check assets/app-core.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('assets/app-core.js').read_text('utf-8')
          if 'const eventsByDate=new Map();' not in text:
            raise SystemExit('Calendar date index missing')
          if 'activeEvents().filter(e=>e.date===ds)' in text:
            raise SystemExit('Old repeated calendar filtering still present')
          PY

      - name: Commit stage 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-core.js
          git commit -m "Index calendar events by date during render"
          git push
