name: Performance regression smoke test

on:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static JavaScript syntax checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.src=None; self.buf=[]; self.items=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      d=dict(attrs); self.in_script=True; self.src=d.get('src'); self.buf=[]
              def handle_data(self, data):
                  if self.in_script and not self.src: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      if not self.src: self.items.append(''.join(self.buf))
                      self.in_script=False; self.src=None; self.buf=[]

          text=Path('index.html').read_text('utf-8')
          required=['mwsAccessGate','contactSearch','contactGrid','calendar','dashboard','gameMultiDraw']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Missing critical DOM markers: {missing}')
          p=Scripts(); p.feed(text)
          out=Path('.tmp-scripts'); out.mkdir(exist_ok=True)
          for i,s in enumerate(p.items): (out/f'inline-{i}.js').write_text(s,'utf-8')
          print(f'extracted {len(p.items)} inline scripts')
          PY
          for f in .tmp-scripts/*.js; do node --check "$f"; done
          for f in assets/*.js; do [ -e "$f" ] && node --check "$f"; done

      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run browser regression smoke test
        run: |
          python3 -m http.server 4173 >/tmp/mws-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = (cond,msg)=>{ if(!cond) throw new Error(msg); };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') console.log('browser console error:',m.text()) });

            const contacts=Array.from({length:160},(_,i)=>({
              id:`c${i+1}`, name:i===37?'건지희':`연락처 ${String(i+1).padStart(3,'0')}`,
              image:'', labels:[i%2?'버튜버':'환승센터',i%5===0?'근본':''], notes:`note ${i}`,
              stationUrl:i%3===0?'https://example.com':'', pendingSetup:false, applicationHistory:[]
            })).map(c=>({...c,labels:c.labels.filter(Boolean)}));
            const events=Array.from({length:99},(_,i)=>({
              id:`e${i+1}`,title:`테스트 일정 ${i+1}`,date:'2099-12-'+String((i%28)+1).padStart(2,'0'),start:'20:00',end:'22:00',
              participants:[`c${(i%160)+1}`,`c${((i+37)%160)+1}`],participantStatuses:{},restDay:false,checklist:[],favorite:false,categoryId:''
            }));
            const fixture={version:52,categories:[],contacts,posts:[],events,collaborations:[],memos:[],targetList:[],contactTags:['버튜버','환승센터','근본'],contactTagBanners:{},scheduleClipboard:[],favoriteFolders:[],postViewMode:'card',postCardColumns:4,textScale:100,resolutionMode:'fhd',selfContactId:'',sidebarPinned:true,dashboardUpcomingHidden:false,timezones:[],theme:'neon',backgroundImage:'',backgroundDim:45,miniGames:{}};

            await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm',async route=>{
              const js=`
                const fixture=${JSON.stringify(fixture)};
                const builder=()=>({select(){return this},eq(){return this},order(){return this},limit(){return this},maybeSingle:async()=>({data:{data:fixture},error:null})});
                export function createClient(){return {
                  auth:{persistSession:true,signOut:async()=>({error:null}),getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),signInWithPassword:async()=>({error:new Error('not used in smoke test')})},
                  from:()=>builder(),rpc:async()=>({data:null,error:null}),functions:{invoke:async()=>({data:{},error:null})}
                }};
              `;
              await route.fulfill({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body:js});
            });

            await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#mwsAccessGate:not(.hidden)',{timeout:8000});
            await page.click('#mwsModePublic');
            await page.click('#mwsLoginSubmit');
            await page.waitForFunction(()=>!document.body.classList.contains('mws-gated'),null,{timeout:8000});

            const criticalTabs=['dashboard','calendar','contacts','posts','sniper','targets','memos','worldtime','gameLadder','gameRps','gamePachinko','gameMultiDraw','settings'];
            for(const tab of criticalTabs){ assert(await page.locator(`[data-tab="${tab}"]`).count()>0,`missing nav ${tab}`); }

            await page.click('[data-tab="contacts"]');
            await page.waitForSelector('#contactGrid .contact-card',{timeout:5000});
            const initialCount=await page.locator('#contactGrid .contact-card').count();
            assert(initialCount>=150,`unexpected contact card count ${initialCount}`);

            const start=Date.now();
            await page.fill('#contactSearch','건지희');
            await page.waitForFunction(()=>document.querySelectorAll('#contactGrid .contact-card').length===1 || [...document.querySelectorAll('#contactGrid .contact-card')].filter(x=>getComputedStyle(x).display!=='none').length===1,null,{timeout:2000});
            const searchMs=Date.now()-start;
            console.log(`CONTACT_SEARCH_MS=${searchMs}`);
            assert(searchMs<1500,`contact search too slow: ${searchMs}ms`);
            const visibleNames=await page.locator('#contactGrid .contact-card').evaluateAll(nodes=>nodes.filter(n=>getComputedStyle(n).display!=='none').map(n=>n.textContent));
            assert(visibleNames.some(x=>x.includes('건지희')),'search result missing target contact');

            await page.fill('#contactSearch','');
            await page.waitForTimeout(180);
            await page.selectOption('#contactSort','nameDesc');
            await page.waitForTimeout(80);

            for(const tab of ['calendar','dashboard','worldtime','gameLadder','gameRps','gamePachinko','gameMultiDraw','settings','contacts']){
              await page.click(`[data-tab="${tab}"]`);
              await page.waitForTimeout(30);
            }

            assert(pageErrors.length===0,`page errors: ${pageErrors.join(' | ')}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
