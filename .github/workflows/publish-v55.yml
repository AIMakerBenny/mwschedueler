name: Publish MAWANG Scheduler v5.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v55.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v5.4 production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "d5b533a9f08f57d256a9a36d2fdee7aa9a32e04c454d50f78a4dbb03b4c112c8"

      - name: Apply v5.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/v55_part_01.b64 .payload/v55_part_02.b64 | base64 -d | gzip -d > /tmp/v55.patch
          git apply /tmp/v55.patch

      - name: Verify v5.5 output
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "f16a8dec1aee11d83a28bb09bbb72323e62e742e0294a5419aab2b0cecfe91f2"
          grep -q 'id="v550-style"' index.html
          grep -q 'id="v550-feature-script"' index.html
          grep -q 'id="ctStationVisitBtn"' index.html
          grep -q 'dashboard-insights-v55' index.html
          grep -q 'mascotRainLayerV55' index.html
          grep -q 'position:fixed!important' index.html
          ! grep -Fq '</script>\n<script id="mws-supabase-cloud-layer"' index.html

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, pathlib, sys
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I)
          checked=0
          for i,(attrs,body) in enumerate(scripts):
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              p=pathlib.Path('/tmp')/f'mawang_v55_script_{i}.js'
              p.write_text(body, encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(r.returncode)
              checked+=1
          print(f'validated {checked} inline scripts')
          PY

      - name: Commit v5.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish MAWANG Scheduler v5.5 dashboard and UI fixes'
          git push origin HEAD:main
