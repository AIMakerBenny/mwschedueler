name: CSS and startup stage 3–7 regression
on:
  push:
    branches:
      - 'refactor/css-runtime-stage3-7-20261126'
    paths:
      - 'scripts/run-phase401-f1-skill-audit.mjs'
      - 'scripts/migrate-f1-style-audits.mjs'
      - 'scripts/run-recovery-*-f1-*-audit.mjs'
      - 'scripts/cleanup-css-stage37.mjs'
      - 'scripts/compare-css-stage37.mjs'
      - 'scripts/qa-request-budget-full-app-v2-browser.mjs'
      - '.github/workflows/qa-css-stage37.yml'
permissions:
  contents: write
env:
  MWS_QA_OFFLINE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate conservative source cleanup and F1 bundle
        run: |
          if test ! -f assets/f1-racing-bundle-v1.css; then node scripts/cleanup-css-stage37.mjs; fi
          if test ! -f docs/css-stage37/shadow-layout.json; then node scripts/cleanup-css-stage37.mjs --shadow-layout; fi
          node scripts/build-f1-css-bundle.mjs
          node scripts/build-f1-css-bundle.mjs --check
          node scripts/migrate-f1-style-audits.mjs
          node scripts/build-cf-static-runtime.mjs --check
          node --check assets/sidebar-hover-v2.js
          node --check assets/cf-static-cloud-core-v1.js
          node --check assets/post-login-runtime-v130.js
          node --check scripts/qa-request-budget-full-app-v2-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.html docs/css-stage37 scripts/run-phase*-f1-*-audit.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Consolidate shadowed sidebar and calendar layout declarations"
            git push origin HEAD:refs/heads/refactor/css-runtime-stage3-7-20261126
          fi
      - name: Save candidate revision
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.head.outputs.sha }}
  compare:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        viewport: ['1366,768', '1920,1080', '2560,1440', '390,844']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare actual app in offline browser
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        env:
          MWS_QA_VIEWPORT: ${{ matrix.viewport }}
        run: |
          git worktree add --detach /tmp/mws-baseline bfe8529df667a5b6b4b731ff999fc1711068a850
          MWS_QA_CSS_COMPARE=1 MWS_QA_SOURCE_ROOT=/tmp/mws-baseline MWS_QA_COMPARE_OUTPUT=/tmp/baseline.json node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_CSS_COMPARE=1 MWS_QA_COMPARE_OUTPUT=/tmp/candidate.json node scripts/qa-request-budget-full-app-v2-browser.mjs
          node scripts/compare-css-stage37.mjs /tmp/baseline.json /tmp/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-compare-${{ strategy.job-index }}
          path: |
            /tmp/baseline.json
            /tmp/candidate.json
  regression:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real app first paint, sidebar, group save and Request budgets
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          MWS_QA_FIRST_PAINT=1 node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_FIRST_PAINT=1 MWS_QA_FIRST_PAINT_WIDE=1 node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_SIDEBAR_HOVER=1 node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_BSANDONG=1 MWS_QA_IDLE_MODE=public node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_BSANDONG=1 MWS_QA_IDLE_MODE=admin node scripts/qa-request-budget-full-app-v2-browser.mjs
          node --test scripts/qa-calendar-groups-cloud-save-v1.test.mjs scripts/qa-active-cloudflare-core-groups-v1.test.mjs scripts/qa-bsandong-v1.test.mjs
          node scripts/qa-calendar-toolbar-v4-browser.mjs
          node scripts/qa-calendar-month-viewport-v2-browser.mjs
          node scripts/qa-bsandong-v1-browser.mjs
          node scripts/qa-workspace-navigation-v1-browser.mjs
          node scripts/run-current-full-integration-audit.mjs
  admin-batch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare cold Admin data reads and loaded parts
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          git worktree add --detach /tmp/mws-baseline bfe8529df667a5b6b4b731ff999fc1711068a850
          MWS_QA_ADMIN_BATCH=1 MWS_QA_SOURCE_ROOT=/tmp/mws-baseline MWS_QA_COMPARE_OUTPUT=/tmp/admin-before.json node scripts/qa-request-budget-full-app-v2-browser.mjs
          MWS_QA_ADMIN_BATCH=1 MWS_QA_ADMIN_EXPECT_MAX=1 MWS_QA_COMPARE_OUTPUT=/tmp/admin-after.json node scripts/qa-request-budget-full-app-v2-browser.mjs
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const b=JSON.parse(fs.readFileSync("/tmp/admin-before.json")),a=JSON.parse(fs.readFileSync("/tmp/admin-after.json"));assert.deepEqual(a.result,b.result);assert(a.partRequests<=b.partRequests);console.log("ADMIN_BATCH_COMPARE "+JSON.stringify({before:b.partRequests,after:a.partRequests,result:a.result}))'
