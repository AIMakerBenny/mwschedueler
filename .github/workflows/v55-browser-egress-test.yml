name: TEST V5.5 Browser Egress Verification

on:
  push:
    paths:
      - '.github/workflows/v55-browser-egress-test.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          mkdir -p /tmp/mws-v55-test
          cd /tmp/mws-v55-test
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run production Chromium egress verification
        run: |
          cat > /tmp/mws-v55-test/test.mjs <<'JS'
          import { chromium } from 'playwright';
          const URL='https://mawang0216-scheduler.vercel.app/';
          const SB='nysxcqlewzucbpoaymbg.supabase.co';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          const cdp=await context.newCDPSession(page);
          await cdp.send('Network.enable');
          let phase='boot';
          const phases={};
          const reqs=new Map();
          const consoleErrors=[];
          function bucket(p=phase){return phases[p]||(phases[p]={supabaseBytes:0,totalBytes:0,requests:[],partFetches:[],manifestRequests:0,imageRequests:0,imageNetworkBytes:0,imageCached:0})}
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push({phase,text:m.text()})});
          page.on('pageerror',e=>consoleErrors.push({phase,text:String(e)}));
          cdp.on('Network.requestWillBeSent',e=>reqs.set(e.requestId,{url:e.request.url,phase,type:e.type,status:0,cache:false}));
          cdp.on('Network.requestServedFromCache',e=>{const r=reqs.get(e.requestId);if(r)r.cache=true});
          cdp.on('Network.responseReceived',e=>{const r=reqs.get(e.requestId);if(r){r.status=e.response.status;r.cache=r.cache||!!e.response.fromDiskCache||!!e.response.fromPrefetchCache}});
          cdp.on('Network.loadingFinished',e=>{
            const r=reqs.get(e.requestId);if(!r)return;const b=bucket(r.phase);const bytes=Math.max(0,Number(e.encodedDataLength)||0);b.totalBytes+=bytes;
            const isSb=r.url.includes(SB);if(isSb)b.supabaseBytes+=bytes;
            let part='';try{const u=new URL(r.url);const q=u.searchParams.get('part');if(q?.startsWith('eq.'))part=q.slice(3)}catch{}
            if(part)b.partFetches.push(part);
            if(r.url.includes('/rpc/get_workspace_manifest'))b.manifestRequests++;
            const image=/\/functions\/v1\/(contact-image|workspace-image)/.test(r.url);if(image){b.imageRequests++;b.imageNetworkBytes+=bytes;if(r.cache)b.imageCached++}
            if(isSb)b.requests.push({url:r.url,status:r.status,bytes,cache:r.cache,type:r.type});
          });
          async function waitCloud(){await page.waitForFunction(()=>window.__mwsCloudV55Loaded===true && !!window.__mwsV55Supabase,null,{timeout:30000})}
          async function waitHydrated(){await page.waitForFunction(()=>!document.body.classList.contains('mws-gated'),null,{timeout:30000});await page.waitForTimeout(1200)}
          async function lowerVersion(store){return await page.evaluate(async store=>{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('mawang_data',2);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite'),os=tx.objectStore(store),g=os.get('public');g.onsuccess=()=>{const row=g.result;if(!row)return reject(new Error('missing '+store));const before=row.version;row.version=Math.max(0,Number(row.version)-1);os.put(row);tx.oncomplete=()=>resolve({before,after:row.version})};g.onerror=()=>reject(g.error)})},store)}

          phase='first_visit';
          await page.goto(URL,{waitUntil:'domcontentloaded',timeout:60000});await waitCloud();
          await page.click('#mwsModePublic');await page.click('#mwsLoginSubmit');await waitHydrated();
          const first=await page.evaluate(()=>window.mwsV55EgressReport?.());

          phase='second_visit';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});await waitCloud();await waitHydrated();
          const second=await page.evaluate(()=>window.mwsV55EgressReport?.());

          const eventVersion=await lowerVersion('events');
          phase='events_mismatch';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});await waitCloud();await waitHydrated();
          const events=await page.evaluate(()=>window.mwsV55EgressReport?.());

          const contactVersion=await lowerVersion('contacts');
          phase='contacts_mismatch';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});await waitCloud();await waitHydrated();
          const contacts=await page.evaluate(()=>window.mwsV55EgressReport?.());

          phase='lazy_minigames';
          await page.evaluate(()=>window.setTab?.('gameMultiDraw'));await page.waitForTimeout(1800);
          const lazy=await page.evaluate(()=>window.mwsV55EgressReport?.());

          phase='image_first';
          const imageUrl=await page.evaluate(()=>data?.contacts?.find(c=>/^https?:/.test(String(c.image||'')))?.image||'');
          if(imageUrl){await page.evaluate(async u=>{await new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=u;document.body.appendChild(i)})},imageUrl);await page.waitForTimeout(500)}
          phase='image_second';
          if(imageUrl){await page.evaluate(async u=>{await new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=u;document.body.appendChild(i)})},imageUrl);await page.waitForTimeout(500)}

          const summary={first:bucket('first_visit'),second:bucket('second_visit'),events:bucket('events_mismatch'),contacts:bucket('contacts_mismatch'),lazy:bucket('lazy_minigames'),imageFirst:bucket('image_first'),imageSecond:bucket('image_second'),eventVersion,contactVersion,client:{first,second,events,contacts,lazy},consoleErrors};
          console.log(JSON.stringify(summary,null,2));

          const firstParts=new Set(summary.first.partFetches),secondParts=new Set(summary.second.partFetches),eventParts=new Set(summary.events.partFetches),contactParts=new Set(summary.contacts.partFetches),lazyParts=new Set(summary.lazy.partFetches);
          if(firstParts.has('miniGames'))throw new Error('miniGames downloaded during first visit');
          if(secondParts.size)throw new Error('unchanged second visit downloaded body parts: '+[...secondParts].join(','));
          if(eventParts.size!==1||!eventParts.has('events'))throw new Error('events mismatch fetched: '+[...eventParts].join(','));
          if(contactParts.size!==1||!contactParts.has('contacts'))throw new Error('contacts mismatch fetched: '+[...contactParts].join(','));
          if(lazyParts.size!==1||!lazyParts.has('miniGames'))throw new Error('lazy miniGames fetched: '+[...lazyParts].join(','));
          if(consoleErrors.some(x=>/SyntaxError|ReferenceError|TypeError/.test(x.text)))throw new Error('JS console error: '+JSON.stringify(consoleErrors));
          await browser.close();
          JS
          cd /tmp/mws-v55-test
          node test.mjs
