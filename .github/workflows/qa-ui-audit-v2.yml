name: MWS integrated UI regression QA
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/content-applications-v1.css'
      - 'assets/content-applications-v2.js'
      - 'assets/content-applications-model-v1.js'
      - 'scripts/qa-content-applications-v1.test.mjs'
      - 'scripts/qa-content-applications-v1-browser.mjs'
      - 'scripts/calendar-browser-realtime.mjs'
      - 'assets/workspace-clean-v1.css'
      - 'assets/workspace-density-v1.css'
      - 'assets/sidebar-compact-v1.css'
      - 'assets/sidebar-rail-scrollbar-v1.css'
      - 'assets/achievement-exhibition-v1.css'
      - 'scripts/qa-ui-audit-v2-browser.mjs'
      - 'scripts/qa-dashboard-upcoming-v1.test.mjs'
      - 'scripts/qa-career-activities-v1-browser.mjs'
      - 'scripts/qa-mawang-archive-v1.test.mjs'
      - '.github/workflows/qa-ui-audit-v2.yml'
permissions:
  contents: read
jobs:
  integrated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Desktop and mobile Chromium regression
        run: node scripts/qa-ui-audit-v2-browser.mjs
      - name: Application deadlines, authors and public/read-only Chromium QA
        run: |
          node --test scripts/qa-content-applications-v1.test.mjs
          MWS_RANK_VISUAL=1 node scripts/qa-content-applications-v1-browser.mjs
      - name: Dashboard render count and zero-state regression
        run: node --test scripts/qa-dashboard-upcoming-v1.test.mjs
      - name: Archive and cache-version source regression
        run: node --test scripts/qa-mawang-archive-v1.test.mjs
      - name: Smooth historical timeline navigation regression
        run: node scripts/qa-career-activities-v1-browser.mjs
  timeline-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Real Chromium candidate timeline scroll and click QA
        env:
          CAREER_QA_MODE: desktop
        run: node scripts/qa-career-motion-browser.mjs
      - name: Mobile Chromium candidate timeline navigation QA
        env:
          CAREER_QA_MODE: mobile
        run: node scripts/qa-career-motion-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mws-ui-timeline-candidate
          path: career-qa/*.png
          if-no-files-found: ignore
