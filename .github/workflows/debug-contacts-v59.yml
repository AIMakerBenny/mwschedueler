name: Debug contacts renderer v5.9

on:
  push:
    paths:
      - '.github/workflows/debug-contacts-v59.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract contacts layout CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['.contact-board-layout','.contact-grid','.contact-tag-panel','#contactGrid','#contactTagList','.contact-tag-list','contacts-shell','contact-main','overflow:visible','position:sticky']
          out=[]
          for needle in needles:
            ms=list(re.finditer(re.escape(needle),s,re.I))
            out += ['', '='*72, f'NEEDLE {needle} COUNT {len(ms)}']
            for i,m in enumerate(ms[:25],1):
              a=max(0,m.start()-700);b=min(len(s),m.end()+1500)
              x=re.sub(r'\s+',' ',s[a:b].replace('\r',' ').replace('\n',' '))
              out.append(f'-- {i} OFFSET {m.start()} --')
              out.extend(textwrap.wrap(x,width=170,break_long_words=False,break_on_hyphens=False))
          Path('debug_contacts_v59_css.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug_contacts_v59_css.txt
          git commit -m 'Inspect contacts layout CSS' || exit 0
          git push
