name: Debug contacts renderer v5.9

on:
  push:
    paths:
      - '.github/workflows/debug-contacts-v59.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract contacts DOM
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for needle in ['id="contacts"','id="contactGrid"','id="contactTagList"','id="contactTagBannerArea"','id="pendingContacts"','id="incompleteContacts"','let contactView']:
            ms=list(re.finditer(re.escape(needle),s,re.I))
            out += [f'NEEDLE {needle} COUNT {len(ms)}']
            for m in ms[:6]:
              x=re.sub(r'\s+',' ',s[max(0,m.start()-1000):min(len(s),m.end()+2600)].replace('\r',' ').replace('\n',' '))
              out.extend(textwrap.wrap(x,width=160,break_long_words=False,break_on_hyphens=False))
            out.append('---')
          Path('debug_contacts_v59_dom.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug_contacts_v59_dom.txt
          git commit -m 'Inspect contacts DOM ids' || exit 0
          git push
