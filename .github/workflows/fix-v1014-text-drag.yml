name: Fix V1.0.14 text drag
on:
  push:
    branches: [mws-v1.0.14-planner-enhancements]
    paths: [.github/workflows/fix-v1014-text-drag.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.14-planner-enhancements
          fetch-depth: 0
      - run: python scripts/fix_v1014_text_drag.py
      - run: git diff --check
      - run: |
          git config user.name 'MAWANG Build'
          git config user.email 'actions@users.noreply.github.com'
          git add content-planner.html
          git commit -m 'Correct text selection and movement V1.0.14'
          git push origin HEAD:mws-v1.0.14-planner-enhancements
