name: Clean V1.0.10 stale assets
on:
  push:
    branches: [cloudflare-production]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0
      - name: Remove confirmed unused historical planner and tools artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            assets/content-planner-fix-03a.txt \
            assets/content-planner-fix-03b.txt \
            assets/content-planner-fix-10a.txt \
            assets/content-planner-fix-10b.txt \
            assets/content-planner-fix-11a.txt \
            assets/content-planner-fix-11b.txt \
            assets/content-planner-fix-12a.txt \
            assets/content-planner-fix-12b.txt \
            assets/content-planner-host-v104.js \
            assets/content-planner-payload-1.txt \
            assets/content-planner-payload-2.txt \
            assets/content-planner-payload-3.txt \
            assets/content-planner-payload-3a.txt \
            assets/content-planner-payload-3b.txt \
            assets/content-planner-payload-4.txt \
            assets/content-planner-payload-5.txt \
            assets/content-planner-payload-6.txt \
            assets/content-planner-payload-7.txt \
            assets/content-planner-payload-8.txt \
            assets/content-planner-payload-9.txt \
            assets/content-planner-payload-10.txt \
            assets/content-planner-payload-11.txt \
            assets/content-planner-payload-12.txt \
            assets/tools-v1.0.5.js \
            assets/tools-v1.0.6-b64-1.txt \
            assets/tools-v1.0.6-b64-2.txt \
            assets/tools-v1.0.6-b64-3.txt \
            assets/tools-v1.0.6-b64-4.txt \
            assets/tools-v1.0.6-b64-5.txt \
            assets/tools-v1.0.6-b64-6.txt \
            assets/tools-v1.0.6-b64-7.txt \
            assets/tools-v1.0.6-bridge.js \
            assets/tools-v1.0.6-final.js \
            assets/tools-v1.0.6-loader.js \
            assets/tools-v1.0.7-tier.js \
            assets/tools-v1.0.8-final.js \
            assets/tools-v1.0.9-ui.js
      - name: Static final V1.0.10 audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,re
          required=['_headers','content-planner.html','assets/content-planner-host.js','assets/perf-runtime.js','assets/tools.js','package.json']
          for f in required:
              assert Path(f).exists(), f
          pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          assert pkg.get('version')=='1.0.10', pkg.get('version')
          host=Path('assets/content-planner-host.js').read_text(encoding='utf-8')
          tools=Path('assets/tools.js').read_text(encoding='utf-8')
          planner=Path('content-planner.html').read_text(encoding='utf-8')
          assert 'content-planner.html?v=1.0.10' in host
          assert 'assets/tools.js?v=1.0.10' in host
          assert not re.search(r'tools-v1\.0\.[5-9]|content-planner-host-v104', host)
          assert 'CF MWS V 1.0.10' in tools
          assert '티어 게임' in tools and '2D Matrix Chart' in tools and '인물 관계도' in tools
          assert '<title>MAWANG Content Planner V1.0.10</title>' in planner
          stale=[]
          for p in Path('assets').iterdir():
              n=p.name
              if n=='content-planner-host-v104.js' or n.startswith('content-planner-payload-') or n.startswith('content-planner-fix-') or re.match(r'tools-v1\.0\.[5-9]',n): stale.append(n)
          assert not stale, stale
          print('STATIC_FINAL_AUDIT_OK='+json.dumps({'version':pkg['version'],'required':required,'stale':stale},ensure_ascii=False))
          PY
          node --check assets/content-planner-host.js
          node --check assets/perf-runtime.js
          node --check assets/tools.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('content-planner.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach((src,i)=>new vm.Script(src,{filename:`planner-${i}.js`}));
          console.log('PLANNER_JS_SYNTAX_OK scripts='+scripts.length);
          NODE
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Reverify Content Planner stages 1 2 3 after cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium }=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/content-planner.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#creatorMode.active');
            assert.match(await page.title(),/V1\.0\.10/);
            await page.getByRole('button',{name:'텍스트',exact:true}).click();
            await page.locator('.text-node .editable').fill('Final V1.0.10 cleanup verification');
            await page.locator('.top-actions').getByRole('button',{name:'저장',exact:true}).click();
            await page.locator('#canvasInfoTitle').fill('Final V1.0.10');
            await page.locator('#canvasInfoAuthor').fill('Release Audit');
            await page.locator('#canvasInfoSummary').fill('clean production verification');
            await page.locator('#canvasInfoModal').getByRole('button',{name:'저장',exact:true}).click();
            await page.waitForTimeout(400);
            assert.ok(await page.evaluate(()=>!!localStorage.getItem('mawang_content_planner_tabs_v104')));
            await page.getByRole('button',{name:'기획안 제출',exact:true}).click();
            await page.locator('#submitTitle').fill('Final V1.0.10 Proposal');
            await page.locator('#submitAuthor').fill('Release Audit');
            await page.locator('#submitSummary').fill('final regression');
            await page.locator('#submitBtn').click();
            await page.waitForFunction(()=>!document.getElementById('submitModal').classList.contains('open'));
            assert.strictEqual(await page.evaluate(async()=>await dbAll().then(x=>x.length)),1);
            await page.getByRole('button',{name:'기획안 확인',exact:true}).click();
            await page.waitForSelector('#archiveMode.active .proposal-card');
            await page.locator('#proposalGrid .proposal-card').click();
            await page.waitForSelector('#viewerModal.open');
            await page.getByRole('button',{name:'기존 기획안 수정',exact:true}).click();
            await page.waitForSelector('#creatorMode.active');
            const edit=await page.evaluate(()=>({id:state.activeProposalId,title:state.meta.title,elements:state.elements.length}));
            assert.ok(edit.id); assert.strictEqual(edit.title,'Final V1.0.10 Proposal'); assert.ok(edit.elements>=1);
            assert.deepStrictEqual(pageErrors,[]);
            assert.deepStrictEqual(consoleErrors.filter(x=>!x.includes('Failed to load resource')),[]);
            console.log('FINAL_BROWSER_OK='+JSON.stringify({stage1:'pass',stage2:'pass',stage3:'pass',edit,pageErrors,consoleErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit cleanup after all checks pass
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove obsolete pre-V1.0.10 planner and tools artifacts"
          git push origin HEAD:cloudflare-production
      - name: Remove temporary cleanup workflow
        if: success()
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/cleanup-v110-stale-assets.yml
          git commit -m "Remove temporary V1.0.10 cleanup workflow"
          git push origin HEAD:cloudflare-production
