name: Publish MAWANG Scheduler v5.2

on:
  push:
    paths:
      - '.github/workflows/publish-v52.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v5.1.1 base
        shell: bash
        run: |
          set -euo pipefail
          echo "4467a3069d1731e9e1727eb419f416b6dbf5efea9b32516d5a7b04c213e16471  index.html" | sha256sum -c -

      - name: Decode v5.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/v52_a.b64 .payload/v52_b.b64 | base64 -d | gzip -d > update.patch

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward index.html < update.patch

      - name: Verify v5.2 file
        shell: bash
        run: |
          set -euo pipefail
          echo "96e69d9093937e0e30578e46c57ffc87aeae55ea015d55c4ed5e0846253f691e  index.html" | sha256sum -c -
          grep -q "mws_device_preferences_v1" index.html
          grep -q "세션 전용 · 자동 저장 안 함" index.html
          grep -q "Public starts from the same shared workspace as Admin" index.html
          grep -q "nav-settings-divider" index.html
          if grep -q "d.memos=\[\]" index.html; then echo "Old Public memo stripping remains"; exit 1; fi
          if grep -q "d.targetList=\[\]" index.html; then echo "Old Public target stripping remains"; exit 1; fi
          if grep -q "if(isPublic())return" index.html; then echo "Old Public feature guard remains"; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['title="Gacha 뽑기"','class="nav-settings-divider"','title="가져오기 / 내보내기"','title="설정"']
          pos=[s.find(t) for t in terms]
          assert all(x >= 0 for x in pos), pos
          assert pos == sorted(pos), pos
          assert 'class="nav-bottom"' not in s
          assert 'data.version=51' not in s
          assert 'version:51' not in s
          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          checked=0
          for i,code in enumerate(scripts):
              if not code.strip():
                  continue
              p=Path(f'/tmp/mws_{i}.js')
              p.write_text(code, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)
              checked += 1
          print(f'validated {checked} inline scripts')
          PY

      - name: Commit v5.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish MAWANG Scheduler v5.2 public sandbox model"
          git push
