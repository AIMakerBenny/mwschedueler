name: Verify production Cloudflare Git deployment
on:
  push:
    branches: [cloudflare-production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-git-deployment-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/cloudflare-production'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify active Worker revision through management API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MWS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-cloudflare-deployment-v3.mjs; then exit 0; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 15
          done
