name: Majoku exact terminal AI contrast source preflight
on:
  push:
    branches: [f1-unified-redesign-v11-20261012]
    paths:
      - '.github/workflows/qa-f1-majoku-terminal-ai-contrast.yml'
      - 'scripts/qa-f1-v12-r5b169-terminal-cause-contrast.mjs'
      - 'scripts/qa-f1-v12-r5b170-preterminal-ai-transition.mjs'
      - 'scripts/qa-f1-v12-r5b171-terminal-source-coverage.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-terminal-ai-contrast-contract-against-archived-races:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual physics and all locked tracks unchanged
        run: git diff --exit-code b4a7c7547ee826d0d9cc91769cecdf162fcb93d5 HEAD -- assets/f1-racing-v1.js assets/f1-track-v1.js assets/f1-track-geometry-v2.js
      - name: Source syntax and precise terminal state unit tests
        run: |
          for phase in 169-terminal-cause-contrast 170-preterminal-ai-transition 171-terminal-source-coverage
          do node --check "scripts/qa-f1-v12-r5b$phase.mjs"; done
          node --check scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
          node --test scripts/qa-f1-v12-r5b165-terminal-witness.test.mjs
      - name: Download verified genuine prior Chromium race with terminal event counts
        uses: actions/download-artifact@v4
        with:
          repository: AIMakerBenny/mwschedueler
          run-id: 41572854132
          name: majoku-r5b96-focused-physical-20ms
          github-token: ${{ github.token }}
          path: artifacts/r5-b77-majoku
      - name: Require prior true engine termination ledger and zero collision stops
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const dir="artifacts/r5-b77-majoku/";
            const replay=JSON.parse(fs.readFileSync(dir+"replay.json","utf8"));
            assert.equal(replay.status,"PASS");
            assert.equal(replay.authenticPhysicsUnchanged,true);
            for(const [seed,starts,rapid,success] of [[1,219,22,2],[2,178,18,1]]){
              const race=JSON.parse(fs.readFileSync(dir+"seed"+seed+"-observed10.json","utf8"));
              const old=JSON.parse(fs.readFileSync(dir+"b163-terminal-reasons-by-driver.json","utf8"));
              const c=old.cases.find(x=>x.seed===seed);
              assert.equal(race.status,"PASS");assert(c);
              assert.equal(race.real20ms.attackLedger.totalStarts,starts);
              assert.equal(c.rapidRepeatAttemptStarts,rapid);
              assert.equal(c.terminalReasonCounts.SUCCESS,success);
              assert.equal(c.collisionStops,0);
            }
            console.log(JSON.stringify({phase:"R5-b172",status:"ARCHIVED_ENGINE_EVENT_INVARIANTS_PASS",
              trueOriginalChromiumRun:41572854132,realRaces:2,
              newTerminal20msWitnessesInOldArtifact:false,
              newRealRaceRunByThisPreflight:false,physicsChanged:false}));
          '
