name: Normalize Content Planner V1.0.10 Identifiers
on:
  push:
    branches: [cloudflare-production]
    paths: ['.github/workflows/normalize-planner-v110-identifiers.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0
      - name: Normalize internal version identifiers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('content-planner.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('v104-topbar','v110-topbar')
          s=s.replace('v104DefaultState','v110DefaultState')
          s=s.replace('V104','V110')
          s=s.replace('V105','V110')
          s=re.sub(r'\n?\s*/\* flattened: removed superseded [^*]+ \*/\s*', '\n', s)
          marker="const DRAFTS_KEY_V110='mawang_content_planner_tabs_v104';"
          if marker in s and 'Legacy storage key intentionally preserved' not in s:
              s=s.replace(marker,"// Legacy storage key intentionally preserved so existing V1.0.10 users keep their local canvas tabs.\n"+marker)
          assert s != original
          assert 'V104' not in s
          assert 'V105' not in s
          assert 'v104DefaultState' not in s
          assert 'v104-topbar' not in s
          assert s.count('mawang_content_planner_tabs_v104') == 1
          assert '<title>MAWANG Content Planner V1.0.10</title>' in s
          p.write_text(s,encoding='utf-8')
          print('NORMALIZED_OK')
          PY
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('content-planner.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach((src,i)=>new vm.Script(src,{filename:`planner-${i}.js`}));
          console.log('JS_SYNTAX_OK scripts='+scripts.length);
          NODE
          python3 <<'PY'
          from pathlib import Path
          import re,collections,json
          s=Path('content-planner.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          funcs=re.findall(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(',js)
          dup={k:v for k,v in collections.Counter(funcs).items() if v>1}
          old=sorted(set(re.findall(r'(?i)\bV?1\.0\.(?:[0-9]|[0-9][0-9])\b',s))-{'V1.0.10','v1.0.10','1.0.10'})
          print('POST_NORMALIZE_AUDIT='+json.dumps({'duplicate_functions':dup,'old_version_strings':old,'V104':s.count('V104'),'V105':s.count('V105'),'v104':s.count('v104'),'V110':s.count('V110'),'flattened_placeholders':s.count('flattened: removed superseded')},ensure_ascii=False))
          assert not dup
          assert not old
          assert s.count('V104')==0 and s.count('V105')==0
          assert s.count('flattened: removed superseded')==0
          PY
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Regression test normalized planner
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1600,height:1000}});
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/content-planner.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#creatorMode.active');
            assert.match(await page.title(),/V1\.0\.10/);
            await page.getByRole('button',{name:'텍스트',exact:true}).click();
            await page.locator('.text-node .editable').fill('V1.0.10 normalized');
            await page.locator('.top-actions').getByRole('button',{name:'저장',exact:true}).click();
            await page.locator('#canvasInfoTitle').fill('V1.0.10 Normalized');
            await page.locator('#canvasInfoAuthor').fill('Regression');
            await page.locator('#canvasInfoSummary').fill('identifier cleanup regression');
            await page.locator('#canvasInfoModal').getByRole('button',{name:'저장',exact:true}).click();
            await page.waitForTimeout(400);
            const localKeys=await page.evaluate(()=>({legacy:!!localStorage.getItem('mawang_content_planner_tabs_v104'),single:!!localStorage.getItem('mawang_content_planner_draft_v1')}));
            assert.ok(localKeys.legacy && localKeys.single,'legacy-compatible storage keys remain writable');
            await page.getByRole('button',{name:'기획안 제출',exact:true}).click();
            await page.locator('#submitTitle').fill('V1.0.10 Normalized Proposal');
            await page.locator('#submitAuthor').fill('Regression');
            await page.locator('#submitSummary').fill('normalized identifiers');
            await page.locator('#submitBtn').click();
            await page.waitForFunction(()=>!document.getElementById('submitModal').classList.contains('open'));
            assert.strictEqual(await page.evaluate(async()=>await dbAll().then(x=>x.length)),1);
            await page.getByRole('button',{name:'기획안 확인',exact:true}).click();
            await page.waitForSelector('#archiveMode.active .proposal-card');
            await page.locator('#proposalGrid .proposal-card').click();
            await page.waitForSelector('#viewerModal.open');
            await page.getByRole('button',{name:'기존 기획안 수정',exact:true}).click();
            await page.waitForSelector('#creatorMode.active');
            const edit=await page.evaluate(()=>({id:state.activeProposalId,title:state.meta.title,elements:state.elements.length}));
            assert.ok(edit.id);assert.strictEqual(edit.title,'V1.0.10 Normalized Proposal');assert.ok(edit.elements>=1);
            assert.deepStrictEqual(pageErrors,[]);
            assert.deepStrictEqual(consoleErrors.filter(x=>!x.includes('Failed to load resource')),[]);
            console.log('REGRESSION_OK='+JSON.stringify({localKeys,edit,pageErrors,consoleErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit normalized planner
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add content-planner.html
          git commit -m "Normalize Content Planner V1.0.10 internal identifiers"
          git push origin HEAD:cloudflare-production
      - name: Remove temporary normalization workflow
        if: always()
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/normalize-planner-v110-identifiers.yml
          git commit -m "Remove temporary V1.0.10 identifier normalization workflow"
          git push origin HEAD:cloudflare-production
