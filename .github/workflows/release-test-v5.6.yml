name: Publish TEST V5.6

on:
  push:
    branches:
      - release/test-v5.6-20260910

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/test-v5.6-20260910
          fetch-depth: 0

      - name: Patch production entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('TEST V5.5','TEST V5.6')
          tag='<script src="assets/test-v5.6.js"></script>'
          s=s.replace(tag,'')
          anchor='<script src="assets/test-v5.5.js"></script>'
          if anchor in s:
              s=s.replace(anchor,anchor+'\n'+tag,1)
          elif '</body>' in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              raise SystemExit('Could not find script insertion point')
          if s.count(tag)!=1:
              raise SystemExit('TEST V5.6 script must appear exactly once')
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/test-v5.6.js
          grep -q 'data-build-version="TEST V5.6"' index.html
          grep -q 'assets/test-v5.6.js' index.html

      - name: Commit TEST V5.6 entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
            exit 0
          fi
          git commit -m "Publish TEST V5.6"
          git push origin HEAD:release/test-v5.6-20260910
