name: Publish MAWANG Scheduler v5.9

on:
  push:
    paths:
      - '.github/workflows/publish-v59.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v5.9 contacts recovery patch
        run: |
          python apply_v59.py
      - name: Verify v5.9 anchors
        run: |
          grep -Fq 'id="v590-contact-recovery-script"' index.html
          grep -Fq 'function renderContactsV59' index.html
          grep -Fq 'function renderContactTagSidebarV59' index.html
          grep -Fq 'contact-load-status-v59' index.html
          grep -Fq "window.addEventListener('mawang:datachange'" index.html
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S),1):
              attrs=m.group(1) or ''
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'):
                  continue
              code=m.group(2)
              ext='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              path=Path(f'/tmp/inline-{i}{ext}')
              path.write_text(code,encoding='utf-8')
              blocks.append(str(path))
          Path('/tmp/inline-list.txt').write_text('\n'.join(blocks),encoding='utf-8')
          print('inline scripts:',len(blocks))
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            node --check "$f"
          done < /tmp/inline-list.txt
      - name: Publish v5.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish MAWANG Scheduler v5.9'
          git push
