name: Apply V1.0.12 planner save margin

on:
  push:
    branches: [cloudflare-production]
    paths:
      - .github/workflows/apply-v1012-planner-save-margin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          p = Path('content-planner.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '<title>MAWANG Content Planner V1.0.11</title>', '<title>MAWANG Content Planner V1.0.12</title>', 'planner title version')

          old_actions = '''    <div class="submit-action-stack"><button class="btn small primary" onclick="openSubmitModal(false)">기획안 제출</button><button class="btn small planner-fullscreen-enter" type="button" onclick="enterPlannerFullscreen()">전체화면</button></div>'''
          new_actions = '''    <button class="btn small planner-fullscreen-enter" type="button" onclick="enterPlannerFullscreen()">전체화면</button>'''
          s = replace_once(s, old_actions, new_actions, 'remove proposal submit button')

          old_modal_save = '''<div class="modal-actions"><button class="btn" onclick="closeModal('canvasInfoModal')">취소</button><button class="btn ok" onclick="saveCanvasInfo()">저장</button></div>'''
          new_modal_save = '''<div class="modal-actions"><button class="btn" onclick="closeModal('canvasInfoModal')">취소</button><button class="btn ok" id="canvasInfoSaveBtn" onclick="saveCanvasInfo()">저장</button></div>'''
          s = replace_once(s, old_modal_save, new_modal_save, 'canvas info save button id')

          old_wrap = '''.board-wrap{padding:0!important;width:100%!important;height:calc(100% - 54px)!important;min-width:0!important;min-height:0!important;overflow:hidden!important;position:relative!important;background:#fff!important}
#board{width:100%!important;height:100%!important;position:absolute!important;inset:0!important;transform-origin:center center!important;box-shadow:none!important;border-radius:0!important;overflow:hidden!important}'''
          new_wrap = '''.board-wrap{padding:0!important;width:100%!important;height:calc(100% - 54px)!important;min-width:0!important;min-height:0!important;overflow:hidden!important;position:relative!important;background:#060911!important;--planner-edge-gap:10px}
#board{width:calc(100% - var(--planner-edge-gap))!important;height:calc(100% - var(--planner-edge-gap))!important;position:absolute!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;transform-origin:center center!important;box-shadow:none!important;border-radius:0!important;overflow:hidden!important}'''
          s = replace_once(s, old_wrap, new_wrap, 'planner right bottom margin')

          pattern = re.compile(r'''function saveCanvasInfo\(\)\{\n  const ids=.*?\n\}''', re.S)
          replacement = '''async function saveCanvasInfo(){
  const btn=$('canvasInfoSaveBtn'),oldLabel=btn?.textContent||'저장';
  const ids=[...canvasInfoParticipantSelectionV110],title=$('canvasInfoTitle').value.trim()||'새 메모',author=$('canvasInfoAuthor').value.trim(),summary=$('canvasInfoSummary').value.trim();
  state.meta={...state.meta,title,author,summary,participantIds:ids};syncCurrentDocumentV110();touch();
  if(btn){btn.disabled=true;btn.textContent='저장 중...'}
  try{
    const canvas=await renderBoardToCanvas(),preview=canvas.toDataURL('image/png',.88),existingId=state.activeProposalId||'',id=existingId||uid(),now=new Date().toISOString(),old=existingId?await dbGet(id):null;
    const payload={id,title,author,summary,createdAt:old?.createdAt||now,updatedAt:now,participants:proposalParticipantsV110(),preview,canvas:deep(state)};
    payload.canvas.activeProposalId=id;await submitProposalToBackend(payload);state.activeProposalId=id;syncCurrentDocumentV110();touch();closeModal('canvasInfoModal');await renderArchive();toast(old?'저장 및 기획안 업데이트 완료':'저장 및 기획안 등록 완료')
  }catch(err){console.error('Canvas save and archive failed',err);alert('저장 실패: '+(err?.message||err))}
  finally{if(btn){btn.disabled=false;btn.textContent=oldLabel}}
}'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'saveCanvasInfo patch: expected 1 occurrence, found {n}')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/content-planner-host.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* CF MWS V 1.0.10 - consolidated Content Planner host + single tools bundle */', '/* CF MWS V 1.0.12 - consolidated Content Planner host + single tools bundle */', 1)
          s = replace_once(s, "const BUILD='CF MWS V 1.0.11';", "const BUILD='CF MWS V 1.0.12';", 'host build')
          s = replace_once(s, "const FRAME_URL='/content-planner.html?v=1.0.11';", "const FRAME_URL='/content-planner.html?v=1.0.12';", 'host planner cache version')
          s = replace_once(s, "const TOOLS_URL='/assets/tools.js?v=1.0.11';", "const TOOLS_URL='/assets/tools.js?v=1.0.12';", 'host tools cache version')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/tools.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '/* CF MWS V 1.0.11 - immediate cloud tool hydration + KST */', '/* CF MWS V 1.0.12 - immediate cloud tool hydration + KST */', 'tools comment version')
          s = replace_once(s, "const BUILD='CF MWS V 1.0.11';", "const BUILD='CF MWS V 1.0.12';", 'tools build')
          p.write_text(s, encoding='utf-8')

          p = Path('src/cf-v571.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "const BUILD_VERSION = 'CF MWS V 1.0.11';", "const BUILD_VERSION = 'CF MWS V 1.0.12';", 'worker build')
          s = replace_once(s, "body.mode = 'cf-mws-v1.0.11';", "body.mode = 'cf-mws-v1.0.12';", 'worker mode')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'CF MWS V 1.0.11' not in s:
              raise SystemExit('index version string not found')
          p.write_text(s.replace('CF MWS V 1.0.11', 'CF MWS V 1.0.12'), encoding='utf-8')

          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('version') != '1.0.11':
              raise SystemExit(f"package version expected 1.0.11, found {data.get('version')}")
          data['version'] = '1.0.12'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'Current release: CF MWS V1.0.11', 'Current release: CF MWS V1.0.12', 'README release')
          marker = '## CF MWS V1.0.11\n'
          section = '''## CF MWS V1.0.12

- Makes the Content Planner Save action create or update the matching proposal archive entry automatically
- Removes the separate proposal submission button from the planner header
- Adds a thin 10 px visual margin on the right and bottom edges of the working canvas

'''
          if marker not in s:
              raise SystemExit('README V1.0.11 section marker not found')
          p.write_text(s.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Commit release patch
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add content-planner.html assets/content-planner-host.js assets/tools.js src/cf-v571.js index.html package.json README.md
          git commit -m "Release CF MWS V1.0.12 planner save and canvas margin"
          git push origin HEAD:cloudflare-production
