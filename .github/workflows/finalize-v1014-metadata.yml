name: Finalize V1.0.14 metadata
on:
  push:
    branches: [mws-v1.0.14-planner-enhancements]
    paths: [.github/workflows/finalize-v1014-metadata.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.14-planner-enhancements
          fetch-depth: 0
      - run: python scripts/finalize_v1014_metadata.py
      - run: git diff --check
      - run: |
          git config user.name 'MAWANG Build'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html README.md
          git commit -m 'Align V1.0.14 visible version and production docs'
          git push origin HEAD:mws-v1.0.14-planner-enhancements
