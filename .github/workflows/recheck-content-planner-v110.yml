name: Recheck Content Planner V1.0.10
on:
  push:
    branches: [cloudflare-production]
    paths: ['.github/workflows/recheck-content-planner-v110.yml']
permissions:
  contents: write
jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0
      - name: Static legacy and syntax audit
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, collections, json
          p=Path('content-planner.html')
          s=p.read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          funcs=re.findall(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(',scripts)
          dup={k:v for k,v in collections.Counter(funcs).items() if v>1}
          old_versions=sorted(set(re.findall(r'(?i)\bV?1\.0\.(?:[0-9]|[0-9][0-9])\b',s)) - {'V1.0.10','v1.0.10','1.0.10'})
          markers={x:s.count(x) for x in ['V104','V105','v104','v105','V1.0.9','V1.0.8','V1.0.7','V1.0.6','V1.0.5','V1.0.4']}
          lines=[]
          for i,line in enumerate(s.splitlines(),1):
              if re.search(r'V104|V105|v104|v105|V1\.0\.[0-9]',line):
                  lines.append((i,line.strip()[:500]))
          print('AUDIT_JSON='+json.dumps({
            'title_v110': '<title>MAWANG Content Planner V1.0.10</title>' in s,
            'old_version_strings': old_versions,
            'markers': markers,
            'function_count': len(funcs),
            'unique_function_count': len(set(funcs)),
            'duplicate_functions': dup,
            'flattened_placeholder_count': s.count('flattened: removed superseded'),
            'legacy_marker_lines': lines,
          },ensure_ascii=False))
          assert '<title>MAWANG Content Planner V1.0.10</title>' in s
          assert not old_versions, old_versions
          assert not dup, dup
          PY
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('content-planner.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach((src,i)=>new vm.Script(src,{filename:`planner-${i}.js`}));
          console.log('JS_SYNTAX_OK scripts='+scripts.length);
          NODE
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify planner 1-2-3 flow again
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1600,height:1000}});
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/content-planner.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#creatorMode.active');
            assert.match(await page.title(),/V1\.0\.10/);
            await page.getByRole('button',{name:'텍스트',exact:true}).click();
            assert.strictEqual(await page.locator('.text-node').count(),1);
            await page.locator('.text-node .editable').fill('V1.0.10 재검증');
            await page.locator('.top-actions').getByRole('button',{name:'저장',exact:true}).click();
            await page.locator('#canvasInfoTitle').fill('V1.0.10 Recheck');
            await page.locator('#canvasInfoAuthor').fill('Browser Recheck');
            await page.locator('#canvasInfoSummary').fill('legacy and regression recheck');
            await page.locator('#canvasInfoModal').getByRole('button',{name:'저장',exact:true}).click();
            await page.waitForTimeout(400);
            await page.getByRole('button',{name:'기획안 제출',exact:true}).click();
            await page.locator('#submitTitle').fill('V1.0.10 Recheck Proposal');
            await page.locator('#submitAuthor').fill('Browser Recheck');
            await page.locator('#submitSummary').fill('second verification');
            await page.locator('#submitBtn').click();
            await page.waitForFunction(()=>!document.getElementById('submitModal').classList.contains('open'));
            const proposalCount=await page.evaluate(async()=>await dbAll().then(x=>x.length));
            assert.strictEqual(proposalCount,1);
            await page.getByRole('button',{name:'기획안 확인',exact:true}).click();
            await page.waitForSelector('#archiveMode.active .proposal-card');
            await page.locator('#proposalGrid .proposal-card').click();
            await page.waitForSelector('#viewerModal.open');
            await page.getByRole('button',{name:'기존 기획안 수정',exact:true}).click();
            await page.waitForSelector('#creatorMode.active');
            const editState=await page.evaluate(()=>({id:state.activeProposalId,title:state.meta.title,elements:state.elements.length}));
            assert.ok(editState.id);
            assert.strictEqual(editState.title,'V1.0.10 Recheck Proposal');
            assert.ok(editState.elements>=1);
            assert.deepStrictEqual(pageErrors,[]);
            assert.deepStrictEqual(consoleErrors.filter(x=>!x.includes('Failed to load resource')),[]);
            console.log('BROWSER_RECHECK='+JSON.stringify({stage1:'pass',stage2:'pass',stage3:'pass',proposalCount,editState,pageErrors,consoleErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary recheck workflow
        if: always()
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/recheck-content-planner-v110.yml
          git commit -m "Remove temporary V1.0.10 planner legacy recheck"
          git push origin HEAD:cloudflare-production
