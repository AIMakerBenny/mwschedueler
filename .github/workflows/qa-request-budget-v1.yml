name: Request budget offline QA
on:
  push:
    branches: [request-budget-v1-safe-candidate]
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'assets/**'
      - 'src/**'
      - 'scripts/qa-request-budget*'
      - 'scripts/qa-workspace-read-batch-v1.test.mjs'
      - 'scripts/qa-public-read-sharing-v1.test.mjs'
      - '.github/workflows/qa-request-budget-v1.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: request-budget-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MWS_QA_OFFLINE: '1'
      NO_PROXY: 'localhost,127.0.0.1,mawang-scheduler.majoku.workers.dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Block production hostname for offline tests
        run: |
          printf '\n127.0.0.1 mawang-scheduler.majoku.workers.dev\n::1 mawang-scheduler.majoku.workers.dev\n' | sudo tee -a /etc/hosts >/dev/null
          node -e "require('node:dns').lookup('mawang-scheduler.majoku.workers.dev',{all:true},(e,a)=>{if(e||!a.length||a.some(x=>!['127.0.0.1','::1'].includes(x.address)))process.exit(1)})"
      - name: Network optimization and storage contracts
        run: |
          node --test scripts/qa-request-budget-v1.test.mjs scripts/qa-workspace-read-batch-v1.test.mjs scripts/qa-public-read-sharing-v1.test.mjs scripts/qa-request-budget-meter-v1.test.mjs scripts/qa-request-budget-regressions-v1.test.mjs scripts/qa-request-budget-navigation-v2.test.mjs
          node scripts/qa-achievement-cache-quota.mjs
          node --test scripts/qa-live-cloud-save-contract-v1.test.mjs
      - name: Local rank UI fixture
        run: node scripts/qa-content-applications-v1-browser.mjs
      - name: Cumulative application integration audit
        run: node scripts/run-current-full-integration-audit.mjs
      - name: Local calendar and contact UI regressions
        run: |
          node --test scripts/qa-content-applications-v1.test.mjs scripts/qa-calendar-groups-cloud-save-v1.test.mjs scripts/qa-active-cloudflare-core-groups-v1.test.mjs scripts/qa-login-ready-v2.test.mjs scripts/qa-ui-interactions-v1.test.mjs
          node scripts/qa-ui-interactions-v1-browser.mjs
          node scripts/qa-calendar-month-viewport-v2-browser.mjs
          node scripts/qa-workspace-navigation-v1-browser.mjs
          node scripts/qa-contact-card-readable-v1-browser.mjs
          node scripts/qa-mobile-calendar-layout-v2.mjs
      - name: Local archive and Hall of Fame UI regressions
        run: |
          node --test scripts/qa-mawang-archive-v1.test.mjs
          node scripts/qa-mawang-archive-v1-browser.mjs
          node scripts/qa-achievement-exhibition-v1-browser.mjs
          node scripts/qa-first-paint-guard-v1-browser.mjs
