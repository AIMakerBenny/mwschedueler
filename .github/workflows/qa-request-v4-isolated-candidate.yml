name: Request V4 isolated candidate
on:
  push:
    branches: [request-v4-public-media-candidate-nov24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: V4 candidate and existing V3 contracts, loopback only
        run: |
          bash scripts/mws-v3-network-only.sh node --test scripts/qa-request-v4-delivery.test.mjs scripts/qa-request-v4-builder.test.mjs scripts/qa-request-v3-cache-integrity.test.mjs scripts/qa-request-v3-live-cache.test.mjs scripts/qa-request-v3-feature-guards.test.mjs
          bash scripts/mws-v3-network-only.sh node --check mws-media-cache-sw.js
          bash scripts/mws-v3-network-only.sh node scripts/build-cf-static-runtime.mjs --check
  local-browser:
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual Chromium with isolated scheduler and CDN origins
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-v4-media-browser.mjs
  v3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original request, save and UI regressions, loopback only
        run: |
          bash scripts/mws-v3-network-only.sh node --test scripts/qa-request-budget-v1.test.mjs scripts/qa-workspace-read-batch-v1.test.mjs scripts/qa-public-read-sharing-v1.test.mjs scripts/qa-request-budget-meter-v1.test.mjs scripts/qa-request-budget-regressions-v1.test.mjs scripts/qa-request-budget-navigation-v2.test.mjs scripts/qa-live-cloud-save-contract-v1.test.mjs scripts/qa-application-snapshot-v1.test.mjs
          bash scripts/mws-v3-network-only.sh node scripts/qa-mobile-calendar-layout-v2.mjs
          bash scripts/mws-v3-network-only.sh node scripts/qa-posts-responsive-layout-v2.mjs
          bash scripts/mws-v3-network-only.sh node scripts/qa-ui-audit-v2-browser.mjs
  production-management-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Active deployment identity, management GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MWS_EXPECTED_SHA: e34ad783397e67d088bb4687dd8b0b17bcf4ec05
        run: node scripts/verify-cloudflare-deployment-v3.mjs
      - name: Read-only domain and bucket inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-media-v4.mjs
