name: Request V4 isolated candidate
on:
  push:
    branches: [request-v4-public-media-candidate-nov24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: V4 candidate and existing V3 contracts, loopback only
        run: |
          bash scripts/mws-v3-network-only.sh node --test scripts/qa-request-v4-delivery.test.mjs scripts/qa-request-v3-cache-integrity.test.mjs scripts/qa-request-v3-live-cache.test.mjs scripts/qa-request-v3-feature-guards.test.mjs
          bash scripts/mws-v3-network-only.sh node --check mws-media-cache-sw.js
          bash scripts/mws-v3-network-only.sh node scripts/build-cf-static-runtime.mjs --check
  production-management-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Active deployment identity, management GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MWS_EXPECTED_SHA: e34ad783397e67d088bb4687dd8b0b17bcf4ec05
        run: node scripts/verify-cloudflare-deployment-v3.mjs
