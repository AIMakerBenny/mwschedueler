name: Diagnose Friend Finder Payload

on:
  push:
    branches:
      - diag-friendfinder-payload-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for Phase 61 production asset
        run: |
          set -euo pipefail
          URL='https://mawang-scheduler.majoku.workers.dev/assets/cloud-v1.1-loader.js'
          for i in {1..36}; do
            body="$(curl -fsSL --max-time 15 "$URL?ui-test=$i-$(date +%s)" || true)"
            if [[ "$body" == *"friend-finder-v120.js?v=1.3.0-phase61"* ]]; then
              echo 'Phase 61 production asset detected.'
              exit 0
            fi
            sleep 5
          done
          echo 'Phase 61 production asset was not detected.' >&2
          exit 1
      - name: Install browser driver
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts puppeteer-core@24.31.0
      - name: Verify visible LIVE thumbnail in Chromium
        env:
          TARGET: https://mawang-scheduler.majoku.workers.dev/
        run: |
          node <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:process.env.CHROME,
            args:['--no-sandbox','--disable-setuid-sandbox','--window-size=1920,1080']
          });
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1920,height:1080,deviceScaleFactor:1});
            page.on('console',msg=>console.log('BROWSER_CONSOLE',msg.type(),msg.text()));
            page.on('pageerror',err=>console.log('BROWSER_PAGE_ERROR',String(err)));

            await page.goto(process.env.TARGET+'?browser-check='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#mwsAccessGate',{timeout:30000});

            const publicButton=await page.$('#mwsModePublic');
            if(publicButton)await publicButton.click();
            await page.waitForSelector('#mwsLoginSubmit',{visible:true,timeout:30000});
            await page.click('#mwsLoginSubmit');

            await page.waitForFunction(()=>window.__mwsAppReadyV130===true,{timeout:60000});
            await page.waitForFunction(()=>!document.body.classList.contains('mws-gated'),{timeout:60000});
            await page.waitForSelector('.nav button[data-tab="friendFinder"]',{visible:true,timeout:30000});
            await page.click('.nav button[data-tab="friendFinder"]');

            await page.waitForSelector('#friendFinder.active',{visible:true,timeout:30000});
            await page.waitForFunction(()=>{
              const cards=[...document.querySelectorAll('#friendFinder .friend-finder-card-v5.live')];
              return cards.length>0;
            },{timeout:60000});

            const liveCards=await page.$$('#friendFinder .friend-finder-card-v5.live');
            console.log('LIVE_CARD_COUNT',liveCards.length);
            for(let i=0;i<liveCards.length;i++){
              await liveCards[i].evaluate(el=>el.scrollIntoView({block:'center',inline:'nearest'}));
              await new Promise(resolve=>setTimeout(resolve,700));
            }
            await new Promise(resolve=>setTimeout(resolve,7000));

            const result=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('#friendFinder .friend-finder-card-v5.live')];
              const rect=x=>x?Object.fromEntries(['x','y','width','height'].map(k=>[k,Math.round(x.getBoundingClientRect()[k])])):null;
              const rows=cards.map(card=>{
                const screen=card.querySelector('.mws-live-screen-v120');
                const img=screen?.querySelector('img');
                const watch=card.querySelector('[data-watch]')?.dataset?.watch||'';
                const name=card.querySelector('.friend-finder-name-v5')?.textContent?.trim()||'';
                return {
                  name,
                  watch,
                  screenExists:Boolean(screen),
                  screenHidden:Boolean(screen?.hidden),
                  screenClass:screen?.className||'',
                  src:img?.currentSrc||img?.src||'',
                  complete:Boolean(img?.complete),
                  naturalWidth:Number(img?.naturalWidth||0),
                  naturalHeight:Number(img?.naturalHeight||0),
                  imageRect:rect(img),
                  screenRect:rect(screen),
                  cardRect:rect(card)
                };
              });
              const expected=rows.filter(row=>row.watch);
              const loaded=expected.filter(row=>row.screenExists&&!row.screenHidden&&row.complete&&row.naturalWidth>100&&row.naturalHeight>50&&row.imageRect?.width>100&&row.imageRect?.height>50);
              return {liveCards:cards.length,expected:expected.length,loaded:loaded.length,rows};
            });
            console.log('ALL_THUMBNAIL_RESULT',JSON.stringify(result));
            if(!result.expected)throw new Error('No LIVE cards with watch URLs were available for verification');
            if(result.loaded!==result.expected){
              const failed=result.rows.filter(row=>row.watch&&!(row.screenExists&&!row.screenHidden&&row.complete&&row.naturalWidth>100&&row.naturalHeight>50&&row.imageRect?.width>100&&row.imageRect?.height>50));
              throw new Error('Not all LIVE thumbnails loaded: '+JSON.stringify(failed));
            }

            fs.mkdirSync('/tmp/mws-browser',{recursive:true});
            await page.screenshot({path:'/tmp/mws-browser/friend-finder-live.png',fullPage:true});
          }finally{
            await browser.close();
          }
          NODE
      - name: Upload Friend Finder screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friend-finder-live-browser-check
          path: /tmp/mws-browser/friend-finder-live.png
          if-no-files-found: ignore
