name: Entry announcement carousel browser QA
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/announcement-carousel-v1.*'
      - 'assets/announcements/**'
      - 'assets/app-core.js'
      - 'assets/cloud-v1.1.js'
      - 'assets/cloud-runtime-v130.js'
      - 'scripts/qa-live-cloud-save-contract-v1.test.mjs'
      - 'scripts/qa-announcement-carousel-v1-browser.mjs'
      - 'scripts/qa-public-entry-v1-browser.mjs'
      - 'scripts/qa-login-ready-v2.test.mjs'
      - 'src/cf-v111-entry.js'
      - '.github/workflows/qa-announcement-carousel-v1.yml'
permissions:
  contents: read
env:
  MWS_QA_OFFLINE: '1'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node --check assets/announcement-carousel-v1.js
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/qa-announcement-carousel-v1-browser.mjs
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node --test scripts/qa-login-ready-v2.test.mjs
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node --test scripts/qa-live-cloud-save-contract-v1.test.mjs
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/qa-public-entry-v1-browser.mjs
