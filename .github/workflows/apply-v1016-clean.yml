name: Apply CF MWS V1.0.16 clean

on:
  push:
    branches: [mws-v1.0.16-planner-fixes]
    paths:
      - .github/workflows/apply-v1016-clean.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.16-planner-fixes
          fetch-depth: 0

      - name: Reapply the already validated V1.0.16 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-v1016-planner-fixes.yml').read_text(encoding='utf-8')
          start=src.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=src.index("          PY\n\n      - name: Static checks",start)
          lines=[]
          for line in src[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v1016_patch.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/v1016_patch.py

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'MAWANG Content Planner V1.0.16' content-planner.html
          grep -q 'participantMetricsV116' content-planner.html
          grep -q "function allStickersV114(){return \[...userStickersV114\]}" content-planner.html
          grep -q "tool==='select'&&!e.target.closest('.node')" content-planner.html
          grep -q 'object-fit:contain!important' content-planner.html
          grep -q 'mwsEmoticonDropV116' assets/content-planner-host.js
          grep -q 'addEmoticonFilesV116' assets/content-planner-host.js
          grep -q 'CF MWS V 1.0.16' index.html
          grep -q '"version": "1.0.16"' package.json
          git diff --check

      - name: Browser regression tests
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps
          python3 -m http.server 4173 >/tmp/mws-v1016-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1560,height:960}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/content-planner.html?v=1.0.16',{waitUntil:'load'});
            await page.waitForTimeout(200);
            await page.evaluate(()=>{contactDb=[{id:'p1',name:'마이곰이',image:'',labels:[]}];addParticipant('p1')});
            const a=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);
            await page.evaluate(()=>{const e=state.elements.find(x=>x.type==='participant');e.w=420;e.h=430;renderPositions()});
            const b=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);
            if(!(b>a*1.7))throw new Error('participant resize failed');
            await page.evaluate(()=>{setTool('select');const e=addTextAtV110(260,180,300,70);window.__tid=e.id});
            const node=page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"]`);
            await page.locator('#board').click({position:{x:1000,y:700},force:true});
            if(await node.locator('.drag-handle').isVisible())throw new Error('MOVE did not hide');
            await node.hover();if(await node.evaluate(n=>getComputedStyle(n).outlineStyle)!=='dashed')throw new Error('text hover missing');
            await node.click({force:true});if(!(await node.locator('.drag-handle').isVisible()))throw new Error('text reselect failed');
            await page.evaluate(()=>applyPlannerEmoticonsV114([]));if(await page.locator('#stickerGrid .sticker-pick').count())throw new Error('builtins remain');
            await page.evaluate(()=>applyPlannerEmoticonsV114([{id:'u1',name:'내 이모티콘',src:'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/%3E'}]));if(await page.locator('#stickerGrid .sticker-pick').count()!==1)throw new Error('custom emoticon failed');
            if(errors.length)throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit only intended source files
        shell: bash
        run: |
          rm -rf node_modules
          rm -f .github/workflows/apply-v1016-planner-fixes.yml .github/workflows/apply-v1016-clean.yml
          git config user.name 'MAWANG Build'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md package.json index.html content-planner.html assets/content-planner-host.js assets/tools.js assets/test-v5.5.js assets/test-v5.6.js src/cf-v571.js
          git add -u .github/workflows/
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep '^node_modules/' || true)"
          git commit -m 'Fix planner interactions and custom emoticons V1.0.16'
          git push origin HEAD:mws-v1.0.16-planner-fixes
