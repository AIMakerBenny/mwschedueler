name: Ladder three-step wizard browser QA
on:
  pull_request:
    branches: [cloudflare-production]
    paths:
      - 'index.html'
      - 'assets/ladder-wizard-v1.*'
      - 'assets/app-core.js'
      - 'scripts/qa-ladder-wizard-v1-browser.mjs'
      - '.github/workflows/qa-ladder-wizard-v1.yml'
permissions:
  contents: read
env:
  MWS_QA_OFFLINE: '1'
jobs:
  ladder-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node --check assets/ladder-wizard-v1.js
      - shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/qa-ladder-wizard-v1-browser.mjs
