name: Rebuild CF MWS V1.0.12 clean

on:
  push:
    branches:
      - mws-v1.0.12-clean-rebuild
    paths:
      - .github/workflows/rebuild-v1012-clean.yml
      - scripts/rebuild_v1012.py
      - scripts/regression_v1012.js

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.12-clean-rebuild
          fetch-depth: 0

      - name: Patch clean baseline directly
        run: python scripts/rebuild_v1012.py

      - name: Static integrity checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '"version": "1.0.12"' package.json
          grep -q 'MAWANG Content Planner V1.0.12' content-planner.html
          grep -q "const BUILD_VERSION = 'CF MWS V 1.0.12'" src/cf-v571.js
          grep -q 'toolTier.*miniGames' assets/cloud-v5.5.js
          grep -q 'toolMatrix.*miniGames' assets/cloud-v5.5.js
          grep -q 'toolRelations.*miniGames' assets/cloud-v5.5.js
          grep -q 'grid-template-columns:76vw 24vw' content-planner.html
          grep -q 'grid-template-rows:44vh 56vh' content-planner.html
          grep -q 'width:1600px!important;height:1000px!important' content-planner.html
          grep -q 'id="canvasInfoSaveBtn"' content-planner.html
          grep -q '저장 및 기획안 등록 완료' content-planner.html
          ! grep -q 'onclick="openSubmitModal(false)"' content-planner.html
          ! grep -q 'id="submitModal"' content-planner.html
          ! grep -q 'content-planner-v1.0.12.js' src/cf-v571.js
          ! grep -q 'mws-v1012-version-lock' src/cf-v571.js
          grep -q '"run_worker_first": \[' wrangler.jsonc
          ! grep -q '"run_worker_first": true' wrangler.jsonc
          git diff --check

      - name: Check JavaScript syntax and flattened planner runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false acorn@8
          node --check assets/app-core.js
          node --check assets/cloud-v5.5.js
          node --check assets/tools.js
          node --check assets/test-v5.5.js
          node --check assets/test-v5.6.js
          node --check assets/content-planner-host.js
          node --check src/cf-v571.js
          node - <<'NODE'
          const fs=require('fs'),acorn=require('acorn');
          const html=fs.readFileSync('content-planner.html','utf8');
          const marker="<script>\n'use strict';";
          const open=html.indexOf(marker),start=open+'<script>\n'.length,close=html.indexOf('</script>',start);
          if(open<0||close<0)throw new Error('planner inline runtime not found');
          const js=html.slice(start,close),ast=acorn.parse(js,{ecmaVersion:'latest',sourceType:'script'}),seen=new Set(),dups=[];
          for(const n of ast.body){if(n.type==='FunctionDeclaration'&&n.id?.name){if(seen.has(n.id.name))dups.push(n.id.name);seen.add(n.id.name)}}
          if(dups.length)throw new Error('duplicate planner functions: '+[...new Set(dups)].join(','));
          if(html.includes('CF MWS V 1.0.5 planner update'))throw new Error('superseded planner layer returned');
          console.log('Planner flattened functions:',seen.size);
          NODE

      - name: Browser regression without production data
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps
          python3 -m http.server 4173 >/tmp/mws-http.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          node scripts/regression_v1012.js
          kill $SERVER_PID || true

      - name: Commit validated source only
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/app-core.js assets/cloud-v5.5.js assets/tools.js assets/test-v5.5.js assets/test-v5.6.js assets/content-planner-host.js content-planner.html index.html src/cf-v571.js package.json README.md
          git diff --cached --stat
          git commit -m "Rebuild CF MWS V1.0.12 cleanly from V1.0.10 baseline"
          git push origin HEAD:mws-v1.0.12-clean-rebuild
