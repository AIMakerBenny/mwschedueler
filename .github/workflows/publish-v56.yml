name: Publish MAWANG Scheduler v5.6

on:
  push:
    branches: [main]
    paths:
      - apply_v56.py
      - .github/workflows/publish-v56.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5.6 patch
        run: python apply_v56.py
      - name: Verify required v5.6 features
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="v560-ui-style"',
            'id="v560-feature-script"',
            'contactProfileCardModalV56',
            'v56-fixed',
            "['10','10회+'",
            'fx-tier-10',
            'Math.min(10,count30)',
            'Math.min(10,count)',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          print('v5.6 feature markers OK')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          out=pathlib.Path('/tmp/v56js'); out.mkdir(exist_ok=True)
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks): (out/f'{i:02d}.js').write_text(b,encoding='utf-8')
          print(len(blocks),'inline scripts')
          PY
          for f in /tmp/v56js/*.js; do node --check "$f"; done
      - name: Commit production index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production change to commit"
          else
            git commit -m "Publish MAWANG Scheduler v5.6"
            git push
          fi
