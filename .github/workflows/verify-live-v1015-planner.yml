name: Verify live CF MWS V1.0.15 planner read-only

on:
  push:
    branches: [mws-v1.0.15-planner-ui-final]
    paths:
      - .github/workflows/verify-live-v1015-planner.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://mawang-scheduler.majoku.workers.dev/api/health' -o /tmp/live-health.json
          grep -q 'CF MWS V 1.0.15' /tmp/live-health.json
          curl -fsSL 'https://mawang-scheduler.majoku.workers.dev/content-planner.html?v=1.0.15' -o /tmp/live-planner.html
          grep -q 'MAWANG Content Planner V1.0.15' /tmp/live-planner.html
          curl -fsSL 'https://mawang-scheduler.majoku.workers.dev/' -o /tmp/live-index.html
          grep -q 'CF MWS V 1.0.15' /tmp/live-index.html
      - name: Install browser
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Verify live planner UI without writes
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1560,height:960}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.route('**/*',async route=>{
              const req=route.request();
              if(!['GET','HEAD'].includes(req.method())) return route.abort();
              return route.continue();
            });
            await page.goto('https://mawang-scheduler.majoku.workers.dev/content-planner.html?v=1.0.15',{waitUntil:'load'});
            await page.waitForTimeout(500);
            const title=await page.title();if(!title.includes('V1.0.15'))throw new Error('wrong live planner title '+title);
            await page.evaluate(()=>{contactDb=[{id:'p1',name:'마이곰이',image:'',labels:[]}];addParticipant('p1')});
            const small=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);
            await page.evaluate(()=>{const e=state.elements.find(x=>x.type==='participant');e.w=560;e.h=480;render()});
            const large=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);
            if(!(large>small*2))throw new Error(`live avatar scale ${small}->${large}`);
            await page.evaluate(()=>{setTool('select');const e=addTextAtV110(220,180,300,70);window.__tid=e.id});
            const node=page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"]`);const before=await node.boundingBox();
            await node.dragTo(page.locator('#board'),{targetPosition:{x:850,y:520},force:true});await page.waitForTimeout(80);const after=await node.boundingBox();
            if(!before||!after||Math.hypot(after.x-before.x,after.y-before.y)<20)throw new Error('live text drag failed');
            await node.locator('.editable').dblclick({force:true});if(await node.locator('.editable').getAttribute('contenteditable')!=='true')throw new Error('live text edit failed');
            await page.evaluate(()=>document.activeElement?.blur());
            const close=await page.evaluate(()=>{selectedIds=[window.__tid];renderSelectionOnly();const s=getComputedStyle(document.querySelector(`.node[data-id="${window.__tid}"] .node-delete`));return{bg:s.backgroundColor,border:s.borderTopWidth,radius:s.borderRadius,shadow:s.boxShadow}});
            if(close.bg!=='rgba(0, 0, 0, 0)'||close.border!=='0px'||close.radius!=='0px'||close.shadow!=='none')throw new Error('live close styling '+JSON.stringify(close));
            await page.click('#toolBrush');await page.waitForTimeout(50);const pop=await page.evaluate(()=>{const m=document.getElementById('brushSizeMenu'),t=document.querySelector('.creator-toolbar'),r=m.getBoundingClientRect(),hit=document.elementFromPoint(r.left+10,r.top+10);return{hidden:m.hidden,w:r.width,h:r.height,hit:!!hit&&m.contains(hit),overflow:getComputedStyle(t).overflow}});
            if(pop.hidden||pop.w<200||pop.h<80||!pop.hit||pop.overflow!=='visible')throw new Error('live popup '+JSON.stringify(pop));
            const n0=await page.evaluate(()=>state.elements.filter(x=>x.type==='image').length);
            await page.evaluate(async()=>{const f=new File(['<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/>'],'drop.svg',{type:'image/svg+xml'}),dt=new DataTransfer();dt.items.add(f);document.getElementById('board').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt,clientX:520,clientY:420}));await new Promise(r=>setTimeout(r,250))});
            const n1=await page.evaluate(()=>state.elements.filter(x=>x.type==='image').length);if(n1<=n0)throw new Error('live image drop failed');
            await page.evaluate(()=>{setTool('brush');rememberDrawSize(11);setTool('eraser');rememberDrawSize(47)});const sizes=await page.evaluate(()=>({...drawToolSizesV114}));if(sizes.brush!==11||sizes.eraser!==47)throw new Error('live sizes '+JSON.stringify(sizes));
            await page.evaluate(()=>applyPlannerEmoticonsV114([{id:'user-test',name:'사용자 테스트',src:'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/%3E'}]));if(await page.locator('#stickerGrid .sticker-pick[title="사용자 테스트"]').count()!==1)throw new Error('live emoticon failed');
            if(errors.length)throw new Error('page errors '+errors.join(' | '));
            console.log('Live V1.0.15 read-only verification passed',{small,large,close,pop,sizes});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
