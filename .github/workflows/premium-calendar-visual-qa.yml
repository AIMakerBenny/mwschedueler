name: Premium calendar visual quality QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/qa-request-budget-full-app-v2-browser.mjs'
      - 'scripts/render-calendar-scene-v1.mjs'
      - 'scripts/import-calendar-scene-v2.mjs'
      - '.github/workflows/premium-calendar-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premium-calendar-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: '1366,768'
            label: desktop
          - viewport: '1920,1080'
            label: wide
          - viewport: '2560,1440'
            label: qhd
          - viewport: '2560,1080'
            label: ultrawide
          - viewport: '390,844'
            label: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify default calendar has no compulsory image
        run: |
          node --check assets/app-core.js
          node --check scripts/qa-request-budget-full-app-v2-browser.mjs
          ! grep -q -- '--calendar-atmosphere-art:' assets/workspace-clean-v1.css
          ! grep -q 'data-calendar-scene="photo"' index.html
      - name: Install Korean glyphs for accurate visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=ko
          fc-list :lang=ko | grep -q 'Noto Sans CJK'
      - name: Capture actual application with isolated synthetic fixtures
        env:
          MWS_QA_CALENDAR_VISUAL: '1'
          MWS_QA_VIEWPORT: ${{ matrix.viewport }}
          MWS_QA_VISUAL_CAPTURE: visual-captures
        run: node scripts/qa-request-budget-full-app-v2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-calendar-visual-${{ matrix.label }}
          path: visual-captures/
          if-no-files-found: error
