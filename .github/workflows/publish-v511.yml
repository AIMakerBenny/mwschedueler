name: Publish MAWANG Scheduler v5.1.1

on:
  push:
    paths:
      - '.payload/source_preview_removal_v511.patch.gz.b64'
      - '.github/workflows/publish-v511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify current production source
        shell: bash
        run: |
          set -euo pipefail
          echo "134737daab8a47cf2513286dae77d07ec3e16c44caaf4f835501356c82b11952  index.html" | sha256sum -c -

      - name: Apply v5.1.1 update
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .payload/source_preview_removal_v511.patch.gz.b64 | gzip -d > /tmp/v511.patch
          patch -p1 < /tmp/v511.patch
          echo "4467a3069d1731e9e1727eb419f416b6dbf5efea9b32516d5a7b04c213e16471  index.html" | sha256sum -c -

      - name: Verify source-preview removal
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="postOpenBtn">원문 열기</button>' index.html
          if grep -q 'id="postSourceTab"' index.html; then echo 'Legacy source tab still exists'; exit 1; fi
          if grep -q 'id="postSourcePanel"' index.html; then echo 'Legacy source panel still exists'; exit 1; fi
          if grep -q 'fetch(post.url' index.html; then echo 'Full source article fetch still exists'; exit 1; fi
          if grep -q 'post.sourcePhotos=' index.html; then echo 'Source image assignment still exists'; exit 1; fi
          if grep -q 'post.sourceContent=' index.html; then echo 'Source content assignment still exists'; exit 1; fi

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip():
                  continue
              p=Path(f'/tmp/mws_inline_{i}.js')
              p.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(r.returncode)
          print(f'Checked {len(scripts)} inline script blocks')
          PY

      - name: Update release note
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Current release: v5\.1$/Current release: v5.1.1/' README.md

      - name: Commit v5.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Remove source preview and source image sync"
          git push
