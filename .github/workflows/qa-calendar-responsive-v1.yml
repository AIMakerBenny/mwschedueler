name: Calendar responsive card geometry QA
on:
  pull_request:
    branches:
      - cloudflare-production
    paths:
      - 'index.html'
      - 'assets/calendar-responsive-cards-v1.css'
      - 'assets/mobile-calendar-v130.css'
      - 'assets/mobile-calendar-quick-add-v130.js'
      - 'assets/mobile-calendar-day-detail-v130.js'
      - 'assets/device-ui.js'
      - 'scripts/qa-mobile-calendar-layout-v2.mjs'
      - 'scripts/qa-calendar-responsive-v1-browser.mjs'
      - '.github/workflows/qa-calendar-responsive-v1.yml'
  push:
    branches:
      - 'fix/calendar-responsive-cards-v1-20261112'
permissions:
  contents: read
env:
  MWS_QA_OFFLINE: '1'
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Responsive calendar geometry in Chromium
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/qa-calendar-responsive-v1-browser.mjs
      - name: Mobile calendar geometry and interactions in Chromium
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/qa-mobile-calendar-layout-v2.mjs
      - name: Existing calendar ribbon and drag handle regression
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          node scripts/qa-calendar-continuous-series-browser-v1.mjs
          node scripts/qa-calendar-toolbar-v4-browser.mjs
          node scripts/qa-calendar-content-groups-v3-search-browser.mjs
