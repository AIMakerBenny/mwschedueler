name: Flatten Planner V1.0.10 Prep
on:
  push:
    branches: [mws-v1.0.10-direct-final]
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.10-direct-final
      - name: Rebuild exact planner HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          files = [
            'assets/content-planner-payload-1.txt',
            'assets/content-planner-payload-2.txt',
            'assets/content-planner-fix-03a.txt',
            'assets/content-planner-fix-03b.txt',
            'assets/content-planner-payload-4.txt',
            'assets/content-planner-payload-5.txt',
            'assets/content-planner-payload-6.txt',
            'assets/content-planner-payload-7.txt',
            'assets/content-planner-payload-8.txt',
            'assets/content-planner-payload-9.txt',
            'assets/content-planner-payload-10.txt',
            'assets/content-planner-payload-11.txt',
            'assets/content-planner-payload-12.txt',
          ]
          p=[Path(x).read_text(encoding='utf-8').strip() for x in files]
          p[10]=p[10].replace('tdTheD0Dh','tdTheD/0Dh')[:-1]
          p[11]='G'+p[11][:-1]
          p[12]='n'+p[12]
          raw=base64.b64decode(''.join(p))
          html=gzip.decompress(raw).decode('utf-8')
          expected='f29e6497db86727d8cbd4a3fea73bb2c266ea7ed98ee0a1cd14e575461e4d799'
          actual=hashlib.sha256(html.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'planner sha mismatch: {actual}')
          Path('content-planner.html').write_text(html,encoding='utf-8')
          print('planner bytes',len(html.encode()),'sha256',actual)
          PY
      - name: Commit flattened planner
        run: |
          if git diff --quiet -- content-planner.html; then
            echo "No planner diff"
            exit 0
          fi
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add content-planner.html
          git commit -m "Flatten exact V1.0.9 planner source for V1.0.10"
          git push origin HEAD:mws-v1.0.10-direct-final
