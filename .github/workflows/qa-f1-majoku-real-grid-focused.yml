name: Majoku Ring focused genuine 20ms QA
on:
  push:
    branches:
      - f1-unified-redesign-v11-20261012
    paths:
      - '.github/workflows/qa-f1-majoku-real-grid-focused.yml'
      - 'scripts/qa-f1-v12-r5b77-majoku-realgrid-replay.mjs'
      - 'scripts/qa-f1-v12-r5b96-ci-diagnostics.mjs'
      - 'scripts/qa-f1-v12-r5b1*.mjs'
      - 'scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs'
      - 'scripts/lib/f1-r5b1*.mjs'
      - 'scripts/qa-f1-v12-r5b137-attempt-context.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# R5-b90 isolates genuine Majoku verification from historical multi-track QA.
# Keep any already-running genuine full-race QA uninterrupted.
# Do not accumulate new pending independent runs for each diagnostic commit.
# GitHub may supersede older pending runs; that is not a test failure.
concurrency:
  group: majoku-real-grid-focused-development
  cancel-in-progress: false
jobs:
  # R5-b97: distinguish runner scheduling from Chromium, 10-lap, or
  # historical-artifact failures before allocating a long race runner.
  majoku-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout development SHA
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core JS and read-only witness contracts
        run: |
          node --check scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
          node --check scripts/qa-f1-v12-r5b77-majoku-realgrid-replay.mjs
          node --check scripts/qa-f1-v12-r5b96-ci-diagnostics.mjs
          node --test scripts/qa-f1-v12-r5b91-majoku-episode-contract.test.mjs
          node --test scripts/qa-f1-v12-r5b95-physical-compare.test.mjs
          node --test scripts/qa-f1-v12-r5b102-transitions.test.mjs
          node --test scripts/qa-f1-v12-r5b137-attempt-context.test.mjs
          node --test scripts/qa-f1-v12-r5b157-long-horizon.test.mjs
          node scripts/qa-f1-v12-r5b48-single-track-access.mjs
          node --test scripts/qa-f1-v12-r5b114-public-track-access-runtime.test.mjs
          node --test scripts/qa-f1-v12-r5b137-attempt-context.test.mjs
          node --test scripts/qa-f1-v12-r5b157-long-horizon.test.mjs
      - name: Upload preflight SHA and runner success receipt
        run: |
          mkdir -p artifacts
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("artifacts/majoku-preflight.json",JSON.stringify({phase:"R5-b97",status:"PREFLIGHT_PASSED_ON_RUNNER",sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,physicalReplayCompleted:false,aiTuningAuthorized:false},null,2));'
      - name: Upload preflight evidence when generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majoku-r5b97-preflight
          path: artifacts/majoku-preflight.json
          if-no-files-found: warn

  majoku-realgrid-evidence:
    needs: majoku-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout actual development SHA with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify game engine and baseline 10-lap runner remain untouched
        run: |
          git diff --exit-code b4a7c7547ee826d0d9cc91769cecdf162fcb93d5 HEAD -- \
            assets/f1-racing-v1.js assets/f1-track-v1.js assets/f1-track-geometry-v2.js \
            scripts/qa-f1-v12-r5b49-majoku-fullrace.mjs
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused QA syntax and single-track access regression
        run: |
          for f in scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs \
            scripts/qa-f1-v12-r5b77-majoku-realgrid-replay.mjs \
            scripts/qa-f1-v12-r5b78-majoku-realgrid-decision.mjs \
            scripts/qa-f1-v12-r5b80-majoku-realgrid-traffic.mjs \
            scripts/qa-f1-v12-r5b81-majoku-chase-evidence-gate.mjs \
            scripts/qa-f1-v12-r5b83-majoku-corridor-evidence.mjs \
            scripts/qa-f1-v12-r5b85-majoku-400ms-episode-evidence.mjs \
            scripts/qa-f1-v12-r5b87-majoku-frame-audit.mjs \
            scripts/qa-f1-v12-r5b88-majoku-physical-fingerprint.mjs \
            scripts/qa-f1-v12-r5b89-majoku-ai-evidence-gate.mjs \
            scripts/qa-f1-v12-r5b92-majoku-baseline-provenance.mjs \
            scripts/qa-f1-v12-r5b93-majoku-evidence-receipt.mjs \
            scripts/qa-f1-v12-r5b91-majoku-episode-contract.test.mjs \
            scripts/lib/f1-r5b91-episode-guards.mjs \
            scripts/lib/f1-r5b95-physical-compare.mjs \
            scripts/qa-f1-v12-r5b95-physical-compare.test.mjs \
            scripts/qa-f1-v12-r5b96-ci-diagnostics.mjs \
            scripts/qa-f1-v12-r5b100-pinned-baseline.mjs \
            scripts/qa-f1-v12-r5b101-majoku-physical-ledger.mjs \
            scripts/lib/f1-r5b102-transitions.mjs \
            scripts/qa-f1-v12-r5b102-transitions.test.mjs \
            scripts/qa-f1-v12-r5b103-real-baseline-mutations.test.mjs \
            scripts/qa-f1-v12-r5b104-full-physical-outcome-gate.mjs \
            scripts/qa-f1-v12-r5b129-attack-pair-retries.mjs \
            scripts/qa-f1-v12-r5b130-temporal-attempt-cohorts.mjs \
            scripts/qa-f1-v12-r5b131-disengagement-context.mjs \
            scripts/qa-f1-v12-r5b132-attack-trends-receipt.mjs \
            scripts/qa-f1-v12-r5b133-first-vs-repeat-outcomes.mjs \
            scripts/qa-f1-v12-r5b134-repeat-gap-sequences.mjs \
            scripts/qa-f1-v12-r5b135-retry-transition-matrix.mjs \
            scripts/qa-f1-v12-r5b136-rapid-retry-provenance.mjs \
            scripts/qa-f1-v12-r5b139-exact-retry-context.mjs \
            scripts/qa-f1-v12-r5b141-rapid-attack-velocity-evidence.mjs \
            scripts/qa-f1-v12-r5b143-rapid-attack-resource-context.mjs \
            scripts/qa-f1-v12-r5b145-relative-pace-resource-crosstab.mjs \
            scripts/qa-f1-v12-r5b147-attack-time-series.mjs \
            scripts/qa-f1-v12-r5b149-approach-recovery.mjs \
            scripts/qa-f1-v12-r5b150-attack-transition-order.mjs \
            scripts/qa-f1-v12-r5b151-attack-pair-concentration.mjs \
            scripts/qa-f1-v12-r5b153-gap-closure-vs-speed.mjs \
            scripts/qa-f1-v12-r5b154-opponent-attack-context.mjs \
            scripts/qa-f1-v12-r5b155-early-speed-vs-eventual-pass.mjs \
            scripts/lib/f1-r5b157-long-horizon.mjs \
            scripts/qa-f1-v12-r5b157-long-horizon.test.mjs \
            scripts/qa-f1-v12-r5b159-long-horizon-follow-through.mjs \
            scripts/lib/f1-r5b137-attempt-context.mjs \
            scripts/qa-f1-v12-r5b137-attempt-context.test.mjs \
            scripts/qa-f1-v12-r5b122-attack-attribution.mjs \
            scripts/qa-f1-v12-r5b123-attempt-lifecycle.mjs
          do node --check "$f"; done
          node scripts/qa-f1-v12-r5b48-single-track-access.mjs
          node --test scripts/qa-f1-v12-r5b91-majoku-episode-contract.test.mjs
          node --test scripts/qa-f1-v12-r5b95-physical-compare.test.mjs
          node --test scripts/qa-f1-v12-r5b102-transitions.test.mjs
          node --test scripts/qa-f1-v12-r5b137-attempt-context.test.mjs
          node --test scripts/qa-f1-v12-r5b157-long-horizon.test.mjs
      - name: Download original REAL Majoku 12-car 10-lap results
        uses: actions/download-artifact@v4
        with:
          repository: AIMakerBenny/mwschedueler
          run-id: 41460159785
          name: f1-v12-r5b49-r5b57-majoku-fullrace
          github-token: ${{ github.token }}
          path: artifacts
      - name: R5-b100 pin downloaded historical real-grid artifact SHA-256
        run: node scripts/qa-f1-v12-r5b100-pinned-baseline.mjs
      - name: R5-b101 independently verify physical passing and genuine pit ledger
        run: node scripts/qa-f1-v12-r5b101-majoku-physical-ledger.mjs
      - name: R5-b103 reject physics, pit and finish mutations in actual historical race data
        run: node --test scripts/qa-f1-v12-r5b103-real-baseline-mutations.test.mjs
      - name: R5-b92 confirm genuine 12-car 10-lap baseline artifact provenance
        run: node scripts/qa-f1-v12-r5b92-majoku-baseline-provenance.mjs
      - name: Install browser for authentic physical replay
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Replay exact two seeded 12-car 10-lap Majoku races with 20ms probe
        run: node scripts/qa-f1-v12-r5b77-majoku-realgrid-replay.mjs
      - name: R5-b78 through b89 original outcome and FOLLOW evidence gates
        run: |
          node scripts/qa-f1-v12-r5b78-majoku-realgrid-decision.mjs
          node scripts/qa-f1-v12-r5b80-majoku-realgrid-traffic.mjs
          node scripts/qa-f1-v12-r5b81-majoku-chase-evidence-gate.mjs
          node scripts/qa-f1-v12-r5b83-majoku-corridor-evidence.mjs
          node scripts/qa-f1-v12-r5b85-majoku-400ms-episode-evidence.mjs
          node scripts/qa-f1-v12-r5b87-majoku-frame-audit.mjs
          node scripts/qa-f1-v12-r5b88-majoku-physical-fingerprint.mjs
          node scripts/qa-f1-v12-r5b89-majoku-ai-evidence-gate.mjs
      - name: R5-b93 publish deterministic physical and advisory-only evidence receipt
        run: node scripts/qa-f1-v12-r5b93-majoku-evidence-receipt.mjs
      - name: R5-b104 require complete normalized ten-lap game outcomes to match
        run: node scripts/qa-f1-v12-r5b104-full-physical-outcome-gate.mjs
      - name: R5-b122 attribute exact-target genuine attacks to confirmed passes
        run: node scripts/qa-f1-v12-r5b122-attack-attribution.mjs
      - name: R5-b123 adjudicate confirmed, interrupted, and open attempt lifecycles
        run: node scripts/qa-f1-v12-r5b123-attempt-lifecycle.mjs
      - name: R5-b129 through b136 recheck true attempts and retry intervals
        run: |
          node scripts/qa-f1-v12-r5b129-attack-pair-retries.mjs
          node scripts/qa-f1-v12-r5b130-temporal-attempt-cohorts.mjs
          node scripts/qa-f1-v12-r5b131-disengagement-context.mjs
          node scripts/qa-f1-v12-r5b132-attack-trends-receipt.mjs
          node scripts/qa-f1-v12-r5b133-first-vs-repeat-outcomes.mjs
          node scripts/qa-f1-v12-r5b134-repeat-gap-sequences.mjs
          node scripts/qa-f1-v12-r5b135-retry-transition-matrix.mjs
          node scripts/qa-f1-v12-r5b136-rapid-retry-provenance.mjs
      - name: R5-b139 require exact 20ms context for all rapid retries and declare other missing starts
        run: node scripts/qa-f1-v12-r5b139-exact-retry-context.mjs
      - name: R5-b141 independently reconcile signed closing speed and final attack outcome
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b141-rapid-attack-velocity-evidence.mjs
      - name: R5-b143 require genuine same-step ERS tyre pace and strategy values for rapid retries
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b143-rapid-attack-resource-context.mjs
      - name: R5-b145 compare actual same-frame relative driver pace, ERS and tyre cohorts
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b145-relative-pace-resource-crosstab.mjs
      - name: R5-b147 verify each rapid attack exact-20ms 400ms window with missingness
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b147-attack-time-series.mjs
      - name: R5-b149 prove approach speed improves or worsens on actual 20ms frames
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b149-approach-recovery.mjs
      - name: R5-b150 validate temporal order of ERS deployment and attack state
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b150-attack-transition-order.mjs
      - name: R5-b151 validate driver-target concentration and sample limits
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b151-attack-pair-concentration.mjs
      - name: R5-b153 separate genuine progress-gap closure from relative-speed improvement
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b153-gap-closure-vs-speed.mjs
      - name: R5-b154 compare opposing AI intent without claiming safe alternate passing lanes
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b154-opponent-attack-context.mjs
      - name: R5-b155 crosscheck eventual physical 500ms-confirmed pass versus early approach
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b155-early-speed-vs-eventual-pass.mjs
      - name: R5-b159 test up to 70s real target and AI follow-through against exact frames
        env:
          MWS_F1_RACE_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-f1-v12-r5b159-long-horizon-follow-through.mjs
      - name: R5-b96 preserve an auditable per-file CI outcome manifest
        if: always()
        env:
          MWS_FOCUSED_QA_STEP_STATUS: ${{ job.status }}
        run: node scripts/qa-f1-v12-r5b96-ci-diagnostics.mjs
      - name: Upload real-grid results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majoku-r5b96-focused-physical-20ms
          path: |
            artifacts/r5-b77-majoku/
          if-no-files-found: warn
