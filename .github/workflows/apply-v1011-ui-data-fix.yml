name: Apply V1.0.11 UI and data fixes
on:
  push:
    branches: [cloudflare-production]
    paths:
      - .github/workflows/apply-v1011-ui-data-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0
      - name: Patch V1.0.11
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def must_replace(path, old, new, count=None):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n==0:
                  raise SystemExit(f'Missing replacement in {path}: {old[:120]!r}')
              if count is not None and n!=count:
                  raise SystemExit(f'Unexpected replacement count in {path}: expected {count}, got {n}')
              p.write_text(s.replace(old,new),encoding='utf-8')
              print(path, 'replaced', n)

          kst = r'''/* CF MWS V1.0.11 - Korea Standard Time normalization */
          (()=>{
            'use strict';
            if(window.__mwsKstV1011)return;
            window.__mwsKstV1011=true;
            const TZ='Asia/Seoul';
            const p=Date.prototype;
            const nativeString=p.toLocaleString;
            const nativeDate=p.toLocaleDateString;
            const nativeTime=p.toLocaleTimeString;
            const withTz=o=>o&&typeof o==='object'?({...o,timeZone:o.timeZone||TZ}):{timeZone:TZ};
            p.toLocaleString=function(locales,options){return nativeString.call(this,locales,withTz(options))};
            p.toLocaleDateString=function(locales,options){return nativeDate.call(this,locales,withTz(options))};
            p.toLocaleTimeString=function(locales,options){return nativeTime.call(this,locales,withTz(options))};
            const fmt=(value,options)=>{
              const d=value instanceof Date?value:new Date(value);
              if(Number.isNaN(d.getTime()))return '';
              return new Intl.DateTimeFormat('ko-KR',{timeZone:TZ,...options}).format(d);
            };
            window.mwsKstDateTime=value=>fmt(value,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).replace(/\. /g,'-').replace('.','').replace(/\.$/,'');
            window.mwsKstDate=value=>fmt(value,{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'-').replace('.','').replace(/\.$/,'');
            window.mwsKstTime=value=>fmt(value,{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
            document.documentElement.dataset.mwsTimezone=TZ;
            window.dispatchEvent(new CustomEvent('mws:timezone-ready',{detail:{timeZone:TZ}}));
          })();
          '''.replace('          ','')
          Path('assets/kst-v1.0.11.js').write_text(kst,encoding='utf-8')

          must_replace('index.html','<script src="assets/app-core.js"></script>','<script src="assets/app-core.js"></script>\n<script src="assets/kst-v1.0.11.js?v=1.0.11"></script>',1)
          must_replace('index.html','data-build-version="TEST V5.6"','data-build-version="CF MWS V 1.0.11"',1)
          must_replace('index.html','aria-label="현재 버전">TEST V5.4</div>','aria-label="현재 버전">CF MWS V 1.0.11</div>',1)

          p=Path('package.json'); pkg=json.loads(p.read_text(encoding='utf-8')); pkg['version']='1.0.11'; p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          must_replace('assets/content-planner-host.js',"const BUILD='CF MWS V 1.0.10';","const BUILD='CF MWS V 1.0.11';",1)
          must_replace('assets/content-planner-host.js',"const FRAME_URL='/content-planner.html?v=1.0.10';","const FRAME_URL='/content-planner.html?v=1.0.11';",1)
          must_replace('assets/content-planner-host.js',"const TOOLS_URL='/assets/tools.js?v=1.0.10';","const TOOLS_URL='/assets/tools.js?v=1.0.11';",1)

          must_replace('content-planner.html','<title>MAWANG Content Planner V1.0.10</title>','<title>MAWANG Content Planner V1.0.11</title>\n<script src="/assets/kst-v1.0.11.js?v=1.0.11"></script>',1)
          must_replace('content-planner.html','.top-actions{min-width:auto!important;position:relative!important;gap:8px!important}.btn{font-size:14px!important}.btn.small{font-size:13px!important;padding:9px 12px!important}', '.top-actions{min-width:auto!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important;flex-wrap:nowrap!important}.top-actions>.btn,.top-actions>.delete-canvas-wrap,.top-actions>.submit-action-stack{flex:0 0 auto!important}.submit-action-stack{display:flex!important;flex-direction:row!important;align-items:center!important;gap:8px!important}.top-actions .btn{min-height:40px!important;white-space:nowrap!important}.btn{font-size:14px!important}.btn.small{font-size:13px!important;padding:9px 12px!important}',1)
          must_replace('content-planner.html','body.planner-fullscreen #creatorMode.creator.active{display:grid!important;grid-template-columns:72vw 28vw!important;grid-template-rows:50vh 50vh!important;height:100vh!important;min-height:0!important}', 'body.planner-fullscreen #creatorMode.creator.active{display:grid!important;grid-template-columns:76vw 24vw!important;grid-template-rows:44vh 56vh!important;height:100vh!important;min-height:0!important}',1)
          must_replace('content-planner.html','body.planner-fullscreen #creatorMode .creator-toolbar{grid-column:2!important;grid-row:1!important;min-height:0!important;height:50vh!important;max-height:50vh!important;overflow:auto!important;align-content:flex-start!important;border-bottom:1px solid var(--line)!important}', 'body.planner-fullscreen #creatorMode .creator-toolbar{grid-column:2!important;grid-row:1!important;min-height:0!important;height:44vh!important;max-height:44vh!important;overflow:auto!important;align-content:flex-start!important;border-bottom:1px solid var(--line)!important}',1)
          must_replace('content-planner.html','body.planner-fullscreen #creatorMode .planner-fullscreen-blank{display:block!important;grid-column:2!important;grid-row:2!important;background:#070a12!important;border-left:1px solid var(--line)!important}', 'body.planner-fullscreen #creatorMode .planner-fullscreen-blank{display:block!important;grid-column:2!important;grid-row:2!important;width:24vw!important;height:56vh!important;background:transparent!important;border-left:1px solid var(--line)!important}',1)

          must_replace('assets/tools.js','/* CF MWS V 1.0.10 - consolidated tools, behavior-preserving */','/* CF MWS V 1.0.11 - immediate cloud tool hydration + KST */',1)
          must_replace('assets/tools.js',"const BUILD='CF MWS V 1.0.10';","const BUILD='CF MWS V 1.0.11';",1)
          must_replace('assets/tools.js',"${esc(String(x.updatedAt||'').replace('T',' ').slice(0,16))}","${esc(typeof window.mwsKstDateTime==='function'?window.mwsKstDateTime(x.updatedAt):String(x.updatedAt||'').replace('T',' ').slice(0,16))}",1)
          old="function install(){try{syncGlobals();ensureStyle();forceVersion();sections();nav();$('#toolRecords')?.remove();if(!ensure()){setTimeout(install,120);return}activateRequested();const active=kindFromId($('.section.active')?.id||'');if(active&&!editingToolField())render(active)}catch(e){console.error('MWS V1.0.9 clean tools install failed',e)}}"
          new="function install(){try{syncGlobals();ensureStyle();forceVersion();sections();nav();$('#toolRecords')?.remove();const report=typeof window.mwsV55EgressReport==='function'?window.mwsV55EgressReport():null;const miniReady=!report||!Array.isArray(report.loadedParts)||report.loadedParts.includes('miniGames');if(!miniReady){if(!install.__loadingMini){install.__loadingMini=true;Promise.resolve(window.mwsV55EnsureParts?.('gameLadder')).catch(e=>console.error('MWS V1.0.11 miniGames preload failed',e)).finally(()=>{install.__loadingMini=false;setTimeout(install,0)})}return}if(!ensure()){setTimeout(install,120);return}activateRequested();const active=kindFromId($('.section.active')?.id||'');if(active&&!editingToolField())render(active)}catch(e){console.error('MWS V1.0.11 tools install failed',e)}}"
          must_replace('assets/tools.js',old,new,1)

          must_replace('assets/cloud-v5.5.js',"gamePachinko:['miniGames'],gameMultiDraw:['miniGames'],export:['contactMeta','miniGames','notebook','clipboard'],", "gamePachinko:['miniGames'],gameMultiDraw:['miniGames'],toolTier:['miniGames'],toolMatrix:['miniGames'],toolRelations:['miniGames'],export:['contactMeta','miniGames','notebook','clipboard'],",1)

          must_replace('src/cf-v571.js',"const BUILD_VERSION = 'CF MWS V 1.0.8';","const BUILD_VERSION = 'CF MWS V 1.0.11';",1)
          must_replace('src/cf-v571.js',"body.mode = 'cf-v5.7.1-bundle';","body.mode = 'cf-mws-v1.0.11';",1)
          PY

          node --check assets/kst-v1.0.11.js
          node --check assets/tools.js
          node --check assets/content-planner-host.js
          node --check src/cf-v571.js

      - name: Verify requested changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "1.0.11"' package.json
          grep -q 'grid-template-columns:76vw 24vw' content-planner.html
          grep -q 'grid-template-rows:44vh 56vh' content-planner.html
          grep -q 'height:56vh' content-planner.html
          grep -q "mwsV55EnsureParts?.('gameLadder')" assets/tools.js
          grep -q "toolTier:\['miniGames'\]" assets/cloud-v5.5.js
          grep -q 'Asia/Seoul' assets/kst-v1.0.11.js
          grep -q 'CF MWS V 1.0.11' src/cf-v571.js

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html package.json content-planner.html assets/kst-v1.0.11.js assets/content-planner-host.js assets/tools.js assets/cloud-v5.5.js src/cf-v571.js
          git commit -m "Release CF MWS V1.0.11 timezone UI and tool hydration fixes"
          git push origin HEAD:cloudflare-production
          git rm .github/workflows/apply-v1011-ui-data-fix.yml
          git commit -m "Remove temporary V1.0.11 fix workflow"
          git push origin HEAD:cloudflare-production
