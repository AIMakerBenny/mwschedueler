name: Publish MAWANG Scheduler v5.7.1 hotfix

on:
  push:
    branches: [main]
    paths:
      - apply_hotfix_v571.py
      - .github/workflows/hotfix-v571.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable base
        run: |
          test "$(git hash-object index.html)" = "124bcf556e2a1aa73387d40e88fc573fb078d59b"
      - name: Apply narrow hotfix
        run: python apply_hotfix_v571.py
      - name: Verify only intended markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            "sb.rpc('save_shared_state'",
            "const rec=await fetchSoopBoardRecord(post)",
            "metaFromSoopRecord(rec).title",
            'mws-v5.7.1-storage-title-hotfix',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          if "sb.from('admin_state').upsert" in s or "sb.from('public_state').upsert" in s:
              raise SystemExit('Legacy large direct state upsert still present')
          print('hotfix markers OK')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          out=pathlib.Path('/tmp/v571js'); out.mkdir(exist_ok=True)
          files=[]
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S),1):
              attrs=m.group(1) or ''
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
              ext='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              f=out/f'{i:02d}{ext}'; f.write_text(m.group(2),encoding='utf-8'); files.append(str(f))
          pathlib.Path('/tmp/v571-list.txt').write_text('\n'.join(files),encoding='utf-8')
          print('inline scripts',len(files))
          PY
          while IFS= read -r f; do [ -z "$f" ] && continue; node --check "$f"; done < /tmp/v571-list.txt
      - name: Check patch scope
        run: |
          git diff -- index.html > /tmp/hotfix.diff
          grep -q "fetchSoopPostTitle" /tmp/hotfix.diff
          grep -q "save_shared_state" /tmp/hotfix.diff
          if grep -E "renderContacts|renderPosts\(|setTab\(|contactGrid|nav button" /tmp/hotfix.diff; then
            echo 'Unexpected global UI/category change detected'
            cat /tmp/hotfix.diff
            exit 1
          fi
      - name: Commit production hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hotfix storage timeout and SOOP title fallback"
          git push
