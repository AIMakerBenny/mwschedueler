name: Request V3 isolated candidate
on:
  push:
    branches: [request-v3-isolated-candidate-nov24]
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No-network contracts and generated runtime equivalence
        run: |
          bash scripts/mws-v3-network-only.sh node scripts/build-cf-static-runtime.mjs --check
          bash scripts/mws-v3-network-only.sh node --test scripts/qa-request-v3-shared-workspace.test.mjs scripts/qa-request-v3-read-defaults.test.mjs scripts/qa-request-v3-feature-guards.test.mjs
          bash scripts/mws-v3-network-only.sh node --check mws-media-cache-sw.js
  local-browser:
    needs: local-contracts
    strategy:
      fail-fast: false
      matrix:
        mode: [public, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MWS_QA_OFFLINE: '1'
      MWS_QA_SESSION: '1'
      MWS_QA_IDLE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser session using loopback only
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-budget-full-app-v2-browser.mjs
  local-media-cache:
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Persist 1005 versioned images using only loopback
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-v3-media-cache-browser.mjs
