name: Request V3 isolated candidate
on:
  push:
    branches: [request-v3-isolated-candidate-nov24]
permissions:
  contents: read
jobs:
  local-contracts:
    if: "!contains(github.event.head_commit.message, '[management-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No-network contracts and generated runtime equivalence
        run: |
          bash scripts/mws-v3-network-only.sh node scripts/build-cf-static-runtime.mjs --check
          bash scripts/mws-v3-network-only.sh node --test scripts/qa-request-v3-shared-workspace.test.mjs scripts/qa-request-v3-read-defaults.test.mjs scripts/qa-request-v3-feature-guards.test.mjs scripts/qa-request-v3-cache-integrity.test.mjs scripts/qa-request-v3-steam-search.test.mjs scripts/qa-request-v3-notice-cache.test.mjs scripts/qa-request-v3-live-cache.test.mjs scripts/qa-request-v3-application-batch.test.mjs scripts/qa-request-v3-deployment.test.mjs scripts/qa-request-v3-peer-workspace.test.mjs
          bash scripts/mws-v3-network-only.sh node --check mws-media-cache-sw.js
  local-browser:
    needs: local-contracts
    strategy:
      fail-fast: false
      matrix:
        mode: [public, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MWS_QA_OFFLINE: '1'
      MWS_QA_SESSION: '1'
      MWS_QA_IDLE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser session using loopback only
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-budget-full-app-v2-browser.mjs
  local-media-cache:
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Persist 1005 versioned images using only loopback
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-v3-media-cache-browser.mjs
  local-feature-browser:
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MWS_QA_OFFLINE: '1'
      MWS_QA_FEATURES_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Friend exit and hidden tab, fresh and expired applications
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-budget-full-app-v2-browser.mjs

  local-scale:
    needs: local-contracts
    strategy:
      fail-fast: false
      matrix:
        contacts: [100, 300, 500, 1000]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MWS_QA_OFFLINE: '1'
      MWS_QA_SCALE_CONTACTS: ${{ matrix.contacts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Large synthetic workspace, warm navigation, multiple tabs
        run: bash scripts/mws-v3-network-only.sh node scripts/qa-request-budget-full-app-v2-browser.mjs

  local-regression:
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MWS_QA_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all workflow YAML syntax
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |f| YAML.parse_file(f) }; puts "MWS_WORKFLOW_YAML_OK"'
      - name: Verify original request and save contracts
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          node --test scripts/qa-request-budget-v1.test.mjs scripts/qa-workspace-read-batch-v1.test.mjs scripts/qa-public-read-sharing-v1.test.mjs scripts/qa-request-budget-meter-v1.test.mjs scripts/qa-request-budget-regressions-v1.test.mjs scripts/qa-request-budget-navigation-v2.test.mjs scripts/qa-live-cloud-save-contract-v1.test.mjs scripts/qa-application-snapshot-v1.test.mjs
      - name: Desktop and mobile regression using loopback only
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: |
          node scripts/qa-mobile-calendar-layout-v2.mjs
          node scripts/qa-posts-responsive-layout-v2.mjs
          node scripts/qa-ui-audit-v2-browser.mjs
      - name: Existing cumulative integration contracts
        shell: bash scripts/mws-v3-network-only.sh bash -eo pipefail {0}
        run: node scripts/run-current-full-integration-audit.mjs
  production-management-read:
    if: contains(github.event.head_commit.message, '[management-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only active production identity, no Worker requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MWS_EXPECTED_SHA: e34ad783397e67d088bb4687dd8b0b17bcf4ec05
        run: |
          # Only read Cloudflare control-plane records. No Worker fetch.
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-cloudflare-deployment-v3.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          exit 1
