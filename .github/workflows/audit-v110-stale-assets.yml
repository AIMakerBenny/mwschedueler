name: Audit V1.0.10 stale assets
on:
  push:
    branches: [cloudflare-production]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0
      - name: Inventory stale planner and tools artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, json
          root=Path('.')
          candidates=[]
          for p in Path('assets').iterdir():
              n=p.name
              if (n=='content-planner-host-v104.js' or n.startswith('content-planner-payload-') or n.startswith('content-planner-fix-') or re.match(r'tools-v1\.0\.[5-9]', n)):
                  candidates.append(p)
          text_files=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              text_files.append((p,text))
          report=[]
          for c in sorted(candidates):
              refs=[]
              name=c.name
              rel=str(c).replace('\\','/')
              for p,text in text_files:
                  if p==c: continue
                  if name in text or rel in text:
                      refs.append(str(p).replace('\\','/'))
              report.append({'file':rel,'refs':refs})
          print('STALE_AUDIT='+json.dumps(report,ensure_ascii=False))
          referenced=[x for x in report if x['refs']]
          unreferenced=[x['file'] for x in report if not x['refs']]
          print('REFERENCED='+json.dumps(referenced,ensure_ascii=False))
          print('UNREFERENCED='+json.dumps(unreferenced,ensure_ascii=False))
          print('COUNTS='+json.dumps({'candidates':len(report),'referenced':len(referenced),'unreferenced':len(unreferenced)}))
          PY
      - name: Remove temporary audit workflow
        if: always()
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/audit-v110-stale-assets.yml
          git commit -m "Remove temporary V1.0.10 stale asset audit"
          git push origin HEAD:cloudflare-production
