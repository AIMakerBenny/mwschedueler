name: Reconstruct Majoku Castle payload

on:
  push:
    branches:
      - feature/majoku-castle-cloudflare-v2-20260916
    paths:
      - .github/majoku-reconstruct-trigger

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified staging branch
        run: |
          git fetch origin feature/majoku-castle-cloudflare-20260916:refs/remotes/origin/majoku-stage

      - name: Reconstruct and verify Majoku Castle
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/majoku.b64 /tmp/majoku.clean.b64 /tmp/majoku.gz /tmp/majoku.html
          mapfile -t PARTS < <(git ls-tree -r --name-only origin/majoku-stage -- .majoku-upload | sort)
          if [ "${#PARTS[@]}" -ne 15 ]; then
            echo "Expected 15 payload parts, found ${#PARTS[@]}"
            exit 1
          fi
          for part in "${PARTS[@]}"; do
            git show "origin/majoku-stage:${part}" >> /tmp/majoku.b64
          done
          python - <<'PY'
          from pathlib import Path
          import base64, re, sys
          raw = Path('/tmp/majoku.b64').read_text('utf-8', errors='replace')
          compact = ''.join(raw.split())
          bad = [(i, ch, ord(ch)) for i, ch in enumerate(compact) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
          print('payload_chars=', len(compact))
          print('bad_char_count=', len(bad))
          if bad:
              print('first_bad=', bad[:20])
              sys.exit(2)
          Path('/tmp/majoku.clean.b64').write_text(compact, encoding='ascii')
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              print('base64_validate_error=', repr(exc))
              sys.exit(3)
          Path('/tmp/majoku.gz').write_bytes(decoded)
          print('gzip_bytes=', len(decoded))
          PY
          gzip --test /tmp/majoku.gz
          gzip --decompress --stdout /tmp/majoku.gz > /tmp/majoku.html
          echo "decoded_bytes=$(wc -c < /tmp/majoku.html)"
          echo "decoded_sha256=$(sha256sum /tmp/majoku.html | awk '{print $1}')"
          test "$(sha256sum /tmp/majoku.html | awk '{print $1}')" = "649b587a5d440f61773ce0989d46a26393af6a307f3b54a61dea181220e6a296"
          grep -q "/api/soop/ws" /tmp/majoku.html
          grep -q "Majoku Castle" /tmp/majoku.html
          cp /tmp/majoku.html majoku-castle.html

      - name: Commit verified payload
        run: |
          set -euo pipefail
          git config user.name "MWS Majoku Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add majoku-castle.html
          if git diff --cached --quiet; then
            echo "No payload change"
            exit 0
          fi
          git commit -m "Add verified Majoku Castle 0.7.4 Cloudflare client"
          git push origin HEAD:feature/majoku-castle-cloudflare-v2-20260916
