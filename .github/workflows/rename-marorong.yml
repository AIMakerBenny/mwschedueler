name: Correct Marorong naming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-marorong.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct user-facing Marorong naming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            'alt="MAWANG mascot"':'alt="Marorong / 마로롱"',
            "mascot.alt='MAWANG mascot'":"mascot.alt='Marorong / 마로롱'",
            "creatorBtnV55.title='클릭하면 MAWANG 마스코트가 쏟아집니다'":"creatorBtnV55.title='클릭하면 마로롱이 쏟아집니다'",
          }
          for a,b in reps.items():
              if a not in s:
                  raise SystemExit(f'missing expected text: {a}')
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Marorong / 마로롱' index.html
          grep -q '클릭하면 마로롱이 쏟아집니다' index.html
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, pathlib, sys
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,(attrs,body) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I)):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              f=pathlib.Path('/tmp')/f'marorong_{i}.js'; f.write_text(body,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); sys.exit(r.returncode)
          PY
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Marorong naming in user-facing UI'
          git push origin HEAD:main
