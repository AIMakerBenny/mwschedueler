name: Export source snapshot

on:
  push:
    paths:
      - '.github/workflows/export-source.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            index.html
            README.md
            assets
          if-no-files-found: error
