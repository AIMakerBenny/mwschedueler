name: Apply CF MWS V1.0.16 planner fixes

on:
  push:
    branches: [mws-v1.0.16-planner-fixes]
    paths:
      - .github/workflows/apply-v1016-planner-fixes.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.16-planner-fixes
          fetch-depth: 0

      - name: Patch only current V1.0.15 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          def sub1(s,pat,repl,label,flags=0):
              out,n=re.subn(pat,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return out

          p=Path('content-planner.html')
          s=p.read_text(encoding='utf-8')
          if 'MAWANG Content Planner V1.0.15' not in s:
              raise SystemExit('baseline is not V1.0.15')

          s=s.replace('MAWANG Content Planner V1.0.15','MAWANG Content Planner V1.0.16',1)

          # Participant card: predictable proportional layout, live-resizable.
          s=sub1(s,r'\.participant-node\{.*?\.participant-meta,.tag-badge\{display:none!important\}',
          '.participant-node{background:linear-gradient(135deg,#12192b,#1d2740);color:#fff;border:1px solid #3a4b70;border-radius:14px;padding:0!important;display:block!important;position:absolute!important;overflow:hidden!important;box-sizing:border-box!important;min-width:100px!important;min-height:120px!important}.participant-avatar{position:absolute!important;left:50%!important;top:7%!important;transform:translateX(-50%)!important;aspect-ratio:1/1!important;border-radius:12%!important;background:#5e45ba!important;display:grid!important;place-items:center!important;font-weight:950!important;overflow:hidden!important;min-width:28px!important;min-height:28px!important}.participant-avatar img{width:100%!important;height:100%!important;display:block!important;object-fit:cover!important}.participant-name{position:absolute!important;left:5%!important;right:5%!important;bottom:5%!important;width:90%!important;text-align:center!important;font-weight:950!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.participant-meta,.tag-badge{display:none!important}',
          'participant css',flags=re.S)

          # Hover feedback, image containment.
          marker='.text-node{padding:7px 9px!important}.text-node .editable{height:auto!important;min-height:1.25em!important;overflow:visible!important;line-height:1.35!important;white-space:pre-wrap!important}.sticky-node .editable{height:auto!important;min-height:1.25em!important;overflow:visible!important;line-height:1.42!important}'
          if marker not in s: raise SystemExit('text override marker missing')
          s=s.replace(marker,marker+'.text-node:not(.selected):hover{outline:2px dashed rgba(124,92,255,.55)!important;outline-offset:3px!important;cursor:move!important}.text-node:not(.selected):hover .editable{cursor:move!important}.image-node{overflow:hidden!important;display:block!important}.image-node img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center!important;transform:none!important;display:block!important}',1)

          # Only user-added emoticons are shown.
          s=sub1(s,r"function allStickersV114\(\)\{.*?\}\nfunction stickerDataUriV110\(id\)\{.*?\}\nfunction renderStickerGridV110\(\)\{.*?\}\nfunction applyPlannerEmoticonsV114",
          "function allStickersV114(){return [...userStickersV114]}\nfunction stickerDataUriV110(id){const x=userStickersV114.find(s=>String(s.id)===String(id));return x?.src||''}\nfunction renderStickerGridV110(){const g=$('stickerGrid');if(!g)return;const ordered=allStickersV114();g.innerHTML=ordered.length?ordered.map(x=>`<button class=\"sticker-pick\" title=\"${esc(x.name)}\" onclick=\"beginStickerPlacement('${esc(x.id)}')\"><img src=\"${esc(x.src)}\" alt=\"${esc(x.name)}\"></button>`).join(''):'<div class=\"empty-state\" style=\"grid-column:1/-1;padding:18px\">추가된 이모티콘이 없습니다.</div>'}\nfunction applyPlannerEmoticonsV114",
          'user emoticons only',flags=re.S)

          # Helper updates participant internals from logical card size.
          node_marker='function nodeHtml(e){\n'
          helper="""function participantMetricsV116(e){const w=Math.max(100,Number(e?.w)||100),h=Math.max(120,Number(e?.h)||120),pad=Math.max(7,Math.min(20,Math.min(w,h)*.06)),nameH=Math.max(18,Math.min(46,h*.16)),av=Math.max(32,Math.min(w-pad*2,h-nameH-pad*2)),font=Math.max(9,Math.min(24,Math.min(w,h)*.085));return{av,font}}\nfunction applyParticipantMetricsV116(node,e){if(!node||e?.type!=='participant')return;const m=participantMetricsV116(e),av=node.querySelector('.participant-avatar'),name=node.querySelector('.participant-name');if(av){av.style.width=m.av+'px';av.style.height=m.av+'px';av.style.fontSize=Math.max(10,m.font*1.2)+'px'}if(name)name.style.fontSize=m.font+'px'}\n"""
          if node_marker not in s: raise SystemExit('nodeHtml marker missing')
          s=s.replace(node_marker,helper+node_marker,1)

          # Participant renderer gets calculated size immediately.
          old="if(e.type==='participant'){const d=e.data||{},name=String(d.name||'참가자'),avatar=d.image?`<img draggable=\"false\" alt=\"\" src=\"${esc(String(d.image))}\">`:esc(name.slice(0,2));inner=`<div class=\"participant-avatar\">${avatar}</div><div class=\"participant-name\">${esc(name)}</div>`}"
          new="if(e.type==='participant'){const d=e.data||{},name=String(d.name||'참가자'),avatar=d.image?`<img draggable=\"false\" alt=\"\" src=\"${esc(String(d.image))}\">`:esc(name.slice(0,2)),m=participantMetricsV116(e);inner=`<div class=\"participant-avatar\" style=\"width:${m.av}px;height:${m.av}px;font-size:${Math.max(10,m.font*1.2)}px\">${avatar}</div><div class=\"participant-name\" style=\"font-size:${m.font}px\">${esc(name)}</div>`}"
          if old not in s: raise SystemExit('participant renderer missing')
          s=s.replace(old,new,1)

          # Live resize also updates participant image/name.
          oldpos="function renderPositions(){document.querySelectorAll('.node').forEach(n=>{const e=getEl(n.dataset.id);if(e){n.style.left=e.x/BOARD_W*100+'%';n.style.top=e.y/BOARD_H*100+'%';n.style.width=e.w/BOARD_W*100+'%';n.style.height=e.h/BOARD_H*100+'%'}})}"
          newpos="function renderPositions(){document.querySelectorAll('.node').forEach(n=>{const e=getEl(n.dataset.id);if(e){n.style.left=e.x/BOARD_W*100+'%';n.style.top=e.y/BOARD_H*100+'%';n.style.width=e.w/BOARD_W*100+'%';n.style.height=e.h/BOARD_H*100+'%';applyParticipantMetricsV116(n,e)}})}"
          if oldpos not in s: raise SystemExit('renderPositions missing')
          s=s.replace(oldpos,newpos,1)

          # Participant resize gets sane minimums.
          oldresize="const move=m=>{const sc=boardScaleV110();e.w=clamp(sw+(m.clientX-sx)/Math.max(.0001,sc.x),60,BOARD_W-e.x);e.h=clamp(sh+(m.clientY-sy)/Math.max(.0001,sc.y),40,BOARD_H-e.y);renderPositions()};"
          newresize="const move=m=>{const sc=boardScaleV110(),minW=e.type==='participant'?100:60,minH=e.type==='participant'?120:40;e.w=clamp(sw+(m.clientX-sx)/Math.max(.0001,sc.x),minW,BOARD_W-e.x);e.h=clamp(sh+(m.clientY-sy)/Math.max(.0001,sc.y),minH,BOARD_H-e.y);renderPositions()};"
          if oldresize not in s: raise SystemExit('resize move missing')
          s=s.replace(oldresize,newresize,1)

          # Blank-canvas click clears selection, so MOVE bar disappears.
          oldpd="board.addEventListener('pointerdown',e=>{if(e.button===1){e.preventDefault();e.stopImmediatePropagation();return}if(pendingPlacement)placePendingV110(e)},true);"
          newpd="board.addEventListener('pointerdown',e=>{if(e.button===1){e.preventDefault();e.stopImmediatePropagation();return}if(pendingPlacement){placePendingV110(e);return}if(tool==='select'&&!e.target.closest('.node'))clearSelection()},true);"
          if oldpd not in s: raise SystemExit('board pointerdown missing')
          s=s.replace(oldpd,newpd,1)

          # Larger, normal participant starting size.
          oldadd="addElement('participant',{w:120,h:150,data:{contactId:String(c.id),name,image,labels:Array.isArray(c.labels)?c.labels:[],team:'',role:''}})"
          newadd="addElement('participant',{w:190,h:230,data:{contactId:String(c.id),name,image,labels:Array.isArray(c.labels)?c.labels:[],team:'',role:''}})"
          if oldadd not in s: raise SystemExit('addParticipant size missing')
          s=s.replace(oldadd,newadd,1)

          p.write_text(s,encoding='utf-8')

          # Emoticon manager: show every stored custom emoticon and accept drag/drop.
          p=Path('assets/content-planner-host.js');h=p.read_text(encoding='utf-8')
          if 'CF MWS V 1.0.15' not in h: raise SystemExit('host baseline mismatch')
          h=h.replace('CF MWS V 1.0.15','CF MWS V 1.0.16').replace('v=1.0.15','v=1.0.16')

          insert_before='function ensureEmoticonManagerV114(){'
          helper_host="""async function addEmoticonFilesV116(files){const picked=[...(files||[])].filter(f=>String(f?.type||'').startsWith('image/'));if(!picked.length)return;const d=rootData();if(!d)return;const next=emoticonsForPlanner();for(const file of picked){const src=await normalizeEmoticonImageV114(file),base=String(file.name||'이모티콘').replace(/\\.[^.]+$/,'')||'이모티콘';next.push({id:'user-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2)),name:base,src})}d.emoticons=next;const saver=window.saveData||window.persist;if(typeof saver==='function')await saver('이모티콘 추가');renderEmoticonManagerV114();sendEmoticons()}\n"""
          if insert_before not in h: raise SystemExit('manager marker missing')
          h=h.replace(insert_before,helper_host+insert_before,1)

          # Add a visible drop zone to the existing modal.
          target="<div class=\"row\" style=\"margin:14px 0\"><label class=\"primary\" style=\"display:inline-block\">사진 추가<input id=\"mwsEmoticonFilesV114\" type=\"file\" accept=\"image/*\" multiple style=\"display:none\"></label><span class=\"muted small\">추가한 이미지는 플래너 이모티콘 목록 맨 앞에 표시됩니다.</span></div><div id=\"mwsEmoticonListV114\" style=\"display:grid;gap:8px;overflow:auto;min-height:120px\"></div>"
          repl="<div class=\"row\" style=\"margin:14px 0\"><label class=\"primary\" style=\"display:inline-block\">사진 추가<input id=\"mwsEmoticonFilesV114\" type=\"file\" accept=\"image/*\" multiple style=\"display:none\"></label><span class=\"muted small\">추가한 이미지는 플래너 이모티콘 목록에 표시됩니다.</span></div><div id=\"mwsEmoticonDropV116\" style=\"border:2px dashed #45577d;border-radius:14px;padding:24px;text-align:center;color:#aebbd4;background:#0a1020;margin-bottom:12px\"><b style=\"display:block;color:#eef2ff;margin-bottom:5px\">이미지를 여기에 드래그해서 추가</b><span class=\"small\">PNG, JPG, WEBP 등 여러 파일을 한 번에 추가할 수 있습니다.</span></div><div id=\"mwsEmoticonListV114\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;overflow:auto;min-height:120px\"></div>"
          if target not in h: raise SystemExit('modal body target missing')
          h=h.replace(target,repl,1)

          # Replace file-input handler and bind drag/drop to same importer.
          h=sub1(h,r"document\.getElementById\('mwsEmoticonFilesV114'\)\.onchange=async e=>\{.*?\};renderEmoticonManagerV114\(\)\}",
          "document.getElementById('mwsEmoticonFilesV114').onchange=async e=>{try{await addEmoticonFilesV116(e.target.files)}catch(err){alert(err?.message||String(err))}finally{e.target.value=''}};const drop=document.getElementById('mwsEmoticonDropV116');['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();drop.style.borderColor='#8b5cf6';drop.style.background='#15152c'}));['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();drop.style.borderColor='#45577d';drop.style.background='#0a1020'}));drop.addEventListener('drop',async e=>{try{await addEmoticonFilesV116(e.dataTransfer?.files)}catch(err){alert(err?.message||String(err))}});renderEmoticonManagerV114()}",
          'emoticon input/drop handler',flags=re.S)
          p.write_text(h,encoding='utf-8')

          # Version-only changes in the current V1.0.15 runtime files.
          for fn in ['index.html','assets/tools.js','assets/test-v5.5.js','assets/test-v5.6.js','src/cf-v571.js']:
              q=Path(fn);t=q.read_text(encoding='utf-8');t=t.replace('CF MWS V 1.0.15','CF MWS V 1.0.16').replace('cf-mws-v1.0.15','cf-mws-v1.0.16').replace('v=1.0.15','v=1.0.16');q.write_text(t,encoding='utf-8')
          p=Path('package.json');d=json.loads(p.read_text(encoding='utf-8'));d['version']='1.0.16';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('README.md');t=p.read_text(encoding='utf-8');t=re.sub(r'Current release: .*','Current release: CF MWS V1.0.16',t,count=1);p.write_text(t,encoding='utf-8')
          PY

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'MAWANG Content Planner V1.0.16' content-planner.html
          grep -q 'participantMetricsV116' content-planner.html
          grep -q "function allStickersV114(){return \[...userStickersV114\]}" content-planner.html
          grep -q "tool==='select'&&!e.target.closest('.node')" content-planner.html
          grep -q 'object-fit:contain!important' content-planner.html
          grep -q 'mwsEmoticonDropV116' assets/content-planner-host.js
          grep -q 'addEmoticonFilesV116' assets/content-planner-host.js
          grep -q 'CF MWS V 1.0.16' index.html
          grep -q '"version": "1.0.16"' package.json
          git diff --check

      - name: Browser regression tests
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps
          python3 -m http.server 4173 >/tmp/mws-v1016-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1560,height:960}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/content-planner.html?v=1.0.16',{waitUntil:'load'});
            await page.waitForTimeout(250);

            // participant starts at sane size and its avatar grows during resize
            await page.evaluate(()=>{contactDb=[{id:'p1',name:'마이곰이',image:'',labels:[]}];addParticipant('p1')});
            let geom=await page.evaluate(()=>{const e=state.elements.find(x=>x.type==='participant'),n=document.querySelector('.participant-node'),a=n.querySelector('.participant-avatar');return{w:e.w,h:e.h,aw:a.getBoundingClientRect().width,nw:n.getBoundingClientRect().width}});
            if(geom.w!==190||geom.h!==230||geom.aw<30)throw new Error('participant initial geometry '+JSON.stringify(geom));
            await page.evaluate(()=>{const e=state.elements.find(x=>x.type==='participant');e.w=420;e.h=430;renderPositions()});
            const grown=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);
            if(!(grown>geom.aw*1.7))throw new Error(`participant avatar did not grow ${geom.aw}->${grown}`);

            // blank canvas click clears selection/MOVE bar
            await page.evaluate(()=>{setTool('select');const e=addTextAtV110(260,180,300,70);window.__tid=e.id});
            if(!(await page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"] .drag-handle`).isVisible()))throw new Error('MOVE bar missing while selected');
            await page.locator('#board').click({position:{x:1000,y:700},force:true});
            if(await page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"] .drag-handle`).isVisible())throw new Error('MOVE bar remained after blank click');

            // unselected text gives hover feedback and remains selectable
            const node=page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"]`);await node.hover();
            const hover=await node.evaluate(n=>getComputedStyle(n).outlineStyle);
            if(hover!=='dashed')throw new Error('text hover feedback missing '+hover);
            await node.click({force:true});
            if(!(await node.locator('.drag-handle').isVisible()))throw new Error('text not reselectable');

            // image remains contained in a wide box
            await page.evaluate(()=>{const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400"><rect width="200" height="400" fill="black"/></svg>');addElement('image',{x:100,y:400,w:500,h:180,data:{src,crop:{zoom:2,x:20,y:80},border:0,borderColor:'#fff'}})});
            const fit=await page.evaluate(()=>{const n=[...document.querySelectorAll('.image-node')].at(-1),im=n.querySelector('img'),a=n.getBoundingClientRect(),b=im.getBoundingClientRect(),cs=getComputedStyle(im);return{overflow:getComputedStyle(n).overflow,fit:cs.objectFit,transform:cs.transform,inside:b.left>=a.left-.5&&b.top>=a.top-.5&&b.right<=a.right+.5&&b.bottom<=a.bottom+.5}});
            if(fit.overflow!=='hidden'||fit.fit!=='contain'||fit.transform!=='none'||!fit.inside)throw new Error('image containment '+JSON.stringify(fit));

            // built-ins are gone; only user-provided emoticons render
            await page.evaluate(()=>applyPlannerEmoticonsV114([]));
            if(await page.locator('#stickerGrid .sticker-pick').count())throw new Error('built-in emoticons still visible');
            await page.evaluate(()=>applyPlannerEmoticonsV114([{id:'u1',name:'내 이모티콘',src:'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/%3E'}]));
            if(await page.locator('#stickerGrid .sticker-pick').count()!==1)throw new Error('user emoticon list wrong');

            if(errors.length)throw new Error('page errors '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit validated source and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v1016-planner-fixes.yml
          git config user.name 'MAWANG Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix planner interactions and custom emoticons V1.0.16'
          git push origin HEAD:mws-v1.0.16-planner-fixes
