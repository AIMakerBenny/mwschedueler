name: Apply CF MWS V1.0.15 planner fixes v2

on:
  push:
    branches: [mws-v1.0.15-planner-ui-final]
    paths:
      - .github/workflows/apply-v1015-planner-ui-v2.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.15-planner-ui-final
          fetch-depth: 0
      - name: Patch current V1.0.14 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)
          p=Path('content-planner.html');s=p.read_text(encoding='utf-8')
          s=once(s,'.creator-toolbar{grid-column:1/-1;background:#0b101c;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:7px 10px;gap:7px;overflow-x:auto}','.creator-toolbar{grid-column:1/-1;background:#0b101c;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:7px 10px;gap:7px;overflow:visible!important;position:relative;z-index:3000}','toolbar overflow')
          old='.participant-node{background:linear-gradient(135deg,#12192b,#1d2740);color:#fff;border:1px solid #3a4b70;border-radius:14px;padding:8px!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;align-items:center!important;justify-items:center!important;gap:4px!important;overflow:hidden!important;box-sizing:border-box!important;min-width:72px!important;min-height:90px!important}.participant-avatar{width:78%!important;max-width:none!important;aspect-ratio:1/1!important;height:auto!important;border-radius:11px!important;background:#5e45ba!important;display:grid!important;place-items:center!important;font-size:14px!important;font-weight:950!important;overflow:hidden!important;align-self:center!important;min-width:24px!important}.participant-avatar img{width:100%!important;height:100%!important;display:block!important;object-fit:cover!important}.participant-name{width:100%!important;min-height:13px!important;font-size:11px!important;line-height:1.15!important;font-weight:950!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.participant-meta,.tag-badge{display:none!important}'
          new='.participant-node{background:linear-gradient(135deg,#12192b,#1d2740);color:#fff;border:1px solid #3a4b70;border-radius:14px;padding:min(4cqw,4cqh)!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;align-items:center!important;justify-items:center!important;gap:min(3cqw,3cqh)!important;overflow:hidden!important;box-sizing:border-box!important;min-width:72px!important;min-height:90px!important;container-type:size!important}.participant-avatar{width:min(86cqw,72cqh)!important;height:min(86cqw,72cqh)!important;max-width:none!important;max-height:none!important;aspect-ratio:1/1!important;border-radius:min(10cqw,10cqh)!important;background:#5e45ba!important;display:grid!important;place-items:center!important;font-size:clamp(10px,min(14cqw,10cqh),32px)!important;font-weight:950!important;overflow:hidden!important;align-self:center!important;min-width:24px!important;min-height:24px!important}.participant-avatar img{width:100%!important;height:100%!important;display:block!important;object-fit:cover!important}.participant-name{width:100%!important;min-height:13px!important;font-size:clamp(9px,min(10cqw,7cqh),22px)!important;line-height:1.15!important;font-weight:950!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.participant-meta,.tag-badge{display:none!important}'
          s=once(s,old,new,'participant scaling')
          old='.node-delete{display:none;position:absolute;right:7px;top:5px;z-index:40;width:22px;height:22px;border:0;background:transparent;color:#8f2035;font-size:23px;font-weight:950;line-height:1;place-items:center;cursor:pointer;padding:0;box-shadow:none;text-shadow:0 1px 2px rgba(255,255,255,.75)}.node.selected .node-delete{display:grid}'
          new='.node-delete{display:none;position:absolute;right:7px;top:4px;z-index:40;width:auto;height:auto;border:0!important;border-radius:0!important;background:none!important;color:#8f2035;font-size:27px;font-weight:950;line-height:1;place-items:center;cursor:pointer;padding:0!important;box-shadow:none!important;text-shadow:none!important}.node-delete:hover{color:#dc2648}.node.selected .node-delete{display:grid}'
          s=once(s,old,new,'plain close x')
          s=once(s,'.tool-group{position:relative!important}.dropdown-panel{','.tool-group{position:relative!important}.tool-group:has(.dropdown-panel:not([hidden])){z-index:3300!important}.dropdown-panel{','dropdown stacking')
          s=once(s,"if(e.type==='text')inner=`<div class=\"editable\" contenteditable=\"${selectedIds.includes(e.id)?'true':'false'}\" spellcheck=\"false\">${esc(e.data.text||'')}</div>`;","if(e.type==='text')inner=`<div class=\"editable\" contenteditable=\"false\" spellcheck=\"false\">${esc(e.data.text||'')}</div>`;",'text renderer')
          s=once(s,"if(e.type==='sticky')inner=`<div class=\"editable\" contenteditable=\"${selectedIds.includes(e.id)?'true':'false'}\" spellcheck=\"false\">${esc(e.data.text||'')}</div>`;","if(e.type==='sticky')inner=`<div class=\"editable\" contenteditable=\"false\" spellcheck=\"false\">${esc(e.data.text||'')}</div>`;",'sticky renderer')
          s=once(s,"function renderSelectionOnly(){document.querySelectorAll('.node').forEach(n=>{const selected=selectedIds.includes(n.dataset.id);n.classList.toggle('selected',selected);if(n.classList.contains('text-node')||n.classList.contains('sticky-node'))n.querySelectorAll('.editable').forEach(ed=>ed.setAttribute('contenteditable',selected?'true':'false'))});renderInspector();renderConnectors()}","function renderSelectionOnly(){document.querySelectorAll('.node').forEach(n=>{const selected=selectedIds.includes(n.dataset.id);n.classList.toggle('selected',selected);if(n.classList.contains('text-node')||n.classList.contains('sticky-node'))n.querySelectorAll('.editable').forEach(ed=>{if(ed.dataset.editing!=='1')ed.setAttribute('contenteditable','false')})});renderInspector();renderConnectors()}",'selection behavior')
          old="node.addEventListener('pointerdown',ev=>{if(ev.target.closest('.resize-handle,.drag-handle,.node-delete,video'))return;const editable=ev.target.closest('[contenteditable]');if(editable){if(!selectedIds.includes(id)){ev.preventDefault();selectNode(id,ev);editable.setAttribute('contenteditable','true');setTimeout(()=>editable.focus(),0)}return}selectNode(id,ev)});"
          new="node.addEventListener('pointerdown',ev=>{if(ev.button!==0||ev.target.closest('.resize-handle,.drag-handle,.node-delete,video'))return;const editable=ev.target.closest('.editable');if(editable&&editable.dataset.editing==='1')return;if(tool!=='select')return;if(ev.shiftKey){selectNode(id,ev);return}if(!selectedIds.includes(id)){selectedIds=[id];renderSelectionOnly()}beginDrag(ev,e,node)});"
          s=once(s,old,new,'direct node drag')
          old="node.querySelectorAll('[contenteditable]').forEach(ed=>ed.addEventListener('input',()=>{e.data.text=ed.textContent;autoFitTextHeightV110(e,ed);touch()}));"
          new="node.querySelectorAll('.editable').forEach(ed=>{ed.addEventListener('input',()=>{e.data.text=ed.textContent;autoFitTextHeightV110(e,ed);touch()});ed.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();selectedIds=[id];renderSelectionOnly();ed.dataset.editing='1';ed.setAttribute('contenteditable','true');ed.focus();const sel=window.getSelection(),range=document.createRange();range.selectNodeContents(ed);sel.removeAllRanges();sel.addRange(range)});ed.addEventListener('blur',()=>{if(ed.dataset.editing==='1'){delete ed.dataset.editing;ed.setAttribute('contenteditable','false');e.data.text=ed.textContent;autoFitTextHeightV110(e,ed);touch()}})});"
          s=once(s,old,new,'double click editing')
          s=s.replace('MAWANG Content Planner V1.0.14','MAWANG Content Planner V1.0.15')
          p.write_text(s,encoding='utf-8')
          replacements={'assets/content-planner-host.js':[('CF MWS V 1.0.14','CF MWS V 1.0.15'),('v=1.0.14','v=1.0.15')],'assets/tools.js':[('CF MWS V 1.0.14','CF MWS V 1.0.15')],'assets/test-v5.5.js':[('CF MWS V 1.0.14','CF MWS V 1.0.15')],'assets/test-v5.6.js':[('CF MWS V 1.0.14','CF MWS V 1.0.15')],'index.html':[('CF MWS V 1.0.14','CF MWS V 1.0.15'),('v=1.0.14','v=1.0.15'),('>TEST V5.4</div>','>CF MWS V 1.0.15</div>')],'src/cf-v571.js':[('CF MWS V 1.0.14','CF MWS V 1.0.15'),('cf-mws-v1.0.14','cf-mws-v1.0.15')]}
          for fn,pairs in replacements.items():
              q=Path(fn);t=q.read_text(encoding='utf-8')
              for a,b in pairs:t=t.replace(a,b)
              q.write_text(t,encoding='utf-8')
          p=Path('package.json');d=json.loads(p.read_text(encoding='utf-8'));d['version']='1.0.15';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('README.md');t=p.read_text(encoding='utf-8');t=re.sub(r'Current release: .*','Current release: CF MWS V1.0.15',t,count=1);p.write_text(t,encoding='utf-8')
          PY
      - name: Static checks
        run: |
          set -euxo pipefail
          grep -q 'MAWANG Content Planner V1.0.15' content-planner.html
          grep -q 'container-type:size!important' content-planner.html
          grep -q 'image-drop-ready' content-planner.html
          grep -q 'drawToolSizesV114={brush:6,eraser:32}' content-planner.html
          grep -q 'mwsEmoticonManagerCardV114' assets/content-planner-host.js
          grep -q '>CF MWS V 1.0.15</div>' index.html
          grep -q "const BUILD_VERSION = 'CF MWS V 1.0.15'" src/cf-v571.js
          git diff --check
      - name: Browser regression tests
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps
          python3 -m http.server 4173 >/tmp/mws-v1015-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1560,height:960}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/content-planner.html?v=1.0.15',{waitUntil:'load'});await page.waitForTimeout(250);
            await page.evaluate(()=>{contactDb=[{id:'p1',name:'마이곰이',image:'',labels:[]}];addParticipant('p1')});const small=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);await page.evaluate(()=>{const e=state.elements.find(x=>x.type==='participant');e.w=560;e.h=480;render()});const large=await page.evaluate(()=>document.querySelector('.participant-avatar').getBoundingClientRect().width);if(!(large>small*2))throw new Error(`avatar scale ${small}->${large}`);
            await page.evaluate(()=>{setTool('select');const e=addTextAtV110(220,180,300,70);window.__tid=e.id});const node=page.locator(`.node[data-id="${await page.evaluate(()=>window.__tid)}"]`);const before=await node.boundingBox();await node.dragTo(page.locator('#board'),{targetPosition:{x:850,y:520},force:true});await page.waitForTimeout(60);const after=await node.boundingBox();if(!before||!after||Math.hypot(after.x-before.x,after.y-before.y)<20)throw new Error('text drag failed');await node.locator('.editable').dblclick({force:true});if(await node.locator('.editable').getAttribute('contenteditable')!=='true')throw new Error('text edit failed');await page.evaluate(()=>document.activeElement?.blur());
            const close=await page.evaluate(()=>{selectedIds=[window.__tid];renderSelectionOnly();const s=getComputedStyle(document.querySelector(`.node[data-id="${window.__tid}"] .node-delete`));return{bg:s.backgroundColor,border:s.borderTopWidth,shadow:s.boxShadow,radius:s.borderRadius}});if(close.bg!=='rgba(0, 0, 0, 0)'||close.border!=='0px'||close.shadow!=='none'||close.radius!=='0px')throw new Error('close styling '+JSON.stringify(close));
            await page.click('#toolBrush');await page.waitForTimeout(50);const pop=await page.evaluate(()=>{const m=document.getElementById('brushSizeMenu'),t=document.querySelector('.creator-toolbar'),r=m.getBoundingClientRect(),hit=document.elementFromPoint(r.left+10,r.top+10);return{hidden:m.hidden,w:r.width,h:r.height,hit:!!hit&&m.contains(hit),overflow:getComputedStyle(t).overflow}});if(pop.hidden||pop.w<200||pop.h<80||!pop.hit||pop.overflow!=='visible')throw new Error('popup '+JSON.stringify(pop));
            const n0=await page.evaluate(()=>state.elements.filter(x=>x.type==='image').length);await page.evaluate(async()=>{const f=new File(['<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/>'],'drop.svg',{type:'image/svg+xml'}),dt=new DataTransfer();dt.items.add(f);document.getElementById('board').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt,clientX:520,clientY:420}));await new Promise(r=>setTimeout(r,250))});const n1=await page.evaluate(()=>state.elements.filter(x=>x.type==='image').length);if(n1<=n0)throw new Error('drop failed');
            await page.evaluate(()=>{setTool('brush');rememberDrawSize(11);setTool('eraser');rememberDrawSize(47);setTool('brush')});const sizes=await page.evaluate(()=>({...drawToolSizesV114}));if(sizes.brush!==11||sizes.eraser!==47)throw new Error('sizes '+JSON.stringify(sizes));
            await page.evaluate(()=>applyPlannerEmoticonsV114([{id:'user-test',name:'사용자 테스트',src:'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="20" height="20"/%3E'}]));if(await page.locator('#stickerGrid .sticker-pick[title="사용자 테스트"]').count()!==1)throw new Error('emoticon failed');
            if(errors.length)throw new Error(errors.join(' | '));console.log('V1.0.15 regression passed',{small,large,close,pop,sizes});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit validated source and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'MAWANG Build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-v1015-planner-ui.yml .github/workflows/apply-v1015-planner-ui-v2.yml
          git add README.md package.json index.html content-planner.html src/cf-v571.js assets/content-planner-host.js assets/tools.js assets/test-v5.5.js assets/test-v5.6.js
          git commit -m 'Finalize planner UI and asset features V1.0.15'
          git push origin HEAD:mws-v1.0.15-planner-ui-final
