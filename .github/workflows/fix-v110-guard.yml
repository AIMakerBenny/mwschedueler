name: Fix V1.0.10 Tools Guard
on:
  push:
    branches: [mws-v1.0.10-direct-final]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.10-direct-final
      - name: Fix tools guard and validate release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/tools.js')
          s=p.read_text(encoding='utf-8')
          old='if(window.__mwsToolsCleanV110)return;window.__mwsToolsCleanV109=1;'
          new='if(window.__mwsToolsCleanV110)return;window.__mwsToolsCleanV110=1;'
          if s.count(old)!=1:
              raise SystemExit(f'guard match count {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check assets/tools.js
          node --check assets/content-planner-host.js
          node --check assets/perf-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          t=Path('assets/tools.js').read_text(encoding='utf-8')
          h=Path('assets/content-planner-host.js').read_text(encoding='utf-8')
          p=Path('content-planner.html').read_text(encoding='utf-8')
          r=Path('assets/perf-runtime.js').read_text(encoding='utf-8')
          if 'if(window.__mwsToolsCleanV110)return;window.__mwsToolsCleanV110=1;' not in t: raise SystemExit('bad tools guard')
          if '__mwsToolsCleanV109=1' in t: raise SystemExit('old guard setter remains')
          for bad in ['tools-v1.0.5','tools-v1.0.6','tools-v1.0.7','tools-v1.0.8','tools-v1.0.9','content-planner-host-v104']:
              if bad in h: raise SystemExit('legacy runtime ref in host: '+bad)
          for bad in ['content-planner-payload-','content-planner-fix-','transform:rotate(-1deg)']:
              if bad in p: raise SystemExit('legacy planner ref: '+bad)
          for need in ['MAWANG Content Planner V1.0.10','enterPlannerFullscreen','exitPlannerFullscreen','포스트잇 기울기',"setTool('brush')",'const ordered=[...STICKERS_V104.filter']:
              if need not in p: raise SystemExit('missing planner feature: '+need)
          scripts=re.findall(r'<script>([\s\S]*?)</script>',p,re.I)
          if len(scripts)!=1: raise SystemExit(f'planner inline scripts={len(scripts)}')
          Path('/tmp/planner.js').write_text(scripts[0],encoding='utf-8')
          if "CF MWS V 1.0.10" not in h or "CF MWS V 1.0.10" not in r or "CF MWS V 1.0.10" not in t: raise SystemExit('release identity mismatch')
          if json.loads(Path('package.json').read_text())['version']!='1.0.10': raise SystemExit('package mismatch')
          PY
          node --check /tmp/planner.js
      - name: Commit guard fix
        run: |
          if git diff --quiet -- assets/tools.js; then
            echo "No guard diff"
            exit 0
          fi
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tools.js
          git commit -m "Fix consolidated V1.0.10 tools guard"
          git push origin HEAD:mws-v1.0.10-direct-final
