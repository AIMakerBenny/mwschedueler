name: Publish MAWANG Scheduler v5.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v53.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v5.2 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3de267701671d868df2afb0994fac650d30af5e0"

      - name: Decode v5.3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/v53_a.b64 .payload/v53_b.b64 | base64 -d | gzip -dc > /tmp/v53.patch
          test -s /tmp/v53.patch

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/v53.patch
          git apply /tmp/v53.patch

      - name: Verify v5.3 file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3e1bf8a32f54c2dacf8deb5b5fc965d65650615b"
          test "$(sha256sum index.html | awk '{print $1}')" = "7121e124f7c68a4f7d2e84ffebcc1ddac3fa91e5fc960f3c99e2441473654744"
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'gachaApplyPostBtnV53',
              'applyGachaWinnersToSelectedPostV53',
              'bulkPartialConfirmPostApplicantsV53',
              'postPartialConfirmCountV53',
              'horse-entry-remove-v53',
              '<h3>참가 인원</h3>',
              'v530-ui-enhancement-style',
              'v530-feature-script',
              'rankingGoldPulseV53',
              'post-view-icon-v53',
              '#contacts.active .contact-tag-panel',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required v5.3 anchors: ' + ', '.join(missing))
          forbidden = [
              '컨텐츠 스케줄러 Beta',
              '</script>\\n</body>',
              '<h3>참가 말</h3>',
          ]
          found = [x for x in forbidden if x in s]
          if found:
              raise SystemExit('Forbidden legacy text remains: ' + ', '.join(found))
          print('v5.3 structural checks passed')
          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((code, i) => {
            try { new vm.Script(code, {filename:`inline-${i+1}.js`}); }
            catch (e) { console.error(e); process.exit(1); }
          });
          console.log(`Validated ${scripts.length} inline scripts`);
          NODE

      - name: Commit v5.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MAWANG Scheduler v5.3 feature refinements'
          git push origin main
