name: Build Mawang Scheduler Desktop Reset

on:
  push:
    branches:
      - desktop-native-v1.0-intro-reset-20260919
    paths:
      - 'desktop-native/**'
      - '.github/workflows/build-desktop-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: desktop-native/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('assets/mawang-mascot.webp').convert('RGBA'); side=max(im.size); canvas=Image.new('RGBA',(side,side),(255,255,255,255)); scale=min(side*0.94/im.width,side*0.94/im.height); r=im.resize((int(im.width*scale),int(im.height*scale)),Image.Resampling.LANCZOS); canvas.alpha_composite(r,((side-r.width)//2,(side-r.height)//2)); canvas=canvas.resize((256,256),Image.Resampling.LANCZOS); canvas.save('assets/mawang.ico',format='ICO',sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])"
          go install github.com/akavel/rsrc@latest
          & "$env:USERPROFILE\go\bin\rsrc.exe" -ico assets/mawang.ico -o rsrc.syso

      - name: Prepare and verify intro image
        shell: pwsh
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('assets/mawang-intro.b64'); pathlib.Path('assets/mawang-intro.jpg').write_bytes(base64.b64decode(p.read_text().strip()))"
          python -c "from PIL import Image; import hashlib,pathlib; p=pathlib.Path('assets/mawang-intro.jpg'); b=p.read_bytes(); im=Image.open(p); print('intro image', im.size, im.mode, 'bytes', len(b), 'sha256', hashlib.sha256(b).hexdigest()); assert im.size == (1600,900), im.size; assert len(b) == 239136, len(b); assert hashlib.sha256(b).hexdigest() == '3edaadc86c964f27ac6204fd1aae4bb5a7cf89b5608af29ca2f4be5505dd731e'"

      - name: Format native sources
        shell: pwsh
        run: gofmt -w main.go intro_windows.go

      - name: Phase 5 protected behavior audit
        shell: pwsh
        run: python audit_phase5.py

      - name: Phase 6 black transition audit
        shell: pwsh
        run: python audit_phase6.py

      - name: Phase 7 intro wordmark audit
        shell: pwsh
        run: python audit_phase7.py

      - name: Phase 8 intro interaction audit
        shell: pwsh
        run: python audit_phase8.py

      - name: Phase 9 desktop audit
        shell: pwsh
        run: python audit_phase9.py

      - name: Resolve dependencies
        shell: pwsh
        run: go mod tidy

      - name: Build Windows executable
        shell: pwsh
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o MawangScheduler.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MawangScheduler-Desktop-Reset-Phase9
          path: desktop-native/MawangScheduler.exe
          if-no-files-found: error
