name: Roll back broken v5.9 contacts patch

on:
  push:
    paths:
      - '.github/workflows/rollback-v59.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from pre-v5.9 state
        run: |
          git show 7418cabcfcd8ea48e449c59ea1aa4c559c581c6c:index.html > index.html
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          files=[]
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S),1):
              attrs=m.group(1) or ''
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'):
                  continue
              ext='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              p=Path(f'/tmp/rollback-inline-{i}{ext}')
              p.write_text(m.group(2),encoding='utf-8')
              files.append(str(p))
          Path('/tmp/rollback-inline-list.txt').write_text('\n'.join(files),encoding='utf-8')
          print('inline scripts:',len(files))
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            node --check "$f"
          done < /tmp/rollback-inline-list.txt
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rollback broken v5.9 contacts patch'
          git push
