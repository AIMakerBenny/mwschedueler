name: Fix authoritative V1.0.12 index version

on:
  push:
    branches:
      - mws-v1.0.12-clean-rebuild
    paths:
      - .github/workflows/fix-v1012-index-version.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.12-clean-rebuild
          fetch-depth: 0
      - name: Fix source version and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'data-build-version="TEST V5.6"' not in s:
              raise SystemExit('Expected clean-baseline TEST V5.6 body marker not found')
          s=s.replace('data-build-version="TEST V5.6"','data-build-version="CF MWS V 1.0.12"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'data-build-version="CF MWS V 1.0.12"' index.html
          ! grep -q 'data-build-version="TEST V5.6"' index.html
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Set authoritative CF MWS V1.0.12 index version"
          git push origin HEAD:mws-v1.0.12-clean-rebuild
