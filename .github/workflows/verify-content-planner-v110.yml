name: Verify Content Planner V1.0.10

on:
  push:
    branches:
      - cloudflare-production
    paths:
      - .github/workflows/verify-content-planner-v110.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-production
          fetch-depth: 0

      - name: Install browser test runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Verify planner 1-2-3 flow
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1600,height:1000}});
            const page = await context.newPage();
            const pageErrors=[];
            const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/content-planner.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#creatorMode.active');
            assert.match(await page.title(),/V1\.0\.10/);
            assert.strictEqual(await page.locator('#canvasTabs .canvas-tab').count(),1,'initial canvas tab');

            // 1. 기획 작성 및 저장
            await page.getByRole('button',{name:'텍스트',exact:true}).click();
            assert.strictEqual(await page.locator('.text-node').count(),1,'text tool creates one node');
            await page.locator('.text-node .editable').fill('V1.0.10 단계 1 테스트');
            await page.locator('.top-actions').getByRole('button',{name:'저장',exact:true}).click();
            await page.locator('#canvasInfoTitle').fill('V1.0.10 Planner Test');
            await page.locator('#canvasInfoAuthor').fill('Browser Verify');
            await page.locator('#canvasInfoSummary').fill('1-2-3 flow verification');
            await page.locator('#canvasInfoModal').getByRole('button',{name:'저장',exact:true}).click();
            await page.waitForTimeout(450);
            assert.strictEqual(await page.locator('#canvasInfoModal').evaluate(el=>el.classList.contains('open')),false,'save modal closes');
            assert.match(await page.locator('#canvasTabs .canvas-tab.active').innerText(),/V1\.0\.10 Planner Test/);
            const localState=await page.evaluate(()=>({single:!!localStorage.getItem('mawang_content_planner_draft_v1'),tabs:!!localStorage.getItem('mawang_content_planner_tabs_v104')}));
            assert.ok(localState.single && localState.tabs,'planner local draft keys exist');

            // 2. 기획안 제출
            await page.getByRole('button',{name:'기획안 제출',exact:true}).click();
            await page.locator('#submitTitle').fill('V1.0.10 Proposal');
            await page.locator('#submitAuthor').fill('Browser Verify');
            await page.locator('#submitSummary').fill('Submitted through browser verification');
            await page.locator('#submitBtn').click();
            await page.waitForFunction(()=>!document.getElementById('submitModal').classList.contains('open'));
            const proposalCount=await page.evaluate(async()=>await dbAll().then(x=>x.length));
            assert.strictEqual(proposalCount,1,'one proposal stored in IndexedDB');

            // 3. 기획안 확인 및 재편집 진입
            await page.getByRole('button',{name:'기획안 확인',exact:true}).click();
            await page.waitForSelector('#archiveMode.active .proposal-card');
            assert.strictEqual(await page.locator('#proposalGrid .proposal-card').count(),1,'archive shows one proposal');
            assert.match(await page.locator('#proposalGrid .proposal-title').innerText(),/V1\.0\.10 Proposal/);
            await page.locator('#proposalGrid .proposal-card').click();
            await page.waitForSelector('#viewerModal.open');
            assert.strictEqual(await page.locator('#viewerTitle').innerText(),'V1.0.10 Proposal');
            await page.getByRole('button',{name:'기존 기획안 수정',exact:true}).click();
            await page.waitForSelector('#creatorMode.active');
            const editState=await page.evaluate(()=>({id:state.activeProposalId,title:state.meta.title,elements:state.elements.length}));
            assert.ok(editState.id,'editing restored active proposal id');
            assert.strictEqual(editState.title,'V1.0.10 Proposal');
            assert.ok(editState.elements>=1,'editing restored canvas elements');

            assert.deepStrictEqual(pageErrors,[],`page errors: ${pageErrors.join(' | ')}`);
            const relevantConsoleErrors=consoleErrors.filter(x=>!x.includes('Failed to load resource'));
            assert.deepStrictEqual(relevantConsoleErrors,[],`console errors: ${relevantConsoleErrors.join(' | ')}`);
            console.log(JSON.stringify({stage1:'pass',stage2:'pass',stage3:'pass',proposalCount,editState,pageErrors,consoleErrors},null,2));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Remove temporary verification workflow
        if: success()
        shell: bash
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/verify-content-planner-v110.yml
          git commit -m "Remove temporary V1.0.10 planner browser verification"
          git push origin HEAD:cloudflare-production
