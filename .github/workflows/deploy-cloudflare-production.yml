name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsS --max-time 15 "$url" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/7] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || x.supabase!==false || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/7] v1.2.1 loader chain'
          retry_contains "$BASE/?deploy=v121" 'assets/online-v5-loader.js' > /tmp/home.html
          retry_contains "$BASE/assets/online-v5-loader.js?deploy=v121" 'assets/cloud-v5.5.js' > /tmp/online.js
          retry_contains "$BASE/assets/cloud-v5.5.js?deploy=v121" 'Mawang Scheduler v1.2.1 Cloudflare auth bootstrap' > /tmp/loader.js
          node --check /tmp/loader.js
          grep -Fq 'boss-manager-v121.js?v=1.2.1' /tmp/loader.js
          grep -Fq 'ui-fixes-v121.js?v=1.2.1' /tmp/loader.js
          if grep -Fq 'boss-manager-v116.js?v=1.2.0' /tmp/loader.js; then echo 'Legacy boss manager still loaded.' >&2; exit 1; fi

          echo '[3/7] compact Raid Boss manager'
          retry_contains "$BASE/assets/boss-manager-v121.js?v=1.2.1" '__mwsBossManagerV121' > /tmp/boss-manager.js
          node --check /tmp/boss-manager.js
          grep -Fq 'mwsBossManagerModalV121' /tmp/boss-manager.js
          grep -Fq '보스 이미지는 목록에 펼쳐두지 않고' /tmp/boss-manager.js
          grep -Fq "id=\"mwsBossManageV121\">수정" /tmp/boss-manager.js
          grep -Fq '/api/boss-image' /tmp/boss-manager.js
          grep -Fq 'scheduleLegacyMigration' /tmp/boss-manager.js
          if grep -Fq 'mws-boss-manager-thumb' /tmp/boss-manager.js; then echo 'Inline boss thumbnails remain in manager list.' >&2; exit 1; fi
          if grep -Fq 'setInterval' /tmp/boss-manager.js; then echo 'Boss manager polling remains.' >&2; exit 1; fi

          echo '[4/7] low-overhead UI fixes'
          retry_contains "$BASE/assets/ui-fixes-v121.js?v=1.2.1" '__mwsUiFixesV121' > /tmp/ui-v121.js
          node --check /tmp/ui-v121.js
          grep -Fq 'grid-template-columns:repeat(3' /tmp/ui-v121.js
          grep -Fq 'installRpsSearchPersistence' /tmp/ui-v121.js
          grep -Fq 'openSteamGamePickerV111' /tmp/ui-v121.js
          if grep -Fq 'setInterval' /tmp/ui-v121.js; then echo 'UI polling remains.' >&2; exit 1; fi
          if grep -Fq 'observe(calendar' /tmp/ui-v121.js; then echo 'Calendar subtree observer remains.' >&2; exit 1; fi

          echo '[5/7] boss image R2 API route'
          node --check src/cf-v121-boss-media.js
          grep -Fq "'/api/boss-image'" src/cf-v121-boss-media.js
          grep -Fq 'env.IMAGES.put' src/cf-v121-boss-media.js
          grep -Fq 'externalizeBossImages' src/cf-v121-boss-media.js
          code="$(curl -sS -o /tmp/boss-upload.json -w '%{http_code}' -X POST "$BASE/api/boss-image")"
          test "$code" = '401'

          echo '[6/7] existing wheel and Majoku fixes'
          retry_contains "$BASE/assets/today-people-wheel-v117.js?v=1.2.0" '__mwsTodayPeopleWheelV120' > /tmp/today-wheel.js
          node --check /tmp/today-wheel.js
          retry_contains "$BASE/assets/majoku-host-fix-v114.js?v=1.2.0" '__mwsMajokuHostFixV120' > /tmp/majoku-host.js
          node --check /tmp/majoku-host.js
          retry_contains "$BASE/assets/boss-raid-v116.js?v=1.2.0" '__mwsBossRaidV120' > /tmp/boss-raid.js
          node --check /tmp/boss-raid.js
          grep -Fq 'const DEFAULT_HP=500' /tmp/boss-raid.js

          echo '[7/7] Steam and drag scripts'
          retry_contains "$BASE/assets/steam-game-v111.js?v=1.1.3" '__mwsSteamGameV111' > /tmp/steam-v111.js
          node --check /tmp/steam-v111.js
          retry_contains "$BASE/assets/calendar-drag-layout-fix.css?v=1.1.3" 'min-height:128px!important' > /tmp/drag-fix.css

          echo 'Live Worker v1.2.1 compact boss manager, R2 boss images and reduced UI overhead verified.'
