name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsSL --max-time 15 "$url" || true)"
              if [[ "$body" == *"$needle"* ]]; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/8] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/8] v1.3.0 display and mobile UI assets'
          retry_contains "$BASE/assets/app-version-v120.js?deploy=$GITHUB_SHA" "const VERSION='1.3.0'" > /tmp/version.js
          node --check /tmp/version.js
          retry_contains "$BASE/assets/device-ui.js?deploy=$GITHUB_SHA" 'mws-majoku-subnav-collapsed-v130' > /tmp/device-ui.js
          node --check /tmp/device-ui.js
          grep -Fq 'Majoku Castle sidebar' /tmp/device-ui.js
          retry_contains "$BASE/assets/v130-live-contact-fix.js?deploy=$GITHUB_SHA" '__mwsV130LiveContactFix' > /tmp/v130-hotfix.js
          node --check /tmp/v130-hotfix.js

          echo '[3/8] Friend Finder UI and live batch endpoint'
          retry_contains "$BASE/assets/friend-finder-v120.js?deploy=$GITHUB_SHA" 'LIVE thumbnails' > /tmp/friend.js
          node --check /tmp/friend.js
          grep -Fq '/api/soop/live-batch' /tmp/friend.js
          grep -Fq '/api/soop/categories' /tmp/friend.js
          batch="$(curl -fsS --max-time 25 -H 'content-type: application/json' -d '{"urls":["https://api-channel.sooplive.co.kr/v1.1/channel/mawang0216/home/section/broad"],"force":true}' "$BASE/api/soop/live-batch")"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH); if(!x.ok||!Array.isArray(x.results)||x.results.length!==1) process.exit(1); const r=x.results[0]; if(!r||typeof r.url!=='string'||typeof r.status!=='number'||typeof r.body!=='string') process.exit(1)"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH),r=x.results[0]; let j=null; try{j=JSON.parse(r.body)}catch(_){}; if(r.status>=200&&r.status<500&&j&&typeof j==='object'){const q=[j];let b='';while(q.length&&!b){const v=q.shift();if(!v||typeof v!=='object')continue;b=String(v.broadNo||v.broad_no||v.bno||'');for(const c of Object.values(v))if(c&&typeof c==='object')q.push(c)}; console.log(b?'SOOP live payload reachable; broadcast number detected.':'SOOP live payload reachable; channel currently offline or payload has no active broadcast.')}else{console.log('SOOP upstream unavailable/transient; Worker batch contract itself is healthy.') }"

          echo '[4/8] SOOP category catalog endpoint'
          categories="$(curl -fsS --max-time 25 "$BASE/api/soop/categories?force=1")"
          CATEGORIES="$categories" node -e "const x=JSON.parse(process.env.CATEGORIES); if(!x.ok||!Array.isArray(x.categories)||x.categories.length<10) process.exit(1); if(!x.categories.every(v=>v&&String(v.id||'').trim()&&String(v.name||'').trim())) process.exit(1)"

          echo '[5/8] single SOOP proxy route'
          friend_url='https%3A%2F%2Fapi-channel.sooplive.co.kr%2Fv1.1%2Fchannel%2Fmawang0216%2Fhome%2Fsection%2Fbroad'
          proxy_status="$(curl -sS --max-time 20 -o /tmp/soop.json -w '%{http_code}' "$BASE/api/soop/proxy?url=$friend_url" || true)"
          test -s /tmp/soop.json
          case "$proxy_status" in
            2*|4*|5*) echo "SOOP proxy route responded HTTP $proxy_status" ;;
            *) echo "SOOP proxy route unreachable: HTTP $proxy_status" >&2; exit 1 ;;
          esac

          echo '[6/8] lossless image and boss assets'
          retry_contains "$BASE/assets/perf-runtime.js?v=1.2.2" 'lossless image policy' > /tmp/perf.js
          node --check /tmp/perf.js
          grep -Fq 'preserveOriginalImage' /tmp/perf.js
          node --check src/cf-v121-boss-media.js
          retry_contains "$BASE/assets/boss-manager-v121.js?v=1.2.2&deploy=$GITHUB_SHA" '__mwsBossManagerV121' > /tmp/boss.js
          node --check /tmp/boss.js

          echo '[7/8] Majoku Castle route and game host'
          retry_contains "$BASE/majoku-castle?deploy=$GITHUB_SHA" 'GAME 09' > /tmp/majoku.html
          grep -Fq 'data-game="drawing"' /tmp/majoku.html
          grep -Fq 'data-game="boss"' /tmp/majoku.html
          grep -Fq 'id="bossGame"' /tmp/majoku.html

          echo '[8/8] worker source syntax and routing'
          node --check assets/cloud-v1.1-loader.js
          node --check assets/friend-finder-v120.js
          node --check assets/v130-live-contact-fix.js
          node --check assets/soop-fetch-proxy-v123.js
          node --check assets/device-ui.js
          node --check assets/app-version-v120.js
          node --check src/cf-v120-friend.js
          node --check src/cf-v111-entry.js
          grep -Fq 'loadV130Hotfix' assets/cloud-v1.1-loader.js
          grep -Fq "./cf-v120-friend.js" src/cf-v111-entry.js
          grep -Fq "url.pathname==='/api/soop/live-batch'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/api/soop/categories'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/majoku-castle'||url.pathname==='/majoku-castle.html'" src/cf-v111-entry.js

          echo 'Mawang Scheduler v1.3.0 production verification passed.'
