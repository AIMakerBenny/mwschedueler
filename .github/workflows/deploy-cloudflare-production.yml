name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsS --max-time 15 "$url" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/10] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || x.supabase!==false || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/10] v1.2.4 production loader'
          retry_contains "$BASE/assets/cloud-v5.5.js?deploy=v124" 'Mawang Scheduler v1.2.4 Cloudflare auth bootstrap' > /tmp/loader.js
          node --check /tmp/loader.js
          grep -Fq 'loadSoopFetchProxy' /tmp/loader.js
          grep -Fq 'soop-fetch-proxy-v123.js?v=1.2.4' /tmp/loader.js
          grep -Fq 'ensureFeaturesForTab' /tmp/loader.js
          grep -Fq "tab==='calendar'" /tmp/loader.js
          grep -Fq "tab==='export'" /tmp/loader.js
          grep -Fq "tab==='gameMajoku'" /tmp/loader.js
          if grep -Fq 'loadBossManager(loadSteamPicker)' /tmp/loader.js; then echo 'Boss manager is still eagerly loaded.' >&2; exit 1; fi

          echo '[3/10] Friend Finder legacy SOOP route bridge'
          retry_contains "$BASE/assets/soop-fetch-proxy-v123.js?v=1.2.4" '__mwsSoopFetchProxyV124' > /tmp/soop-proxy.js
          node --check /tmp/soop-proxy.js
          grep -Fq '/api/soop/proxy' /tmp/soop-proxy.js
          grep -Fq 'nysxcqlewzucbpoaymbg.supabase.co' /tmp/soop-proxy.js
          grep -Fq '/functions/v1/soop-proxy' /tmp/soop-proxy.js
          grep -Fq 'sooplive.co.kr' /tmp/soop-proxy.js
          grep -Fq 'afreecatv.com' /tmp/soop-proxy.js
          node --check src/cf-v121-boss-media.js
          grep -Fq "url.pathname==='/api/soop/proxy'" src/cf-v121-boss-media.js
          untrusted="$(curl -sS -o /tmp/soop-untrusted.json -w '%{http_code}' "$BASE/api/soop/proxy?url=https%3A%2F%2Fexample.com%2F")"
          test "$untrusted" = '400'
          friend_url='https%3A%2F%2Fapi-channel.sooplive.co.kr%2Fv1.1%2Fchannel%2Fmawang0216%2Fhome%2Fsection%2Fbroad'
          friend_status="$(curl -sS --max-time 20 -D /tmp/soop-headers.txt -o /tmp/soop-body.txt -w '%{http_code}' "$BASE/api/soop/proxy?url=$friend_url" || true)"
          test "$friend_status" != '000'
          test "$friend_status" != '404'
          test "$friend_status" != '400'
          grep -Fqi 'x-mws-soop-proxy: v1.2.3' /tmp/soop-headers.txt
          test -s /tmp/soop-body.txt

          echo '[4/10] lossless runtime and no startup polling'
          retry_contains "$BASE/assets/perf-runtime.js?v=1.2.2" 'lossless image policy' > /tmp/perf.js
          node --check /tmp/perf.js
          grep -Fq 'preserveOriginalImage' /tmp/perf.js
          grep -Fq 'r2-original-bytes' /tmp/perf.js
          grep -Fq 'requestIdleCallback' /tmp/perf.js
          if grep -Fq 'versionTimer=setInterval' /tmp/perf.js; then echo 'Legacy startup version polling remains.' >&2; exit 1; fi
          if grep -Fq "toDataURL('image/webp'" /tmp/perf.js; then echo 'Runtime must not recompress images.' >&2; exit 1; fi

          echo '[5/10] event-driven performance base'
          retry_contains "$BASE/assets/perf-runtime-base.js?v=1.2.2" 'scheduleImageTune' > /tmp/perf-base.js
          node --check /tmp/perf-base.js
          grep -Fq 'content-visibility:auto' /tmp/perf-base.js
          if grep -Fq 'new MutationObserver' /tmp/perf-base.js; then echo 'Global image MutationObserver remains in performance base.' >&2; exit 1; fi

          echo '[6/10] compact Raid Boss manager'
          retry_contains "$BASE/assets/boss-manager-v121.js?v=1.2.1" '__mwsBossManagerV121' > /tmp/boss-manager.js
          node --check /tmp/boss-manager.js
          grep -Fq '레이드 보스 관리' /tmp/boss-manager.js
          grep -Fq '/api/boss-image' /tmp/boss-manager.js
          grep -Fq '이미지는 목록에 표시하지 않고' /tmp/boss-manager.js
          if grep -Fq 'mws-boss-manager-thumb' /tmp/boss-manager.js; then echo 'Inline boss thumbnails remain.' >&2; exit 1; fi

          echo '[7/10] original boss image byte path'
          node --check src/cf-v121-boss-media.js
          grep -Fq 'file.arrayBuffer' src/cf-v121-boss-media.js
          grep -Fq 'env.IMAGES.put' src/cf-v121-boss-media.js
          if grep -Eq 'toDataURL|drawImage|image/webp|resize' src/cf-v121-boss-media.js; then echo 'Boss image backend must not transform image bytes.' >&2; exit 1; fi

          echo '[8/10] immutable versioned media cache'
          node --check src/cf-v122-cache.js
          grep -Fq 'max-age=31536000, immutable' src/cf-v122-cache.js
          grep -Fq 'original-bytes-no-reencode' src/cf-v122-cache.js
          grep -Fq "./cf-v122-cache.js" src/cf-v111-entry.js

          echo '[9/10] calendar and Majoku fixes still available'
          retry_contains "$BASE/assets/today-people-wheel-v117.js?v=1.2.0" '__mwsTodayPeopleWheelV120' > /tmp/wheel.js
          node --check /tmp/wheel.js
          retry_contains "$BASE/assets/ui-fixes-v121.js?v=1.2.1" '__mwsUiFixesV121' > /tmp/ui.js
          node --check /tmp/ui.js
          retry_contains "$BASE/assets/majoku-host-fix-v114.js?v=1.2.0" '__mwsMajokuHostFixV120' > /tmp/majoku.js
          node --check /tmp/majoku.js

          echo '[10/10] worker source syntax'
          node --check assets/perf-runtime.js
          node --check assets/perf-runtime-base.js
          node --check assets/cloud-v1.1-loader.js
          node --check assets/soop-fetch-proxy-v123.js
          node --check assets/boss-manager-v121.js
          node --check src/cf-v111-entry.js

          echo 'Live Worker v1.2.4 Friend Finder legacy SOOP proxy route and existing optimizations verified.'
