name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run cumulative phase audits
        run: node scripts/run-current-full-integration-audit.mjs

      - name: JavaScript syntax check
        run: |
          node --check --input-type=commonjs < assets/app-core.js
          node --check --input-type=commonjs < assets/tools.js
          node --check --input-type=commonjs < assets/device-ui.js
          node --check --input-type=commonjs < assets/friend-finder-v120.js
          node --check --input-type=commonjs < assets/v130-live-contact-fix.js
          node --check --input-type=commonjs < assets/content-planner-host.js
          node --check scripts/run-phase53-sidebar-tool-workspace-audit.mjs
          node --check scripts/run-phase54-version-writer-audit.mjs
          node --check scripts/run-phase55-friend-live-thumbnail-audit.mjs
          node --check scripts/run-phase56-single-live-renderer-audit.mjs
          node --check scripts/run-phase57-live-thumbnail-refresh-audit.mjs
          node --check scripts/run-phase58-friend-thumbnail-load-audit.mjs
          node --check scripts/run-phase59-friend-live-card-layout-audit.mjs
          node --check scripts/run-phase60-live-thumbnail-proxy-audit.mjs
          node --check scripts/run-phase61-native-friend-card-binding-audit.mjs
          node --check scripts/run-phase62-nested-live-payload-audit.mjs
          node --check scripts/run-current-full-integration-audit.mjs

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsSL --max-time 15 "$url" || true)"
              if [[ "$body" == *"$needle"* ]]; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/8] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/8] isolated login shell and v1.3.0 assets'
          retry_contains "$BASE/?deploy=$GITHUB_SHA" 'app-core.css?v=1.3.0-order52' > /tmp/index.html
          grep -Fq 'app-core.js?v=1.3.0-ime64' /tmp/index.html
          grep -Fq 'id="mwsAccessGate"' /tmp/index.html
          grep -Fq 'assets/app-core.css?v=1.3.0-order52' /tmp/index.html
          grep -Fq 'online-v5-loader.js?v=1.3.0-final70' /tmp/index.html
          grep -Fq 'post-login-runtime-v130.js?v=1.3.0-auth-isolated' /tmp/index.html
          if grep -Eq 'test-v5\.[56]\.js|<script[^>]+assets/(perf-runtime\.js|device-ui\.js)' /tmp/index.html; then
            echo 'Legacy source runtime entrypoint regression detected.' >&2
            exit 1
          fi
          grep -Fq 'data-build-version="MWS V 1.3.0"' /tmp/index.html
          grep -Fq '>Mawang Scheduler v 1.3.0</div>' /tmp/index.html
          if grep -Eq '<script[^>]+assets/(perf-runtime\.js|today-people-runtime-v130\.js|contact-runtime-v130\.js|device-ui\.js)' /tmp/index.html; then
            echo 'Heavy UI/runtime script is still loaded before authentication.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/app-version-v120.js?deploy=$GITHUB_SHA" "const VERSION='1.3.0'" > /tmp/version.js
          node --check /tmp/version.js
          retry_contains "$BASE/assets/post-login-runtime-v130.js?deploy=$GITHUB_SHA" 'mobile-calendar-viewport-p29' > /tmp/post-login.js
          node --check /tmp/post-login.js
          grep -Fq "mws:app-ready" /tmp/post-login.js
          grep -Fq 'await Promise.all([' /tmp/post-login.js
          grep -Fq "loadStyle('mobile-drawer-v130'" /tmp/post-login.js
          grep -Fq "loadStyle('mobile-calendar-v130'" /tmp/post-login.js
          grep -Fq "load('mobile-calendar-day-detail-v130'" /tmp/post-login.js
          grep -Fq "today-people-runtime-v130.js?v=1.3.0-final68" /tmp/post-login.js
          grep -Fq "contact-runtime-v130.js?v=1.3.0-search67" /tmp/post-login.js
          grep -Fq "device-ui.js?v=1.3.0-majoku-menu-p45" /tmp/post-login.js
          retry_contains "$BASE/assets/mobile-calendar-day-detail-v130.js?deploy=$GITHUB_SHA" 'if(document.hidden||decorateQueued)return' > /tmp/mobile-day-detail.js
          node --check /tmp/mobile-day-detail.js
          grep -Fq "event.stopImmediatePropagation()" /tmp/mobile-day-detail.js
          grep -Fq "mws-mobile-event-hidden-v130" /tmp/mobile-day-detail.js
          grep -Fq "participantVisuals(event)" /tmp/mobile-day-detail.js
          grep -Fq "gameVisual(event)" /tmp/mobile-day-detail.js
          grep -Fq "mws-mobile-nav-offset-v130" /tmp/mobile-day-detail.js
          grep -Fq "node.setAttribute('draggable','true')" /tmp/mobile-day-detail.js
          grep -Fq "mws-mobile-tabs [data-mobile-tab]" /tmp/mobile-day-detail.js
          grep -Fq 'aria-modal="false"' /tmp/mobile-day-detail.js
          grep -Fq ".mobile-nav-toggle, .sidebar [data-tab]" /tmp/mobile-day-detail.js
          grep -Fq "replaceBrokenDetailImage" /tmp/mobile-day-detail.js
          grep -Fq "data-mws-fallback-name" /tmp/mobile-day-detail.js
          grep -Fq "if(list)list.scrollTop=0" /tmp/mobile-day-detail.js
          grep -Fq "observe(grid,{childList:true})" /tmp/mobile-day-detail.js
          if grep -Fq "observe(grid,{childList:true,subtree:true})" /tmp/mobile-day-detail.js; then
            echo 'Nested day-detail observer regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/mobile-calendar-quick-add-v130.js?deploy=$GITHUB_SHA" '__mwsMobileCalendarQuickAddV130' > /tmp/mobile-quick-add.js
          node --check /tmp/mobile-quick-add.js
          grep -Fq "mws-mobile-day-detail-open-v130" /tmp/mobile-quick-add.js
          grep -Fq "mws-mobile-nav-offset-v130" /tmp/mobile-quick-add.js
          grep -Fq "const mobileMonth=isMobileMonth();" /tmp/mobile-quick-add.js
          grep -Fq "bar.classList.toggle('is-visible',show)" /tmp/mobile-quick-add.js
          retry_contains "$BASE/assets/app-core.css?deploy=$GITHUB_SHA" '#memoLibraryTab{order:0!important}' > /tmp/app-core.css
          grep -Fq '#memoFavoritesTab{order:1!important}' /tmp/app-core.css
          retry_contains "$BASE/assets/content-planner-host.js?deploy=$GITHUB_SHA" "const memos=document.querySelector('.nav button[data-tab=\"memos\"]')" > /tmp/content-planner-host.js
          node --check /tmp/content-planner-host.js
          grep -Fq "memos.insertAdjacentElement('afterend',button)" /tmp/content-planner-host.js
          if grep -Fq "posts.insertAdjacentElement('afterend',button)" /tmp/content-planner-host.js; then
            echo 'Content Planner sidebar order regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/mobile-calendar-v130.css?deploy=$GITHUB_SHA" '82dvh' > /tmp/mobile-calendar.css
          grep -Fq "mini-event-main" /tmp/mobile-calendar.css
          grep -Fq "mws-mobile-day-person-avatar-v130" /tmp/mobile-calendar.css
          grep -Fq "mws-mobile-day-game-image-v130" /tmp/mobile-calendar.css
          grep -Fq "bottom:var(--mws-mobile-nav-offset-v130,68px)" /tmp/mobile-calendar.css
          grep -Fq "82dvh" /tmp/mobile-calendar.css
          grep -Fq "flex:1 1 auto" /tmp/mobile-calendar.css
          retry_contains "$BASE/assets/app-core.js?deploy=$GITHUB_SHA" "clockTimeFormatterV133" > /tmp/app-core.js
          node --check /tmp/app-core.js
          grep -Fq "eventModal.querySelector('.event-info-panel')" /tmp/app-core.js
          grep -Fq "attachCalendarPointerDragListeners" /tmp/app-core.js
          grep -Fq "detachCalendarPointerDragListeners" /tmp/app-core.js
          grep -Fq "queueCalendarEventPreviewPositionV138" /tmp/app-core.js
          grep -Fq "schedulePostApplicantRenderV142" /tmp/app-core.js
          grep -Fq "scheduleUserIdentityRenderV143" /tmp/app-core.js
          grep -Fq "refreshIncompleteContactsOnDataChangeV146" /tmp/app-core.js
          grep -Fq "refreshUserIdentityOnDataChangeV147" /tmp/app-core.js
          grep -Fq "renderPostsAfterSaveV148" /tmp/app-core.js
          grep -Fq "scheduleSniperRenderV149" /tmp/app-core.js
          grep -Fq "scheduleTargetListRenderV150" /tmp/app-core.js
          grep -Fq "scheduleTargetPickerRenderV151" /tmp/app-core.js
          if grep -Fq "document.getElementById('sniperSearch').oninput=renderSniperList" /tmp/app-core.js; then
            echo 'Immediate sniper search render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "document.getElementById('targetSearch').oninput=renderTargetList" /tmp/app-core.js; then
            echo 'Immediate target-list search render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "document.getElementById('targetPickerSearch').oninput=renderTargetPicker" /tmp/app-core.js; then
            echo 'Immediate target-picker search render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "window.addEventListener('mawang:datachange',()=>{try{renderIncompleteContacts()}catch(_){}});" /tmp/app-core.js; then
            echo 'Hidden incomplete-contact render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "window.addEventListener('mawang:datachange',()=>{try{renderUserIdentitySettings()}catch(_){}});" /tmp/app-core.js; then
            echo 'Hidden identity-settings render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "postApplicantSearch')?.addEventListener('input',renderPosts" /tmp/app-core.js; then
            echo 'Immediate post applicant search render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "selfContactSearch')?.addEventListener('input',renderUserIdentitySettings" /tmp/app-core.js; then
            echo 'Immediate self-contact search render regression detected.' >&2
            exit 1
          fi
          if grep -Fq "el.onmousemove=e=>positionCalendarEventPreview(e.clientX,e.clientY)" /tmp/app-core.js; then
            echo 'Direct calendar preview mousemove layout regression detected.' >&2
            exit 1
          fi
          if grep -Fq "setInterval(tickClock,1000)" /tmp/app-core.js; then
            echo 'Permanent clock interval regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/cloud-runtime-v130.js?deploy=$GITHUB_SHA" 'function enterAppShell(chosen)' > /tmp/cloud-core.js
          node --check /tmp/cloud-core.js
          grep -Fq 'void startHydration(chosen)' /tmp/cloud-core.js
          grep -Fq '__mwsAppReadyV130' /tmp/cloud-core.js
          grep -Fq "const CACHE_DB='mawang_data_v130'" /tmp/cloud-core.js
          grep -Fq 'mws-app-loading' /tmp/cloud-core.js
          grep -Fq 'mws:post-login-ui-ready' /tmp/cloud-core.js
          grep -Fq 'versions:Object.fromEntries(partsToSave.map' /tmp/cloud-core.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('/tmp/cloud-core.js','utf8');
          const a=src.indexOf('function enterAppShell(chosen)');
          const b=src.indexOf('function revealReadyShell()',a);
          if(a<0||b<0)process.exit(1);
          const enter=src.slice(a,b);
          if(enter.includes('hideGate()')){console.error('Login still reveals the incomplete shell before readiness.');process.exit(1)}
          const r=src.slice(b,src.indexOf('function markAppReady',b));
          if(!r.includes('hideGate()')){console.error('Ready shell no longer owns gate removal.');process.exit(1)}
          NODE
          retry_contains "$BASE/assets/device-ui.js?deploy=$GITHUB_SHA" "keep the top-level entry only" > /tmp/device-ui.js
          node --check /tmp/device-ui.js
          grep -Fq "observe(grid,{childList:true})" /tmp/device-ui.js
          grep -Fq "const records=doc.querySelector('.records-wrap')" /tmp/device-ui.js
          if grep -Fq "mwsMajokuSubnavV130" /tmp/device-ui.js; then
            echo 'Majoku Castle sidebar game-list regression detected.' >&2
            exit 1
          fi
          if grep -Fq "mws-majoku-toggle-v130" /tmp/device-ui.js; then
            echo 'Majoku Castle sidebar toggle regression detected.' >&2
            exit 1
          fi
          if grep -Fq "observe(grid,{childList:true,subtree:true})" /tmp/device-ui.js; then
            echo 'Nested mobile calendar observer regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/steam-game-v111.js?deploy=$GITHUB_SHA" '__mwsSteamGridObserverV111' > /tmp/steam-game.js
          node --check /tmp/steam-game.js
          grep -Fq "mwsSteamSignature" /tmp/steam-game.js
          if grep -Fq "setInterval(scan,1200)" /tmp/steam-game.js; then
            echo 'Permanent Steam scan loop regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/v130-live-contact-fix.js?deploy=$GITHUB_SHA" 'visitContactStationV55' > /tmp/live-contact-fix.js
          node --check /tmp/live-contact-fix.js
          if grep -Fq '/api/soop/live-batch' /tmp/live-contact-fix.js; then
            echo 'Duplicate LIVE batch owner regression detected in contact fix.' >&2
            exit 1
          fi
          if grep -Fq 'decorateLiveCard' /tmp/live-contact-fix.js; then
            echo 'Duplicate LIVE card renderer regression detected in contact fix.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/cloud-runtime-loader-v130.js?deploy=$GITHUB_SHA" 'steam-game-v111.js?v=1.1.4-perf30' > /tmp/cloud-loader.js
          node --check /tmp/cloud-loader.js
          grep -Fq "cloud-runtime-v130.js?v=1.3.0-final70" /tmp/cloud-loader.js
          grep -Fq "__mwsCloudRuntimeLoaderV130" /tmp/cloud-loader.js
          grep -Fq "v130-live-contact-fix.js?v=1.3.0-perf31" /tmp/cloud-loader.js
          grep -Fq "friend-finder-v120.js?v=1.3.0-phase62" /tmp/cloud-loader.js
          grep -Fq "ui-fixes-v121.js?v=1.2.3-perf44" /tmp/cloud-loader.js
          retry_contains "$BASE/assets/today-people-runtime-v130.js?deploy=$GITHUB_SHA" 'function tryInstallTodayPeopleV130()' > /tmp/today-people-runtime.js
          node --check /tmp/today-people-runtime.js
          if grep -Fq "tries>240" /tmp/today-people-runtime.js; then
            echo 'Today People startup polling regression detected.' >&2
            exit 1
          fi
          grep -Fq "syncTodayPeopleIfNeededV130" /tmp/today-people-runtime.js
          grep -Fq "__mwsTodayPeopleRuntimeV130" /tmp/today-people-runtime.js
          if grep -Eq "CF MWS V 1\.0|__mwsTestV53AutoTodayPeople|test-v5\.5|setVersionLabel\(" /tmp/today-people-runtime.js; then
            echo 'Legacy Today People runtime identity or version writer remains.' >&2
            exit 1
          fi
          grep -Fq "signature===lastTodayPeopleSyncSignatureV130" /tmp/today-people-runtime.js
          retry_contains "$BASE/assets/contact-runtime-v130.js?deploy=$GITHUB_SHA" 'function tryBootV137()' > /tmp/contact-runtime.js
          node --check /tmp/contact-runtime.js
          if grep -Fq "n>240" /tmp/contact-runtime.js; then
            echo 'Contact startup polling regression detected.' >&2
            exit 1
          fi
          grep -Fq "scheduleParticipantRenderV140" /tmp/contact-runtime.js
          grep -Fq "__mwsContactRuntimeV130" /tmp/contact-runtime.js
          if grep -Fq "window.contactMatches=match" /tmp/contact-runtime.js; then
            echo 'Duplicate contact matcher ownership detected.' >&2
            exit 1
          fi
          grep -Fq "function mwsKoreanInitials" /tmp/app-core.js
          grep -Fq "window.contactMatches=contactMatches" /tmp/app-core.js
          grep -Fq "queueInjectAddV141" /tmp/contact-runtime.js
          if grep -Fq "i.oninput=participantRender" /tmp/contact-runtime.js; then
            echo 'Immediate participant-search rerender regression detected.' >&2
            exit 1
          fi
          if grep -Fq "setTimeout(()=>{visibility();injectAdd()},0)" /tmp/contact-runtime.js; then
            echo 'Repeated contact add DOM injection regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/ui-fixes-v121.js?deploy=$GITHUB_SHA" 'function queuePreviewTuneV144()' > /tmp/ui-fixes.js
          node --check /tmp/ui-fixes.js
          grep -Fq "function startGamePreviewTracking()" /tmp/ui-fixes.js
          grep -Fq "previewTuneFrameV144" /tmp/ui-fixes.js
          if grep -Fq "characterData:true" /tmp/ui-fixes.js; then
            echo 'Preview characterData observer regression detected.' >&2
            exit 1
          fi
          grep -Fq "removeEventListener('mousemove',trackGamePreviewMove,true)" /tmp/ui-fixes.js
          if grep -Fq "document.addEventListener('mousemove',e=>{const slot=slotFromEvent(e)" /tmp/ui-fixes.js; then
            echo 'Always-on Steam mousemove regression detected.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/device-ui.css?deploy=$GITHUB_SHA" 'z-index:5200!important' > /tmp/device-ui.css
          grep -Fq '.mws-mobile-tabs' /tmp/device-ui.css
          grep -Fq '#eventModal .event-modal-header' /tmp/device-ui.css
          grep -Fq 'position:sticky!important' /tmp/device-ui.css

          echo '[3/8] Friend Finder UI and live batch endpoint'
          retry_contains "$BASE/assets/friend-finder-v120.js?deploy=$GITHUB_SHA" 'LIVE thumbnails' > /tmp/friend.js
          node --check /tmp/friend.js
          grep -Fq '/api/soop/live-batch' /tmp/friend.js
          grep -Fq '/api/soop/categories' /tmp/friend.js
          grep -Fq 'const ACTIVE_REFRESH_MS=30000' /tmp/friend.js
          grep -Fq 'function scheduleActiveRefresh' /tmp/friend.js
          grep -Fq 'function normalizeLivePayload(root)' /tmp/friend.js
          grep -Fq "const live=row?.live&&typeof row.live==='object'?row.live:normalizeLivePayload(parsed)" /tmp/friend.js
          grep -Fq 'function liveThumbStamp()' /tmp/friend.js
          grep -Fq 'img.dataset.thumbStamp=stamp' /tmp/friend.js
          grep -Fq "screen=document.createElement('div');screen.className='mws-live-screen-v120'" /tmp/friend.js
          grep -Fq 'card.appendChild(screen)' /tmp/friend.js
          grep -Fq 'loading="lazy"' /tmp/friend.js
          grep -Fq 'fetchpriority="low"' /tmp/friend.js
          grep -Fq "const exact=document.getElementById('friendFinder')" /tmp/friend.js
          grep -Fq "root.querySelectorAll('#friendFinderGridV5 .friend-finder-card-v5[data-id],.friend-finder-card-v5[data-id]')" /tmp/friend.js
          grep -Fq "const showLive=Boolean(bno&&match&&(live||card.classList.contains('live')||hint.bno))" /tmp/friend.js
          grep -Fq 'if(!showLive){if(screen)screen.hidden=true;continue}' /tmp/friend.js
          grep -Fq '#friendFinderGridV5.mws-friend-live-grid-v120{grid-auto-rows:auto!important;align-items:start!important}' /tmp/friend.js
          grep -Fq '#friendFinder .friend-finder-card-v5.mws-friend-live-card-v120{height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important' /tmp/friend.js
          grep -Fq 'grid-column:1/-1!important' /tmp/friend.js
          grep -Fq "friendGridObserver.observe(grid,{childList:true})" /tmp/friend.js
          if grep -Fq 'function cardFromStationButton(' /tmp/friend.js; then
            echo 'Friend Finder parent-guessing regression detected.' >&2
            exit 1
          fi
          grep -Fq "/api/soop/live-thumb?bno=\${id}&v=\${stamp}" /tmp/friend.js
          if grep -Fq 'loading="eager"' /tmp/friend.js; then
            echo 'Eager Friend Finder LIVE thumbnail loading regression detected.' >&2
            exit 1
          fi
          if grep -Fq 'fetchpriority="high"' /tmp/friend.js; then
            echo 'High-priority Friend Finder LIVE thumbnail loading regression detected.' >&2
            exit 1
          fi
          batch="$(curl -fsS --max-time 25 -H 'content-type: application/json' -d '{"urls":["https://api-channel.sooplive.co.kr/v1.1/channel/mawang0216/home/section/broad"],"force":true}' "$BASE/api/soop/live-batch")"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH); if(!x.ok||!Array.isArray(x.results)||x.results.length!==1) process.exit(1); const r=x.results[0]; if(!r||typeof r.url!=='string'||typeof r.status!=='number'||typeof r.body!=='string') process.exit(1)"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH),r=x.results[0]; if(r&&r.live){if(!/^\\d+$/.test(String(r.live.broadNo||'')))process.exit(1); if(typeof r.live.broadTitle!=='string')process.exit(1)}"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH),r=x.results[0]; let j=null; try{j=JSON.parse(r.body)}catch(_){}; if(r.status>=200&&r.status<500&&j&&typeof j==='object'){const q=[j];let b='';while(q.length&&!b){const v=q.shift();if(!v||typeof v!=='object')continue;b=String(v.broadNo||v.broad_no||v.bno||'');for(const c of Object.values(v))if(c&&typeof c==='object')q.push(c)}; console.log(b?'SOOP live payload reachable; broadcast number detected.':'SOOP live payload reachable; channel currently offline or payload has no active broadcast.')}else{console.log('SOOP upstream unavailable/transient; Worker batch contract itself is healthy.') }"
          thumb_invalid_status="$(curl -sS --max-time 15 -o /tmp/live-thumb-invalid.json -w '%{http_code}' "$BASE/api/soop/live-thumb?bno=abc" || true)"
          test "$thumb_invalid_status" = '400'
          grep -Fq 'Invalid broadcast number' /tmp/live-thumb-invalid.json
          bno="$(BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH),r=x.results?.[0];let j=null;try{j=JSON.parse(String(r?.body||''))}catch(_){};const q=j&&typeof j==='object'?[j]:[];let b='';while(q.length&&!b){const v=q.shift();if(!v||typeof v!=='object')continue;b=String(v.broadNo||v.broad_no||v.bno||'');for(const child of Object.values(v))if(child&&typeof child==='object')q.push(child)};process.stdout.write(/^\\d+$/.test(b)?b:'')")"
          if [ -n "$bno" ]; then
            thumb_status="$(curl -sS --max-time 25 -D /tmp/live-thumb.headers -o /tmp/live-thumb.img -w '%{http_code}' "$BASE/api/soop/live-thumb?bno=$bno&v=$GITHUB_SHA" || true)"
            test "$thumb_status" = '200'
            test -s /tmp/live-thumb.img
            grep -Eiq '^content-type:[[:space:]]*image/' /tmp/live-thumb.headers
          else
            echo 'Current verification channel is offline; live thumbnail binary check skipped.'
          fi

          echo '[4/8] SOOP category route contract'
          category_status="$(curl -sS --max-time 25 -o /tmp/categories.json -w '%{http_code}' "$BASE/api/soop/categories?force=1" || true)"
          test -s /tmp/categories.json
          CATEGORY_STATUS="$category_status" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/categories.json','utf8'));const s=Number(process.env.CATEGORY_STATUS);if(s===200){if(!x.ok||!Array.isArray(x.categories)||x.categories.length<1)process.exit(1)}else if(s===502){if(x.ok!==false||!String(x.error||''))process.exit(1)}else process.exit(1)"

          echo '[5/8] single SOOP proxy route without external dependency'
          invalid_url='https%3A%2F%2Fexample.com%2F'
          proxy_status="$(curl -sS --max-time 15 -o /tmp/soop-proxy.json -w '%{http_code}' "$BASE/api/soop/proxy?url=$invalid_url" || true)"
          test "$proxy_status" = '400'
          grep -Fq 'Invalid or untrusted SOOP URL' /tmp/soop-proxy.json
          grep -Fq "url.pathname==='/api/soop/proxy'" src/cf-v121-boss-media.js
          grep -Fq "new URL('/api/soop/proxy'" assets/soop-fetch-proxy-v123.js

          echo '[6/8] post-login performance and boss assets'
          retry_contains "$BASE/assets/perf-runtime.js?v=1.3.0-post-login" 'lossless image policy' > /tmp/perf.js
          node --check /tmp/perf.js
          grep -Fq 'preserveOriginalImage' /tmp/perf.js
          retry_contains "$BASE/assets/maintenance-runtime-v130.js?deploy=$GITHUB_SHA" '__mwsMaintenanceRuntimeV130' > /tmp/maintenance-runtime.js
          node --check /tmp/maintenance-runtime.js
          grep -Fq 'mwsCreateQuickBackupV130' /tmp/maintenance-runtime.js
          if grep -Eq 'cf-v5\.7-runtime|forceBuildVersion|installBuildVersionGuard|compressProfileImageV571|installSaveRequestOptimizer' /tmp/maintenance-runtime.js; then
            echo 'Legacy maintenance runtime behavior detected.' >&2
            exit 1
          fi
          grep -Fq 'content-planner-host.js?v=1.1-order52' /tmp/perf.js
          node --check src/cf-v121-boss-media.js
          retry_contains "$BASE/assets/boss-manager-v121.js?v=1.2.2&deploy=$GITHUB_SHA" '__mwsBossManagerV121' > /tmp/boss.js
          node --check /tmp/boss.js

          echo '[7/8] Majoku Castle route and game host'
          retry_contains "$BASE/majoku-castle?deploy=$GITHUB_SHA" 'GAME 09' > /tmp/majoku.html
          grep -Fq 'data-game="drawing"' /tmp/majoku.html
          grep -Fq 'data-game="boss"' /tmp/majoku.html
          grep -Fq 'id="bossGame"' /tmp/majoku.html

          echo '[8/8] source syntax and auth/UI boundary'
          node --check assets/cloud-runtime-loader-v130.js
          node --check assets/post-login-runtime-v130.js
          node --check assets/maintenance-runtime-v130.js
          node --check assets/cloud-runtime-v130.js
          node --check assets/cloud-runtime-loader-v130.js
          node --check scripts/run-phase69-legacy-runtime-finalization-audit.mjs
          node --check scripts/run-phase70-cloud-runtime-finalization-audit.mjs
          node --check assets/today-people-runtime-v130.js
          node --check assets/contact-runtime-v130.js
          node --check assets/friend-finder-v120.js
          node --check assets/v130-live-contact-fix.js
          node --check assets/steam-game-v111.js
          node --check assets/ui-fixes-v121.js
          node --check assets/soop-fetch-proxy-v123.js
          node --check assets/device-ui.js
          node --check assets/mobile-calendar-day-detail-v130.js
          node --check assets/mobile-calendar-quick-add-v130.js
          node --check assets/app-version-v120.js
          node --check src/cf-v120-friend.js
          node --check src/cf-v121-boss-media.js
          node --check src/cf-v111-entry.js
          node --check src/cf-v111-auth.js
          grep -Fq 'save_conflict_guard' src/cf-v111-auth.js
          grep -Fq '__mwsAppReadyV130' assets/cloud-runtime-loader-v130.js
          grep -Fq "mws:app-ready" assets/post-login-runtime-v130.js
          grep -Fq 'normalizeCloudCore' src/cf-v111-entry.js
          grep -Fq "./cf-v120-friend.js" src/cf-v111-entry.js
          grep -Fq "function normalizeLivePayload(root)" src/cf-v120-friend.js
          grep -Fq "return live?{...row,live}:row" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/api/soop/live-batch'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/api/soop/live-thumb'" src/cf-v120-friend.js
          grep -Fq "type.startsWith('image/')" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/api/soop/categories'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/majoku-castle'||url.pathname==='/majoku-castle.html'" src/cf-v111-entry.js

          echo 'Mawang Scheduler v1.3.0 auth/UI isolation verification passed.'


      - name: Report Cloudflare production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state="$JOB_STATUS"
          if [ "$state" != 'success' ]; then state='failure'; fi
          STATE="$state" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,context:'Cloudflare Production',description:process.env.STATE==='success'?'Audit, syntax, deploy and live verification passed':'Production workflow did not complete successfully',target_url:process.env.RUN_URL}))" > /tmp/cloudflare-status.json
          curl -fsSL -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             --data-binary @/tmp/cloudflare-status.json
