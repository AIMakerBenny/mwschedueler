name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsS --max-time 15 "$url" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/9] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || x.supabase!==false || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/9] main loader chain'
          retry_contains "$BASE/?deploy=v116" 'assets/online-v5-loader.js' > /tmp/home.html
          retry_contains "$BASE/assets/online-v5-loader.js?deploy=v116" 'assets/cloud-v5.5.js' > /tmp/online.js
          retry_contains "$BASE/assets/cloud-v5.5.js?deploy=v116" 'boss-manager-v116.js?v=1.1.6' > /tmp/loader.js
          grep -Fq 'calendar-drag-layout-fix.css?v=1.1.3' /tmp/loader.js
          grep -Fq 'steam-game-v111.js?v=1.1.3' /tmp/loader.js
          grep -Fq 'ui-fixes-v113.js?v=1.1.5' /tmp/loader.js
          grep -Fq 'majoku-host-fix-v114.js?v=1.1.6' /tmp/loader.js
          grep -Fq 'boss-manager-v116.js?v=1.1.6' /tmp/loader.js
          node --check /tmp/loader.js

          echo '[3/9] existing calendar fixes'
          retry_contains "$BASE/assets/ui-fixes-v113.js?v=1.1.5" '__mwsUiFixesV113' > /tmp/ui-v115.js
          node --check /tmp/ui-v115.js
          grep -Fq 'mws-today-people-hover-v115' /tmp/ui-v115.js
          grep -Fq 'openSteamGamePickerV111' /tmp/ui-v115.js
          retry_contains "$BASE/assets/calendar-drag-layout-fix.css?v=1.1.3" 'min-height:128px!important' > /tmp/drag-fix.css
          grep -Fq 'position:static!important' /tmp/drag-fix.css

          echo '[4/9] Majoku host bridge'
          retry_contains "$BASE/assets/majoku-host-fix-v114.js?v=1.1.6" '__mwsMajokuHostFixV114' > /tmp/majoku-host.js
          node --check /tmp/majoku-host.js
          grep -Fq 'boss-raid-v116.js?v=1.1.6' /tmp/majoku-host.js
          grep -Fq 'majoku-sidebar-v113.js?v=1.1.6' /tmp/majoku-host.js

          echo '[5/9] Majoku sidebar bridge'
          retry_contains "$BASE/assets/majoku-sidebar-v113.js?v=1.1.6" '마왕 보스 레이드' > /tmp/majoku-sidebar.js
          node --check /tmp/majoku-sidebar.js
          grep -Fq 'removeLegacyToggle' /tmp/majoku-sidebar.js
          grep -Fq 'boss-raid-v116.js?v=1.1.6' /tmp/majoku-sidebar.js
          if grep -Fq 'mws-majoku-nav-no' /tmp/majoku-sidebar.js; then echo 'Legacy Majoku numeric labels are still present.' >&2; exit 1; fi

          echo '[6/9] Boss manager'
          retry_contains "$BASE/assets/boss-manager-v116.js?v=1.1.6" '__mwsBossManagerV116' > /tmp/boss-manager.js
          node --check /tmp/boss-manager.js
          grep -Fq 'MWSBossRaidStore' /tmp/boss-manager.js
          grep -Fq 'majokuBossRaid' /tmp/boss-manager.js
          grep -Fq '마왕 보스 레이드 보스 관리' /tmp/boss-manager.js
          grep -Fq '보스 추가' /tmp/boss-manager.js

          echo '[7/9] Boss raid codex'
          retry_contains "$BASE/assets/boss-raid-v116.js?v=1.1.6" '__mwsBossRaidV116' > /tmp/boss-raid.js
          node --check /tmp/boss-raid.js
          grep -Fq '레이드 보스 도감' /tmp/boss-raid.js
          grep -Fq 'bossCodexBtnV116' /tmp/boss-raid.js
          grep -Fq 'markBoss({defeated:true})' /tmp/boss-raid.js
          grep -Fq 'bossHpInputV116' /tmp/boss-raid.js
          grep -Fq 'bossSelectV116' /tmp/boss-raid.js

          echo '[8/9] Majoku base Boss Raid page'
          retry_contains "$BASE/majoku-castle.html?deploy=v116" 'id="bossGame"' > /tmp/castle.html
          grep -Fq 'id="bossImage"' /tmp/castle.html
          grep -Fq 'id="bossStartBtn"' /tmp/castle.html

          echo '[9/9] base Cloudflare and Steam scripts'
          curl -fsS --max-time 15 "$BASE/assets/cloud-v1.1.js?v=1.1.1" > /tmp/cloud-v11.js
          node -e "const fs=require('fs');let s=fs.readFileSync('/tmp/cloud-v11.js','utf8');s=s.replace('Math.max(0,Math.min(100,Math.round(Number(percent)||0));','Math.max(0,Math.min(100,Math.round(Number(percent)||0)));');fs.writeFileSync('/tmp/cloud-v11-fixed.js',s)"
          node --check /tmp/cloud-v11-fixed.js
          retry_contains "$BASE/assets/steam-game-v111.js?v=1.1.3" '__mwsSteamGameV111' > /tmp/steam-v111.js
          node --check /tmp/steam-v111.js
          grep -Fq 'mws-steam-slot-v111' /tmp/steam-v111.js

          echo 'Live Worker v1.1.6 Boss Raid catalog, manager, codex, HP editing and persistence verified.'
