name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run cumulative phase audits
        run: node scripts/run-current-full-integration-audit.mjs

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsSL --max-time 15 "$url" || true)"
              if [[ "$body" == *"$needle"* ]]; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/8] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/8] isolated login shell and v1.3.0 assets'
          retry_contains "$BASE/?deploy=$GITHUB_SHA" 'post-login-runtime-v130.js' > /tmp/index.html
          grep -Fq 'id="mwsAccessGate"' /tmp/index.html
          if grep -Eq '<script[^>]+assets/(perf-runtime\.js|test-v5\.5\.js|test-v5\.6\.js|device-ui\.js)' /tmp/index.html; then
            echo 'Heavy UI/runtime script is still loaded before authentication.' >&2
            exit 1
          fi
          retry_contains "$BASE/assets/app-version-v120.js?deploy=$GITHUB_SHA" "const VERSION='1.3.0'" > /tmp/version.js
          node --check /tmp/version.js
          retry_contains "$BASE/assets/post-login-runtime-v130.js?deploy=$GITHUB_SHA" '__mwsPostLoginRuntimeV130' > /tmp/post-login.js
          node --check /tmp/post-login.js
          grep -Fq "mws:app-ready" /tmp/post-login.js
          grep -Fq 'await Promise.all([' /tmp/post-login.js
          grep -Fq "loadStyle('mobile-drawer-v130'" /tmp/post-login.js
          grep -Fq "loadStyle('mobile-calendar-v130'" /tmp/post-login.js
          grep -Fq "load('mobile-calendar-day-detail-v130'" /tmp/post-login.js
          retry_contains "$BASE/assets/mobile-calendar-day-detail-v130.js?deploy=$GITHUB_SHA" '__mwsMobileCalendarDayDetailV130' > /tmp/mobile-day-detail.js
          node --check /tmp/mobile-day-detail.js
          grep -Fq "event.stopImmediatePropagation()" /tmp/mobile-day-detail.js
          grep -Fq "mws-mobile-event-hidden-v130" /tmp/mobile-day-detail.js
          grep -Fq "participantVisuals(event)" /tmp/mobile-day-detail.js
          grep -Fq "gameVisual(event)" /tmp/mobile-day-detail.js
          grep -Fq "mws-mobile-nav-offset-v130" /tmp/mobile-day-detail.js
          retry_contains "$BASE/assets/mobile-calendar-v130.css?deploy=$GITHUB_SHA" 'mws-mobile-calendar-extra-v130' > /tmp/mobile-calendar.css
          grep -Fq "mini-event-main" /tmp/mobile-calendar.css
          grep -Fq "mws-mobile-day-person-avatar-v130" /tmp/mobile-calendar.css
          grep -Fq "mws-mobile-day-game-image-v130" /tmp/mobile-calendar.css
          grep -Fq "bottom:var(--mws-mobile-nav-offset-v130,68px)" /tmp/mobile-calendar.css
          retry_contains "$BASE/assets/cloud-v1.1.js?deploy=$GITHUB_SHA" 'function enterAppShell(chosen)' > /tmp/cloud-core.js
          node --check /tmp/cloud-core.js
          grep -Fq 'void startHydration(chosen)' /tmp/cloud-core.js
          grep -Fq '__mwsAppReadyV130' /tmp/cloud-core.js
          grep -Fq "const CACHE_DB='mawang_data_v130'" /tmp/cloud-core.js
          grep -Fq 'mws-app-loading' /tmp/cloud-core.js
          grep -Fq 'mws:post-login-ui-ready' /tmp/cloud-core.js
          grep -Fq 'versions:Object.fromEntries(partsToSave.map' /tmp/cloud-core.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('/tmp/cloud-core.js','utf8');
          const a=src.indexOf('function enterAppShell(chosen)');
          const b=src.indexOf('function revealReadyShell()',a);
          if(a<0||b<0)process.exit(1);
          const enter=src.slice(a,b);
          if(enter.includes('hideGate()')){console.error('Login still reveals the incomplete shell before readiness.');process.exit(1)}
          const r=src.slice(b,src.indexOf('function markAppReady',b));
          if(!r.includes('hideGate()')){console.error('Ready shell no longer owns gate removal.');process.exit(1)}
          NODE
          retry_contains "$BASE/assets/device-ui.js?deploy=$GITHUB_SHA" 'mws-majoku-subnav-collapsed-v130' > /tmp/device-ui.js
          node --check /tmp/device-ui.js

          echo '[3/8] Friend Finder UI and live batch endpoint'
          retry_contains "$BASE/assets/friend-finder-v120.js?deploy=$GITHUB_SHA" 'LIVE thumbnails' > /tmp/friend.js
          node --check /tmp/friend.js
          grep -Fq '/api/soop/live-batch' /tmp/friend.js
          grep -Fq '/api/soop/categories' /tmp/friend.js
          batch="$(curl -fsS --max-time 25 -H 'content-type: application/json' -d '{"urls":["https://api-channel.sooplive.co.kr/v1.1/channel/mawang0216/home/section/broad"],"force":true}' "$BASE/api/soop/live-batch")"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH); if(!x.ok||!Array.isArray(x.results)||x.results.length!==1) process.exit(1); const r=x.results[0]; if(!r||typeof r.url!=='string'||typeof r.status!=='number'||typeof r.body!=='string') process.exit(1)"
          BATCH="$batch" node -e "const x=JSON.parse(process.env.BATCH),r=x.results[0]; let j=null; try{j=JSON.parse(r.body)}catch(_){}; if(r.status>=200&&r.status<500&&j&&typeof j==='object'){const q=[j];let b='';while(q.length&&!b){const v=q.shift();if(!v||typeof v!=='object')continue;b=String(v.broadNo||v.broad_no||v.bno||'');for(const c of Object.values(v))if(c&&typeof c==='object')q.push(c)}; console.log(b?'SOOP live payload reachable; broadcast number detected.':'SOOP live payload reachable; channel currently offline or payload has no active broadcast.')}else{console.log('SOOP upstream unavailable/transient; Worker batch contract itself is healthy.') }"

          echo '[4/8] SOOP category route contract'
          category_status="$(curl -sS --max-time 25 -o /tmp/categories.json -w '%{http_code}' "$BASE/api/soop/categories?force=1" || true)"
          test -s /tmp/categories.json
          CATEGORY_STATUS="$category_status" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/categories.json','utf8'));const s=Number(process.env.CATEGORY_STATUS);if(s===200){if(!x.ok||!Array.isArray(x.categories)||x.categories.length<1)process.exit(1)}else if(s===502){if(x.ok!==false||!String(x.error||''))process.exit(1)}else process.exit(1)"

          echo '[5/8] single SOOP proxy route without external dependency'
          invalid_url='https%3A%2F%2Fexample.com%2F'
          proxy_status="$(curl -sS --max-time 15 -o /tmp/soop-proxy.json -w '%{http_code}' "$BASE/api/soop/proxy?url=$invalid_url" || true)"
          test "$proxy_status" = '400'
          grep -Fq 'Invalid or untrusted SOOP URL' /tmp/soop-proxy.json
          grep -Fq "url.pathname==='/api/soop/proxy'" src/cf-v121-boss-media.js
          grep -Fq "new URL('/api/soop/proxy'" assets/soop-fetch-proxy-v123.js

          echo '[6/8] post-login performance and boss assets'
          retry_contains "$BASE/assets/perf-runtime.js?v=1.3.0-post-login" 'lossless image policy' > /tmp/perf.js
          node --check /tmp/perf.js
          grep -Fq 'preserveOriginalImage' /tmp/perf.js
          node --check src/cf-v121-boss-media.js
          retry_contains "$BASE/assets/boss-manager-v121.js?v=1.2.2&deploy=$GITHUB_SHA" '__mwsBossManagerV121' > /tmp/boss.js
          node --check /tmp/boss.js

          echo '[7/8] Majoku Castle route and game host'
          retry_contains "$BASE/majoku-castle?deploy=$GITHUB_SHA" 'GAME 09' > /tmp/majoku.html
          grep -Fq 'data-game="drawing"' /tmp/majoku.html
          grep -Fq 'data-game="boss"' /tmp/majoku.html
          grep -Fq 'id="bossGame"' /tmp/majoku.html

          echo '[8/8] source syntax and auth/UI boundary'
          node --check assets/cloud-v1.1-loader.js
          node --check assets/post-login-runtime-v130.js
          node --check assets/friend-finder-v120.js
          node --check assets/v130-live-contact-fix.js
          node --check assets/soop-fetch-proxy-v123.js
          node --check assets/device-ui.js
          node --check assets/mobile-calendar-day-detail-v130.js
          node --check assets/app-version-v120.js
          node --check src/cf-v120-friend.js
          node --check src/cf-v121-boss-media.js
          node --check src/cf-v111-entry.js
          node --check src/cf-v111-auth.js
          grep -Fq 'save_conflict_guard' src/cf-v111-auth.js
          grep -Fq '__mwsAppReadyV130' assets/cloud-v1.1-loader.js
          grep -Fq "mws:app-ready" assets/post-login-runtime-v130.js
          grep -Fq 'normalizeCloudCore' src/cf-v111-entry.js
          grep -Fq "./cf-v120-friend.js" src/cf-v111-entry.js
          grep -Fq "url.pathname==='/api/soop/live-batch'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/api/soop/categories'" src/cf-v120-friend.js
          grep -Fq "url.pathname==='/majoku-castle'||url.pathname==='/majoku-castle.html'" src/cf-v111-entry.js

          echo 'Mawang Scheduler v1.3.0 auth/UI isolation verification passed.'
