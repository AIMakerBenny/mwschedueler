      - name: Report Cloudflare production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state="$JOB_STATUS"
          if [ "$state" != 'success' ]; then state='failure'; fi
          STATE="$state" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,context:'Cloudflare Production',description:process.env.STATE==='success'?'Audit, syntax, deploy and live verification passed':'Production workflow did not complete successfully',target_url:process.env.RUN_URL}))" > /tmp/cloudflare-status.json
          curl -fsSL -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             --data-binary @/tmp/cloudflare-status.json
