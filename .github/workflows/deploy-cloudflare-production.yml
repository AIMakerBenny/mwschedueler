name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'
          health=''
          for i in {1..12}; do
            if health="$(curl -fsS --max-time 15 "$BASE/api/health")"; then
              break
            fi
            sleep 5
          done
          test -n "$health"
          echo "$health"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || x.supabase!==false || !String(x.backend||'').includes('D1')) process.exit(1)"

          session="$(curl -fsS --max-time 15 "$BASE/api/auth/session")"
          echo "$session"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          loader="$(curl -fsS --max-time 15 "$BASE/assets/cloud-v5.5.js")"
          printf '%s' "$loader" | grep -q 'Mawang Scheduler v1.1 Cloudflare auth bootstrap'
          printf '%s' "$loader" | grep -q 'steam-game-v111.js'

          curl -fsS --max-time 15 "$BASE/assets/cloud-v1.1.js?v=1.1.1" > /tmp/cloud-v11.js
          node -e "const fs=require('fs');let s=fs.readFileSync('/tmp/cloud-v11.js','utf8');s=s.replace('Math.max(0,Math.min(100,Math.round(Number(percent)||0));','Math.max(0,Math.min(100,Math.round(Number(percent)||0)));');fs.writeFileSync('/tmp/cloud-v11-fixed.js',s)"
          node --check /tmp/cloud-v11-fixed.js

          curl -fsS --max-time 15 "$BASE/assets/steam-game-v111.js?v=1.1.1" > /tmp/steam-v111.js
          grep -q '__mwsSteamGameV111' /tmp/steam-v111.js
          node --check /tmp/steam-v111.js

          home="$(curl -fsS --max-time 15 "$BASE/")"
          printf '%s' "$home" | grep -q 'steam-game-v111.js'
          printf '%s' "$home" | grep -q 'data-mws-steam-v111'

          echo 'Live Worker, D1 auth, login runtime, and Steam picker verified.'
