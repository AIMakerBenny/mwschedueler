name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run cumulative phase audits
        run: node scripts/run-current-full-integration-audit.mjs

      - name: JavaScript syntax check
