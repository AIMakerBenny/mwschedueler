          curl -fsSL --max-time 20 "$BASE/api/parts/posts?diag=$GITHUB_SHA" > /tmp/mws-posts.json
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/mws-manifest.json','utf8'));
          const contacts=JSON.parse(fs.readFileSync('/tmp/mws-contacts.json','utf8'));
          const events=JSON.parse(fs.readFileSync('/tmp/mws-events.json','utf8'));
          const core=JSON.parse(fs.readFileSync('/tmp/mws-core.json','utf8'));
          const posts=JSON.parse(fs.readFileSync('/tmp/mws-posts.json','utf8'));
          const rows=Array.isArray(contacts.data)?contacts.data:[];
          const eventRows=Array.isArray(events.data)?events.data:[];
          const postRows=Array.isArray(posts.data)?posts.data:[];
          const targetPosts=postRows.filter(p=>String(p?.postNo||'')==='207631249');
          console.log(JSON.stringify({targetPostStatusAudit:targetPosts.map(p=>{
            const comments=Array.isArray(p.comments)?p.comments:[];
            const counts={pending:0,selected:0,gacha:0,nextchance:0,excluded:0,other:0};
            for(const c of comments){
              const s=String(c?.status||'pending');
              if(Object.prototype.hasOwnProperty.call(counts,s))counts[s]++;else counts.other++;
            }
            return {id:String(p.id||''),name:String(p.name||''),postNo:String(p.postNo||''),commentCount:comments.length,counts,selectedNames:comments.filter(c=>c.status==='selected').map(c=>String(c.name||''))};
          })}));
          const targetPostScheduleExpectation=targetPosts.map(p=>{
            const map=new Map();
            for(const c of Array.isArray(p.comments)?p.comments:[]){
              const raw=String(c?.status||'pending').trim().toLowerCase();
              const status=(raw==='selected'||raw==='confirmed')?'confirmed':((raw==='pending'||raw==='planned')?'planned':'');
              if(!status)continue;
              const key=String(c?.userId||'').trim().toLowerCase()||String(c?.stationUrl||'').trim().toLowerCase()||('name:'+String(c?.name||'').trim().toLowerCase());
              const rank=status==='confirmed'?2:1,prev=map.get(key);
              if(!prev||rank>prev.rank||(rank===prev.rank&&String(c?.regDate||'')>String(prev.comment?.regDate||'')))map.set(key,{status,rank,comment:c});
            }
            const rows=[...map.values()];
            return {postNo:String(p.postNo||''),total:rows.length,confirmed:rows.filter(x=>x.status==='confirmed').length,planned:rows.filter(x=>x.status==='planned').length};
          });
          console.log(JSON.stringify({targetPostScheduleExpectation}));
          const normalizedName=value=>String(value||'').trim().toLowerCase().replace(/\s+/g,'');
          const stationKey=value=>{try{const u=new URL(String(value||''));const parts=u.pathname.split('/').filter(Boolean).map(decodeURIComponent);if(u.hostname.toLowerCase().endsWith('sooplive.com')){if(parts[0]?.toLowerCase()==='station'&&parts[1])return parts[1].toLowerCase();if(u.hostname.toLowerCase().startsWith('play.')&&parts[0])return parts[0].toLowerCase()}if(u.hostname.toLowerCase().endsWith('afreecatv.com')){if(parts[0]?.toLowerCase()==='station'&&parts[1])return parts[1].toLowerCase();if(parts[0])return parts[0].toLowerCase()}return ''}catch(_){return ''}};
          const targetApplicantContacts=[];
          for(const p of targetPosts){
            for(const applicant of Array.isArray(p.comments)?p.comments:[]){
              const byStation=stationKey(applicant.stationUrl);
              const match=rows.find(c=>{
                const ck=stationKey(c?.stationUrl);
                if(byStation&&ck&&byStation===ck)return true;
                return normalizedName(c?.name)===normalizedName(applicant?.name);
              });
              targetApplicantContacts.push({applicant:String(applicant?.name||''),status:String(applicant?.status||''),contactId:String(match?.id||''),contactName:String(match?.name||''),image:String(match?.image||'')});
            }
          }
          console.log(JSON.stringify({targetApplicantContacts}));
          const images=rows.filter(x=>typeof x?.image==='string'&&x.image.length>0);
          const mediaImages=images.filter(x=>x.image.startsWith('/media/contact/'));
          const dataImages=images.filter(x=>x.image.startsWith('data:image/'));
          const unmanagedImages=images.filter(x=>!x.image.startsWith('/media/contact/')&&!x.image.startsWith('data:image/'));
          const unmanagedImageDetails=unmanagedImages.map(row=>{
            const raw=String(row.image||'');
            let protocol='',host='',path='';
            try{const u=new URL(raw,'https://mawang-scheduler.majoku.workers.dev');protocol=u.protocol;host=u.hostname;path=(u.pathname||'').slice(0,180)}catch(_){path=raw.slice(0,180)}
            return {id:String(row.id||''),name:String(row.name||''),protocol,host,path};
          });
          console.log(JSON.stringify({unmanagedContactImages:unmanagedImageDetails}));
          const normalizedContactName=value=>String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('ko-KR');
          const duplicateNameGroups=[...rows.reduce((map,row)=>{
            const key=normalizedContactName(row?.name);
            if(!key)return map;
            if(!map.has(key))map.set(key,[]);
            map.get(key).push(row);
            return map;
          },new Map()).entries()]
            .filter(([,items])=>items.length>1)
            .map(([key,items])=>({key,count:items.length,items:items.map(row=>({id:String(row?.id||''),name:String(row?.name||''),image:String(row?.image||'')}))}));
          const watchedContactRows=rows.filter(row=>['제갈통','김부각º'].some(name=>String(row?.name||'').includes(name)));
          console.log(JSON.stringify({duplicateContactNameAudit:duplicateNameGroups,watchedContactRows:watchedContactRows.map(row=>({id:String(row?.id||''),name:String(row?.name||''),image:String(row?.image||''),pendingSetup:Boolean(row?.pendingSetup),labels:Array.isArray(row?.labels)?row.labels:[]}))}));
          const {execFileSync}=require('child_process');
          const readJson=url=>JSON.parse(execFileSync('curl',['-fsSL','--retry','3','--retry-delay','2','--retry-all-errors','--max-time','20',url],{encoding:'utf8'}));
          const readVersionSequence=[];
          for(let pass=0;pass<2;pass++){
            const manifestRead=readJson('https://mawang-scheduler.majoku.workers.dev/api/manifest?readStability='+process.env.GITHUB_SHA+'-'+pass);
            const contactsRead=readJson('https://mawang-scheduler.majoku.workers.dev/api/parts/contacts?readStability='+process.env.GITHUB_SHA+'-'+pass);
            readVersionSequence.push({pass,manifestContacts:Number(manifestRead?.parts?.contacts)||0,partContacts:Number(contactsRead?.version)||0});
          }
          console.log(JSON.stringify({contactReadVersionStability:readVersionSequence}));

          (async()=>{
            let recoverableMedia=0,validManagedMedia=0,invalidManagedMedia=0,missingManagedMedia=0;
            const missingManagedMediaIds=[];
            const base='https://mawang-scheduler.majoku.workers.dev';
            const legacyHost='pub-ff2081dd33384aa0865bb86b4514bbec.r2.dev';
            const legacyRefs=images.filter(row=>{try{return new URL(row.image,base).hostname===legacyHost}catch(_){return false}});
            const signatureType=bytes=>{
              if(bytes.length>=8&&bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47&&bytes[4]===0x0d&&bytes[5]===0x0a&&bytes[6]===0x1a&&bytes[7]===0x0a)return 'image/png';
              if(bytes.length>=3&&bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)return 'image/jpeg';
              if(bytes.length>=12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')return 'image/webp';
              if(bytes.length>=6&&/^GIF8[79]a$/.test(String.fromCharCode(...bytes.slice(0,6))))return 'image/gif';
              if(bytes.length>=2&&bytes[0]===0x42&&bytes[1]===0x4d)return 'image/bmp';
              return '';
            };
            const repeatedMediaAudit=[];
            for(const row of targetApplicantContacts.filter(x=>x.image.startsWith('/media/contact/'))){
              const attempts=[];
              for(let i=0;i<5;i++){
                try{
                  const resp=await fetch(base+row.image,{headers:{'cache-control':'no-cache'}});
                  const type=String(resp.headers.get('content-type')||'');
                  const bytes=new Uint8Array(await resp.arrayBuffer());
                  const sig=signatureType(bytes.slice(0,32));
                  attempts.push({status:resp.status,type,size:bytes.length,signature:sig,policy:String(resp.headers.get('x-mws-image-policy')||''),cacheControl:String(resp.headers.get('cache-control')||'')});
                }catch(error){attempts.push({error:String(error)})}
              }
              repeatedMediaAudit.push({applicant:row.applicant,contactId:row.contactId,image:row.image,attempts});
            }
            console.log(JSON.stringify({repeatedMediaAudit}));
            const namedContacts=rows.filter(row=>String(row?.name||'').includes('제갈통'));
            const namedContactDetails=[];
            for(const row of namedContacts){
              const detail={id:String(row.id||''),name:String(row.name||''),image:String(row.image||''),status:0,type:'',signature:'',policy:'',cacheControl:''};
              if(detail.image){
                try{
                  const target=new URL(detail.image,base);
                  target.searchParams.set('namedAudit',process.env.GITHUB_SHA||'live');
                  const response=await fetch(target);
                  detail.status=response.status;
                  detail.type=String(response.headers.get('content-type')||'').split(';')[0].toLowerCase();
                  detail.policy=response.headers.get('x-mws-image-policy')||'';
                  detail.cacheControl=response.headers.get('cache-control')||'';
                  let first=new Uint8Array();
                  if(response.body){
                    const reader=response.body.getReader();
                    const part=await reader.read();
                    first=part.value instanceof Uint8Array?part.value.slice(0,32):new Uint8Array();
                    try{await reader.cancel()}catch(_){}
                  }
                  detail.signature=signatureType(first);
                }catch(error){detail.error=String(error)}
              }
              namedContactDetails.push(detail);
            }
            console.log(JSON.stringify({namedContactImageAudit:namedContactDetails}));
            const queue=[...rows];
            const workers=Array.from({length:8},async()=>{
              while(queue.length){
                const row=queue.pop(),id=String(row?.id||'');
                if(!id)continue;
                try{
                  const response=await fetch(base+'/media/contact/'+encodeURIComponent(id)+'?audit='+encodeURIComponent(process.env.GITHUB_SHA||'live'));
                  if(response.ok)recoverableMedia++;
                  try{await response.body?.cancel()}catch(_){}
                }catch(_){}
              }
            });
            await Promise.all(workers);
            const managedQueue=[...mediaImages];
            const mediaWorkers=Array.from({length:8},async()=>{
              while(managedQueue.length){
                const row=managedQueue.pop();
                try{
                  const target=new URL(row.image,base);
                  target.searchParams.set('audit',process.env.GITHUB_SHA||'live');
                  const response=await fetch(target);
                  if(response.status===404){
                    missingManagedMedia++;
                    missingManagedMediaIds.push(String(row.id||''));
                    try{await response.body?.cancel()}catch(_){}
                    continue;
                  }
                  const type=String(response.headers.get('content-type')||'').split(';')[0].toLowerCase();
                  const policy=response.headers.get('x-mws-image-policy')||'';
                  const cacheControl=response.headers.get('cache-control')||'';
                  let first=new Uint8Array();
                  if(response.body){
                    const reader=response.body.getReader();
                    const part=await reader.read();
                    first=part.value instanceof Uint8Array?part.value.slice(0,32):new Uint8Array();
                    try{await reader.cancel()}catch(_){}
                  }
                  const signature=signatureType(first);
                  if(response.ok&&type.startsWith('image/')&&signature&&policy==='original-bytes-no-reencode'&&/max-age=31536000/i.test(cacheControl)&&/immutable/i.test(cacheControl))validManagedMedia++;
                  else{invalidManagedMedia++;console.error('Invalid managed contact media',{id:row.id,status:response.status,type,signature,policy,cacheControl})}
                }catch(error){invalidManagedMedia++;console.error('Managed contact media fetch failed',{id:row?.id,error:String(error)})}
              }
            });
            await Promise.all(mediaWorkers);
            console.log(JSON.stringify({
              manifestVersions:manifest.parts||{},
              contactsVersion:Number(contacts.version)||0,
              contactsCount:rows.length,
              contactsWithImage:images.length,
              contactsWithMediaImage:mediaImages.length,
              contactsWithDataImage:dataImages.length,
              legacyR2DirectRefs:legacyRefs.length,
              recoverableMedia,
              validManagedMedia,
              invalidManagedMedia,
              missingManagedMedia,
              missingManagedMediaIds,
              eventsVersion:Number(events.version)||0,
              eventsCount:eventRows.length,
              coreVersion:Number(core.version)||0,
              achievementCards:Array.isArray(core.data?.achievementCards)?core.data.achievementCards.length:0
            }));
            if(dataImages.length)throw new Error('Contact Data URLs remain in production storage');
            if(legacyRefs.length)throw new Error('Legacy direct R2 contact image references remain in production storage');
            if(unmanagedImages.length)throw new Error('Unmanaged contact image references remain in production storage');
            if(images.length!==mediaImages.length)throw new Error('Not every stored contact image is managed by same-origin media');
            if(mediaImages.some(row=>!/[?&]r=2(?:&|$)/.test(row.image)))throw new Error('Managed contact image revision is stale');
            if(invalidManagedMedia)throw new Error('Managed contact media failed Content-Type, byte-signature or cache-policy validation');
            if(missingManagedMedia>1)throw new Error('Missing managed contact media count increased above the known single stale reference');
          })().catch(error=>{console.error(error);process.exit(1)});
