name: Deploy Cloudflare Production

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mawang-scheduler.majoku.workers.dev'

          retry_contains() {
            local url="$1"
            local needle="$2"
            local body=''
            for i in {1..12}; do
              body="$(curl -fsS --max-time 15 "$url" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Verification failed for $url: missing $needle" >&2
            return 1
          }

          echo '[1/9] health and auth'
          health="$(retry_contains "$BASE/api/health" '"ok":true')"
          HEALTH="$health" node -e "const x=JSON.parse(process.env.HEALTH); if(!x.ok || x.supabase!==false || !String(x.backend||'').includes('D1')) process.exit(1)"
          session="$(retry_contains "$BASE/api/auth/session" '"authenticated"')"
          SESSION="$session" node -e "const x=JSON.parse(process.env.SESSION); if(typeof x.authenticated!=='boolean') process.exit(1)"

          echo '[2/9] v1.2.0 loader chain'
          retry_contains "$BASE/?deploy=v120" 'assets/online-v5-loader.js' > /tmp/home.html
          retry_contains "$BASE/assets/online-v5-loader.js?deploy=v120" 'assets/cloud-v5.5.js' > /tmp/online.js
          retry_contains "$BASE/assets/cloud-v5.5.js?deploy=v120" 'Mawang Scheduler v1.2.0 Cloudflare auth bootstrap' > /tmp/loader.js
          grep -Fq 'boss-manager-v116.js?v=1.2.0' /tmp/loader.js
          grep -Fq 'ui-fixes-v113.js?v=1.2.0' /tmp/loader.js
          grep -Fq 'today-people-wheel-v117.js?v=1.2.0' /tmp/loader.js
          grep -Fq 'majoku-host-fix-v114.js?v=1.2.0' /tmp/loader.js
          if grep -Fq 'boss-tools-v119.js' /tmp/loader.js; then echo 'Legacy Boss Tools loader still active.' >&2; exit 1; fi
          node --check /tmp/loader.js

          echo '[3/9] precise Today People wheel'
          retry_contains "$BASE/assets/today-people-wheel-v117.js?v=1.2.0" '__mwsTodayPeopleWheelV120' > /tmp/today-wheel.js
          node --check /tmp/today-wheel.js
          grep -Fq 'overPopup' /tmp/today-wheel.js
          grep -Fq 'overTrigger' /tmp/today-wheel.js
          if grep -Fq "target.closest('#calendar,#calendarGrid,.day')" /tmp/today-wheel.js; then echo 'Broad calendar wheel capture still present.' >&2; exit 1; fi
          if grep -Fq 'MutationObserver' /tmp/today-wheel.js; then echo 'Today People wheel should not run a document MutationObserver.' >&2; exit 1; fi

          echo '[4/9] calendar UI and RPS search persistence'
          retry_contains "$BASE/assets/ui-fixes-v113.js?v=1.2.0" '__mwsUiFixesV120' > /tmp/ui-v120.js
          node --check /tmp/ui-v120.js
          grep -Fq 'grid-template-columns:repeat(3' /tmp/ui-v120.js
          grep -Fq 'installRpsSearchPersistence' /tmp/ui-v120.js
          grep -Fq 'rpsSearchInput' /tmp/ui-v120.js
          grep -Fq 'openSteamGamePickerV111' /tmp/ui-v120.js
          if grep -Fq 'setInterval(scan' /tmp/ui-v120.js; then echo 'Legacy UI polling still present.' >&2; exit 1; fi

          echo '[5/9] Raid boss manager'
          retry_contains "$BASE/assets/boss-manager-v116.js?v=1.2.0" '__mwsBossManagerV120' > /tmp/boss-manager.js
          node --check /tmp/boss-manager.js
          grep -Fq '<h3>레이드 보스 관리</h3>' /tmp/boss-manager.js
          if grep -Fq '마왕 보스 레이드 보스 관리' /tmp/boss-manager.js; then echo 'Old raid boss manager title remains.' >&2; exit 1; fi
          grep -Fq 'const DEFAULT_HP=500' /tmp/boss-manager.js
          grep -Fq 'multiple' /tmp/boss-manager.js
          grep -Fq '묶음 업로드' /tmp/boss-manager.js
          grep -Fq "addEventListener('drop'" /tmp/boss-manager.js
          if grep -Fq 'setInterval' /tmp/boss-manager.js; then echo 'Boss manager polling still present.' >&2; exit 1; fi

          echo '[6/9] Majoku bridges without polling'
          retry_contains "$BASE/assets/majoku-host-fix-v114.js?v=1.2.0" '__mwsMajokuHostFixV120' > /tmp/majoku-host.js
          node --check /tmp/majoku-host.js
          grep -Fq 'boss-raid-v116.js?v=1.2.0' /tmp/majoku-host.js
          grep -Fq 'boss-raid-fix-v119.js?v=1.2.0' /tmp/majoku-host.js
          if grep -Fq 'setInterval' /tmp/majoku-host.js; then echo 'Majoku host polling still present.' >&2; exit 1; fi
          retry_contains "$BASE/assets/majoku-sidebar-v113.js?v=1.2.0" '__mwsMajokuSidebarV120' > /tmp/majoku-sidebar.js
          node --check /tmp/majoku-sidebar.js
          grep -Fq '마왕 보스 레이드' /tmp/majoku-sidebar.js
          if grep -Fq 'setInterval' /tmp/majoku-sidebar.js; then echo 'Majoku sidebar polling still present.' >&2; exit 1; fi

          echo '[7/9] Boss Raid HP and codex'
          retry_contains "$BASE/assets/boss-raid-v116.js?v=1.2.0" '__mwsBossRaidV120' > /tmp/boss-raid.js
          node --check /tmp/boss-raid.js
          grep -Fq 'const DEFAULT_HP=500' /tmp/boss-raid.js
          grep -Fq '레이드 보스 도감' /tmp/boss-raid.js
          grep -Fq 'bossHpInputV116' /tmp/boss-raid.js
          retry_contains "$BASE/assets/boss-raid-fix-v119.js?v=1.2.0" '__mwsBossRaidFixV120' > /tmp/boss-fix.js
          node --check /tmp/boss-fix.js
          grep -Fq 'applyBossSettings' /tmp/boss-fix.js
          if grep -Fq 'setInterval' /tmp/boss-fix.js; then echo 'Boss HP fix polling still present.' >&2; exit 1; fi

          echo '[8/9] Majoku base Boss Raid source'
          grep -Fq 'id="bossGame"' majoku-castle.html
          grep -Fq 'id="bossImage"' majoku-castle.html
          grep -Fq 'id="bossStartBtn"' majoku-castle.html

          echo '[9/9] base Cloudflare, Steam and drag scripts'
          curl -fsS --max-time 15 "$BASE/assets/cloud-v1.1.js?v=1.1.1" > /tmp/cloud-v11.js
          node -e "const fs=require('fs');let s=fs.readFileSync('/tmp/cloud-v11.js','utf8');s=s.replace('Math.max(0,Math.min(100,Math.round(Number(percent)||0));','Math.max(0,Math.min(100,Math.round(Number(percent)||0)));');fs.writeFileSync('/tmp/cloud-v11-fixed.js',s)"
          node --check /tmp/cloud-v11-fixed.js
          retry_contains "$BASE/assets/steam-game-v111.js?v=1.1.3" '__mwsSteamGameV111' > /tmp/steam-v111.js
          node --check /tmp/steam-v111.js
          retry_contains "$BASE/assets/calendar-drag-layout-fix.css?v=1.1.3" 'min-height:128px!important' > /tmp/drag-fix.css

          echo 'Live Worker v1.2.0 wheel targeting, raid manager, RPS search persistence and reduced polling verified.'
