name: Activate TEST V5.4 Cloud
on:
  push:
    paths:
      - '.github/workflows/v54-activate-cloud.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate V5.4 cloud loader and version label
        run: |
          python - <<'PY'
          from pathlib import Path
          loader=Path('assets/online-v5-loader.js')
          s=loader.read_text(encoding='utf-8')
          old='run(cloud);run(features);'
          new="run(features);const v54=document.createElement('script');v54.src='assets/cloud-v5.4.js';v54.onload=()=>window.dispatchEvent(new Event('mws:v54-features-ready'));v54.onerror=()=>{const e=document.getElementById('mwsLoginError');if(e)e.textContent='V5.4 cloud 로딩 실패';};document.body.appendChild(v54);"
          if old not in s:
              raise SystemExit('loader activation target not found')
          loader.write_text(s.replace(old,new,1),encoding='utf-8')

          old_test=Path('assets/test-v5.3.js').read_text(encoding='utf-8')
          new_test=old_test.replace('MAWANG Scheduler TEST V5.3','MAWANG Scheduler TEST V5.4',1).replace("const VERSION='TEST V5.3';","const VERSION='TEST V5.4';",1)
          Path('assets/test-v5.4.js').write_text(new_test,encoding='utf-8')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('assets/test-v5.3.js','assets/test-v5.4.js')
          html=html.replace('TEST V5.3','TEST V5.4')
          index.write_text(html,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/cloud-v5.4.js
          node --check assets/test-v5.4.js
          node --check assets/online-v5-loader.js
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/online-v5-loader.js assets/test-v5.4.js
          git diff --cached --quiet && exit 0
          git commit -m "Activate TEST V5.4 incremental egress cache"
          git push
