name: TEST V5.4 Browser Egress Verification
on:
  push:
    paths:
      - '.github/workflows/v54-browser-egress-test.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          mkdir -p /tmp/mws-v54-test
          cd /tmp/mws-v54-test
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run real Chromium network verification
        run: |
          cat > /tmp/mws-v54-test/test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL='https://mawang0216-scheduler.vercel.app/';
          const SB='nysxcqlewzucbpoaymbg.supabase.co';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          const cdp=await context.newCDPSession(page);
          await cdp.send('Network.enable');
          let phase='boot';
          const phases={};
          const reqs=new Map();
          const consoleErrors=[];
          function bucket(){return phases[phase]||(phases[phase]={supabaseBytes:0,totalBytes:0,requests:[],cacheEvents:0,imageRequests:0,imageNetworkBytes:0,partFetches:[],manifestRequests:0})}
          page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push({phase,text:msg.text()})});
          page.on('pageerror',err=>consoleErrors.push({phase,text:String(err)}));
          cdp.on('Network.requestWillBeSent',e=>reqs.set(e.requestId,{url:e.request.url,phase,type:e.type,servedFromCache:false,status:0}));
          cdp.on('Network.requestServedFromCache',e=>{const r=reqs.get(e.requestId);if(r)r.servedFromCache=true;bucket().cacheEvents++});
          cdp.on('Network.responseReceived',e=>{const r=reqs.get(e.requestId);if(r){r.status=e.response.status;r.fromDiskCache=!!e.response.fromDiskCache;r.fromPrefetchCache=!!e.response.fromPrefetchCache;r.headers=e.response.headers;if(r.fromDiskCache)bucket().cacheEvents++}});
          cdp.on('Network.loadingFinished',e=>{
            const r=reqs.get(e.requestId);if(!r)return;
            const b=phases[r.phase]||(phases[r.phase]={supabaseBytes:0,totalBytes:0,requests:[],cacheEvents:0,imageRequests:0,imageNetworkBytes:0,partFetches:[],manifestRequests:0});
            const bytes=Math.max(0,Number(e.encodedDataLength)||0);b.totalBytes+=bytes;
            const isSb=r.url.includes(SB);
            if(isSb)b.supabaseBytes+=bytes;
            const image=/\/functions\/v1\/(contact-image|workspace-image)/.test(r.url);
            if(image){b.imageRequests++;b.imageNetworkBytes+=bytes}
            let part='';try{const u=new URL(r.url);const q=u.searchParams.get('part');if(q?.startsWith('eq.'))part=q.slice(3)}catch{}
            if(part)b.partFetches.push(part);
            if(r.url.includes('/rpc/get_workspace_manifest'))b.manifestRequests++;
            if(isSb||image)b.requests.push({url:r.url,status:r.status,bytes,fromCache:!!(r.servedFromCache||r.fromDiskCache||r.fromPrefetchCache),type:r.type});
          });
          async function waitHydrated(){
            await page.waitForFunction(()=>!document.body.classList.contains('mws-gated'),null,{timeout:30000});
            await page.waitForTimeout(1800);
          }
          async function idbLowerVersion(store){
            return await page.evaluate(async store=>{
              const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('mawang_data',2);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
              return await new Promise((resolve,reject)=>{
                const tx=db.transaction(store,'readwrite'),os=tx.objectStore(store),g=os.get('public');
                g.onsuccess=()=>{const row=g.result;if(!row){reject(new Error('missing cache '+store));return}const before=row.version;row.version=Math.max(0,Number(row.version)-1);os.put(row);tx.oncomplete=()=>resolve({before,after:row.version});tx.onerror=()=>reject(tx.error)};
                g.onerror=()=>reject(g.error);
              });
            },store);
          }
          phase='first_visit';
          await page.goto(URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#mwsModePublic',{timeout:30000});
          await page.click('#mwsModePublic');
          await page.click('#mwsLoginSubmit');
          await waitHydrated();
          const firstReport=await page.evaluate(()=>window.mwsV54EgressReport?.());

          phase='second_visit';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await waitHydrated();
          const secondReport=await page.evaluate(()=>window.mwsV54EgressReport?.());

          const eventsVersionChange=await idbLowerVersion('events');
          phase='events_cache_mismatch';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await waitHydrated();
          const eventsReport=await page.evaluate(()=>window.mwsV54EgressReport?.());

          const contactsVersionChange=await idbLowerVersion('contacts');
          phase='contacts_cache_mismatch';
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await waitHydrated();
          const contactsReport=await page.evaluate(()=>window.mwsV54EgressReport?.());

          phase='lazy_minigames';
          await page.evaluate(()=>window.setTab?.('gameMultiDraw'));
          await page.waitForTimeout(2200);
          const lazyReport=await page.evaluate(()=>window.mwsV54EgressReport?.());

          const manifest=await page.evaluate(()=>window.mwsV54EgressReport?.().manifest||null);
          await browser.close();
          const report={testedAt:new Date().toISOString(),url:URL,phases,eventsVersionChange,contactsVersionChange,manifest,clientReports:{firstReport,secondReport,eventsReport,contactsReport,lazyReport},consoleErrors};
          fs.mkdirSync('tools',{recursive:true});
          fs.writeFileSync('tools/v54-egress-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            first:phases.first_visit,
            second:phases.second_visit,
            events:phases.events_cache_mismatch,
            contacts:phases.contacts_cache_mismatch,
            lazy:phases.lazy_minigames,
            consoleErrors
          },null,2));
          const firstParts=new Set(phases.first_visit?.partFetches||[]);
          const secondParts=new Set(phases.second_visit?.partFetches||[]);
          const eventParts=new Set(phases.events_cache_mismatch?.partFetches||[]);
          const contactParts=new Set(phases.contacts_cache_mismatch?.partFetches||[]);
          const lazyParts=new Set(phases.lazy_minigames?.partFetches||[]);
          if(firstParts.has('miniGames'))throw new Error('miniGames downloaded during first visit');
          if(secondParts.size)throw new Error('unchanged second visit downloaded body parts: '+[...secondParts].join(','));
          if(eventParts.size!==1||!eventParts.has('events'))throw new Error('events mismatch did not fetch events only: '+[...eventParts].join(','));
          if(contactParts.size!==1||!contactParts.has('contacts'))throw new Error('contacts mismatch did not fetch contacts only: '+[...contactParts].join(','));
          if(lazyParts.size!==1||!lazyParts.has('miniGames'))throw new Error('lazy miniGames fetch mismatch: '+[...lazyParts].join(','));
          if(consoleErrors.some(x=>/SyntaxError|ReferenceError|TypeError/.test(x.text)))throw new Error('browser console has JS errors');
          JS
          cd /tmp/mws-v54-test
          node test.mjs
          cp tools/v54-egress-report.json "$GITHUB_WORKSPACE/tools/v54-egress-report.json"
      - name: Commit verification report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/v54-egress-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Record TEST V5.4 browser egress verification"
          git push
