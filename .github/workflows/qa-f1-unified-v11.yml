name: F1 Unified v1.1 Development QA

on:
  push:
    branches:
      - f1-unified-redesign-v11-20261012

permissions:
  contents: read
  statuses: write

concurrency:
  group: f1-unified-v11-dev-qa
  cancel-in-progress: true

jobs:
  unified-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check assets/f1-racing-v1.js
      - name: Recovery H legacy-QA classification contract
        run: node scripts/qa-f1-unified-v11-diagnostic-classification.mjs
      - name: Unified synthetic regression smoke
        run: node scripts/qa-f1-unified-v11-smoke.mjs
      - name: Active multi-car and pit-exit pass exclusion
        run: node scripts/qa-f1-unified-v11-competition.mjs
      - name: Overtake crossing ownership boundary regression
        run: node scripts/qa-f1-unified-v11-crossing-boundaries.mjs
      - name: Committed crossing pit-finish and multi-pass boundaries
        run: node scripts/qa-f1-unified-v11-crossing-engine.mjs
      - name: Active overtake attempt transition diagnostics
        run: node scripts/qa-f1-unified-v11-attempts.mjs
      - name: R0 competition baseline accepted-step diagnostics
        run: node scripts/qa-f1-v12-r0-baseline.mjs
      - name: R1 race-style energy and tyre policy regression
        run: node scripts/qa-f1-v12-r1-strategies.mjs
      - name: R2 multicar predictive corridor and pit merge regression
        run: node scripts/qa-f1-v12-r2-corridors.mjs
      - name: R3 pressure, fatigue and incident regression
        run: node scripts/qa-f1-v12-r3-risk.mjs
      - name: R4 sequential special and manual pause regression
        run: node scripts/qa-f1-v12-r4-specials.mjs
      - name: R5-b26 real pit-avoidance planning and no-teleport contract
        run: node scripts/qa-f1-v12-r5b26-pit-avoid-contract.mjs
      - name: R5-b32 physical pit merge safety and no-teleport contract
        run: node scripts/qa-f1-v12-r5b32-physical-pit-merge.mjs
      - name: R5-b39 reestablish pre-contact shared-lane chassis protection
        run: node scripts/qa-f1-v12-r5b38-reservation-physical-risk.mjs
      - name: R5-b40 exhaustive physical lane-reservation invariant
        run: node scripts/qa-f1-v12-r5b40-reservation-invariant.mjs
      - name: R5-b43 early pit intent preserves physical collision protection
        run: node scripts/qa-f1-v12-r5b43-pit-intent-contract.mjs
      - name: R5-b48 one playable Majoku Ring and six locked WIP circuits
        run: node scripts/qa-f1-v12-r5b48-single-track-access.mjs
      - name: R5-b4 physical tyre degradation and forecast contract
        run: node scripts/qa-f1-v12-r5b4-pit-economics.mjs
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: R5-b7 fixed-seed short Chromium replay diagnostic
        run: node scripts/qa-f1-v12-r5b7-seed-replay.mjs
      - name: Upload R5-b7 fixed-seed replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b7-seed-replay
          path: artifacts/f1-v12-r5b7-seed-replay.json
          if-no-files-found: warn
      - name: R5-b2 stable lifecycle and cross-compound integrated pit
        run: node scripts/qa-f1-v12-r5b-live-finish.mjs
      - name: Upload R5-b2 lifecycle and pit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b2-live-finish
          path: |
            artifacts/f1-v12-r5b2-live-finish.json
            artifacts/f1-v12-r5b2-finish.png
          if-no-files-found: warn
      - name: R5-b3 genuine NORMAL 10-lap automatic pit economics
        run: node scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
      - name: Upload R5-b3 full race and automatic pit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b3-normal-auto-pit
          path: artifacts/f1-v12-r5b3-normal-auto-pit.json
          if-no-files-found: warn
      - name: R5-b5 3-track dual-seed full NORMAL race and pit comparison
        run: node scripts/qa-f1-v12-r5b5-multitrack.mjs
      - name: Upload R5-b5 multitrack full-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b5-multitrack
          path: artifacts/r5-b5/
          if-no-files-found: warn
      - name: Short real-SVG track physics
        run: node scripts/qa-f1-unified-v11-real-tracks.mjs
      - name: R5 real-SVG 7-track multiseed race competition
        env:
          MWS_R5_WINDOW_SECONDS: '90'
          MWS_R5_SEEDS: '2'
        run: node scripts/qa-f1-v12-r5-balance.mjs
      - name: Upload R5 competition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5-balance
          path: artifacts/f1-v12-r5-balance.json
          if-no-files-found: warn
      - name: R5-b45 verify actual full-race passes and seven-track physics
        run: node scripts/qa-f1-v12-r5b45-multitrack-competition-gate.mjs
      - name: Upload R5-b45 physical competition gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b45-competition-gate
          path: artifacts/f1-v12-r5b45-competition-gate.json
          if-no-files-found: warn
      - name: R5-b46 trace 28 actual leader gaps by seed and SVG circuit
        run: node scripts/qa-f1-v12-r5b46-lead-gap-cause-audit.mjs
      - name: R5-b47 guard against deteriorating leader runaway and physical overtakes
        run: node scripts/qa-f1-v12-r5b47-leader-balance-regression.mjs
      - name: Upload R5-b47 balance-regression verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b47-balance
          path: artifacts/f1-v12-r5b47-leader-balance.json
          if-no-files-found: warn
      - name: Upload R5-b46 accepted lead-gap provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b46-lead-gap
          path: artifacts/f1-v12-r5b46-lead-gap-causes.json
          if-no-files-found: warn
      - name: R5-a seed-stratified 5-second pace and lead-gap audit
        run: node scripts/qa-f1-v12-r5a-cause.mjs
      - name: R5-a extended FAST limited real-SVG pilot
        env:
          MWS_R5_WINDOW_SECONDS: '240'
          MWS_R5_SEEDS: '2'
          MWS_R5_TRACK_FILTER: 'castle-street-circuit-v1'
          MWS_R5_MODE_FILTER: 'FAST'
          MWS_R5_STOP_AT_LAP_LIMIT: '1'
        run: |
          node scripts/qa-f1-v12-r5-balance.mjs
          mv artifacts/f1-v12-r5-balance.json artifacts/f1-v12-r5a-extended.json
          MWS_R5A_INPUT=artifacts/f1-v12-r5a-extended.json MWS_R5A_OUTPUT=artifacts/f1-v12-r5a-extended-cause.json node scripts/qa-f1-v12-r5a-cause.mjs
      - name: Upload R5-a cause and extended pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5a-cause
          path: |
            artifacts/f1-v12-r5a-cause.json
            artifacts/f1-v12-r5a-extended.json
            artifacts/f1-v12-r5a-extended-cause.json
          if-no-files-found: warn
      - name: Chromium FHD-QHD UI integration
        run: node scripts/qa-f1-unified-v11-browser.mjs
      - name: Publish verified development QA commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$QA_JOB_STATUS" = "success" ]; then status=success; else status=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$status" \
            -f context="MWS F1 Unified Development QA" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Verified GitHub Actions full development QA job: $status"


  # Parallel independent full-race counterfactual, avoids extending existing 35m CI job.
  paired-pit-policy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout paired QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for paired QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate paired Chromium QA syntax
        run: node --check scripts/qa-f1-v12-r5b8-paired-pit.mjs
      - name: Install paired Chromium dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: "R5-b8 paired full NORMAL race: natural pit versus no pit"
        run: node scripts/qa-f1-v12-r5b8-paired-pit.mjs
      - name: Upload R5-b8 paired race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b8-paired-pit
          path: artifacts/f1-v12-r5b8-paired-pit.json
          if-no-files-found: warn

  # Focused REAL Royal Street seed 1 replay: preserving rejected physical steps
  # instead of a 360-second loop that previously hid the collision details.
  royal-street-contact-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout Royal Street QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for Royal Street QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for Royal Street QA
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: R5-b8 Royal Street first physical rejection
        env:
          MWS_R5B3_TRACK: royal-street-circuit-v1
          MWS_R5B3_SEED: '1'
          MWS_R5B3_PORT: '8876'
          MWS_R5B3_OUTPUT: artifacts/f1-v12-r5b8-royal-contact.json
        run: node scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
      - name: Upload Royal Street first-contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b8-royal-contact
          path: artifacts/f1-v12-r5b8-royal-contact.json
          if-no-files-found: warn

  # Blue Coast 10-lap counterfactual; read-only for the committed race engine.
  blue-coast-pit-counterfactual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
    steps:
      - name: Checkout Blue Coast QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for Blue Coast QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Blue Coast QA syntax
        run: node --check scripts/qa-f1-v12-r5b9-blue-coast-paired.mjs
      - name: R5-b43 confirm pit intent unit safety before full seed race
        run: node scripts/qa-f1-v12-r5b43-pit-intent-contract.mjs
      # R5-b41: Seed 2 timed out before racing while apt mirrored Ubuntu
      # repositories stalled. Runner already has Chromium libraries; avoid
      # Playwright's optional font apt install and prove launch before racing.
      - name: R5-b41 install Chromium without OS package refresh
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: R5-b41 verify headless Chromium launch
        run: node --input-type=module -e 'import {chromium} from "playwright"; const browser=await chromium.launch({headless:true}); await browser.close();'
      - name: "R5-b9 Blue Coast 10-lap: no pit vs SOFT MEDIUM HARD"
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b9-blue-coast-paired.mjs
      - name: R5-b44 validate real Blue Coast traffic-wave recovery and physics
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b44-blue-coast-wave-regression.mjs
      - name: Upload R5-b44 accepted-solver wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b44-wave-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b44-wave-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b21 verify accepted 20ms and 100ms slowdown-chain accounting
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b21-chain-audit.mjs
      - name: Upload R5-b21 slowdown-chain audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b21-chain-audit-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b21-chain-audit-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b23 audit binding upstream car and first slowdown onset
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b23-upstream-provenance.mjs
      - name: Upload R5-b23 upstream braking-provenance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b23-upstream-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b23-upstream-provenance-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b25 verify true pit and main-track physical separation
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b25-pit-corridor-safety.mjs
      - name: Upload R5-b25 pit-main collision safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b25-pit-corridor-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b25-pit-corridor-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b33 independent pit-entry physical blockage accounting
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b33-pit-entry-bottleneck-audit.mjs
      - name: Upload R5-b33 real pit-entry bottleneck data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b33-pit-entry-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b33-pit-entry-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b36 audit real progressive pit lane movement
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b36-progressive-pit-qa.mjs
      - name: Upload R5-b36 actual partial pit movement audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b36-progressive-pit-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b36-progressive-pit-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b37 independently reconcile accepted physical lane veto telemetry
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b37-reservation-audit.mjs
      - name: Upload R5-b37 physical reservation overrides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b37-reservation-audit-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b37-reservation-audit-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b27 prove collision-free physical pit avoidance and delayed-traffic improvement
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b27-active-pit-avoidance.mjs
      - name: Upload R5-b27 pit-avoidance full-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b27-pit-avoidance-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b27-active-pit-avoidance-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: Upload Blue Coast matched-race data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b9-blue-coast-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b9-blue-coast-seed${{ matrix.seed }}.json
          if-no-files-found: warn

  # R5-b49/b50/b51: user-approved SINGLE released circuit only.
  # This job intentionally does not develop or tune any WIP circuit.
  majoku-fullrace-balance-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Majoku-only balance diagnostics
        uses: actions/checkout@v4
      - name: Setup Node 22 for Majoku QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Majoku full-race audit scripts
        run: |
          node --check scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
          node --check scripts/qa-f1-v12-r5b49-majoku-fullrace.mjs
          node --check scripts/qa-f1-v12-r5b50-majoku-cause-audit.mjs
          node --check scripts/qa-f1-v12-r5b51-majoku-matched-pace.mjs
          node --check scripts/qa-f1-v12-r5b53-majoku-matched-strategy.mjs
          node --check scripts/qa-f1-v12-r5b54-majoku-attribution.mjs
          node --check scripts/qa-f1-v12-r5b56-majoku-pass-anatomy.mjs
          node --check scripts/qa-f1-v12-r5b57-majoku-balance-decision.mjs
          node --check scripts/qa-f1-v12-r5b61-majoku-leader-provenance.mjs
          node --check scripts/qa-f1-v12-r5b62-majoku-competition-quality.mjs
          node --check scripts/qa-f1-v12-r5b63-majoku-race-quality-gate.mjs
      - name: Install browser for Majoku-only 10-lap comparisons
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Verify Chromium launch
        run: node --input-type=module -e 'import {chromium} from "playwright"; const browser=await chromium.launch({headless:true}); await browser.close();'
      - name: R5-b49 two real 12-car 10-lap Majoku baselines
        run: node scripts/qa-f1-v12-r5b49-majoku-fullrace.mjs
      - name: R5-b50 actual pace, ERS, tyre and leader-gap provenance
        run: node scripts/qa-f1-v12-r5b50-majoku-cause-audit.mjs
      - name: R5-b51 matched full-race pace-only intervention
        run: node scripts/qa-f1-v12-r5b51-majoku-matched-pace.mjs
      - name: R5-b53 matched full-race strategy-only intervention
        run: node scripts/qa-f1-v12-r5b53-majoku-matched-strategy.mjs
      - name: R5-b54 reconcile measured natural, pace-only and strategy-only outcomes
        run: node scripts/qa-f1-v12-r5b54-majoku-attribution.mjs
      - name: R5-b56 validate actual Majoku physical passes, lead changes and 100m streaks
        run: node scripts/qa-f1-v12-r5b56-majoku-pass-anatomy.mjs
      - name: R5-b57 issue no-speculation two-seed Majoku diagnosis
        run: node scripts/qa-f1-v12-r5b57-majoku-balance-decision.mjs
      - name: R5-b61 separate confirmed leader-pass evidence from pit and finish reorders
        run: node scripts/qa-f1-v12-r5b61-majoku-leader-provenance.mjs
      - name: R5-b62 audit ten-lap genuine physical duels and podium involvement
        run: node scripts/qa-f1-v12-r5b62-majoku-competition-quality.mjs
      - name: R5-b63 enforce collision-free Majoku two-seed racing quality
        run: node scripts/qa-f1-v12-r5b63-majoku-race-quality-gate.mjs
      - name: Upload Majoku-only full race baseline and comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b49-r5b63-majoku-fullrace
          path: |
            artifacts/r5-b49-majoku/
            artifacts/r5-b51-majoku/
            artifacts/r5-b53-majoku/
          if-no-files-found: warn

  # R5-b58 to R5-b60: fast Majoku-only independent real-SVG observation.
  # Deliberately not a substitute for the six authentic 10-lap browser races.
  majoku-short-window-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Majoku-only short-window physics QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful full-race evidence still matches unchanged physics
        run: |
          git diff --exit-code b4a7c7547ee826d0d9cc91769cecdf162fcb93d5 HEAD -- \
            assets/f1-racing-v1.js assets/f1-track-v1.js assets/f1-track-geometry-v2.js \
            scripts/qa-f1-v12-r5b49-majoku-fullrace.mjs \
            scripts/qa-f1-v12-r5b51-majoku-matched-pace.mjs \
            scripts/qa-f1-v12-r5b53-majoku-matched-strategy.mjs
      - name: Setup Node 22 for Majoku physics
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check R5-b58 to b60 diagnostic syntax
        run: |
          node --check scripts/qa-f1-v12-r5-balance.mjs
          node --check scripts/qa-f1-v12-r5b59-majoku-short-matched.mjs
          node --check scripts/qa-f1-v12-r5b60-majoku-window-attribution.mjs
          node --check scripts/qa-f1-v12-r5b66-majoku-traffic-attribution.mjs
          node --check scripts/qa-f1-v12-r5b64-majoku-early-traffic.mjs
          node --check scripts/qa-f1-v12-r5b67-majoku-chase-modes.mjs
          node --check scripts/qa-f1-v12-r5b68-majoku-attack-outcomes.mjs
          node --check scripts/qa-f1-v12-r5b69-majoku-ai-decision-gate.mjs
          node --check scripts/qa-f1-v12-r5b71-majoku-20ms-controls.mjs
          node --check scripts/qa-f1-v12-r5b72-majoku-corridor-decision.mjs
          node --check scripts/qa-f1-v12-r5b75-majoku-grid-counterfactual.mjs
      - name: Install headless Chromium for Majoku-only physics
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Verify Chromium can start
        run: node --input-type=module -e 'import {chromium} from "playwright"; const b=await chromium.launch({headless:true}); await b.close();'
      - name: R5-b59 three matched Majoku 90s physics variants
        run: node scripts/qa-f1-v12-r5b59-majoku-short-matched.mjs
      - name: R5-b60 verify real leader gap and passing effects without tuning
        run: node scripts/qa-f1-v12-r5b60-majoku-window-attribution.mjs
      - name: R5-b66 verify real traffic constraints per physical vehicle
