name: F1 Unified v1.1 Development QA

on:
  push:
    branches:
      - f1-unified-redesign-v11-20261012

permissions:
  contents: read
  statuses: write

concurrency:
  group: f1-unified-v11-dev-qa
  cancel-in-progress: true

jobs:
  unified-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check assets/f1-racing-v1.js
      - name: Recovery H legacy-QA classification contract
        run: node scripts/qa-f1-unified-v11-diagnostic-classification.mjs
      - name: Unified synthetic regression smoke
        run: node scripts/qa-f1-unified-v11-smoke.mjs
      - name: Active multi-car and pit-exit pass exclusion
        run: node scripts/qa-f1-unified-v11-competition.mjs
      - name: Overtake crossing ownership boundary regression
        run: node scripts/qa-f1-unified-v11-crossing-boundaries.mjs
      - name: Committed crossing pit-finish and multi-pass boundaries
        run: node scripts/qa-f1-unified-v11-crossing-engine.mjs
      - name: Active overtake attempt transition diagnostics
        run: node scripts/qa-f1-unified-v11-attempts.mjs
      - name: R0 competition baseline accepted-step diagnostics
        run: node scripts/qa-f1-v12-r0-baseline.mjs
      - name: R1 race-style energy and tyre policy regression
        run: node scripts/qa-f1-v12-r1-strategies.mjs
      - name: R2 multicar predictive corridor and pit merge regression
        run: node scripts/qa-f1-v12-r2-corridors.mjs
      - name: R3 pressure, fatigue and incident regression
        run: node scripts/qa-f1-v12-r3-risk.mjs
      - name: R4 sequential special and manual pause regression
        run: node scripts/qa-f1-v12-r4-specials.mjs
      - name: R5-b26 real pit-avoidance planning and no-teleport contract
        run: node scripts/qa-f1-v12-r5b26-pit-avoid-contract.mjs
      - name: R5-b32 physical pit merge safety and no-teleport contract
        run: node scripts/qa-f1-v12-r5b32-physical-pit-merge.mjs
      - name: R5-b4 physical tyre degradation and forecast contract
        run: node scripts/qa-f1-v12-r5b4-pit-economics.mjs
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: R5-b7 fixed-seed short Chromium replay diagnostic
        run: node scripts/qa-f1-v12-r5b7-seed-replay.mjs
      - name: Upload R5-b7 fixed-seed replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b7-seed-replay
          path: artifacts/f1-v12-r5b7-seed-replay.json
          if-no-files-found: warn
      - name: R5-b2 stable lifecycle and cross-compound integrated pit
        run: node scripts/qa-f1-v12-r5b-live-finish.mjs
      - name: Upload R5-b2 lifecycle and pit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b2-live-finish
          path: |
            artifacts/f1-v12-r5b2-live-finish.json
            artifacts/f1-v12-r5b2-finish.png
          if-no-files-found: warn
      - name: R5-b3 genuine NORMAL 10-lap automatic pit economics
        run: node scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
      - name: Upload R5-b3 full race and automatic pit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b3-normal-auto-pit
          path: artifacts/f1-v12-r5b3-normal-auto-pit.json
          if-no-files-found: warn
      - name: R5-b5 3-track dual-seed full NORMAL race and pit comparison
        run: node scripts/qa-f1-v12-r5b5-multitrack.mjs
      - name: Upload R5-b5 multitrack full-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b5-multitrack
          path: artifacts/r5-b5/
          if-no-files-found: warn
      - name: Short real-SVG track physics
        run: node scripts/qa-f1-unified-v11-real-tracks.mjs
      - name: R5 real-SVG 7-track multiseed race competition
        env:
          MWS_R5_WINDOW_SECONDS: '90'
          MWS_R5_SEEDS: '2'
        run: node scripts/qa-f1-v12-r5-balance.mjs
      - name: Upload R5 competition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5-balance
          path: artifacts/f1-v12-r5-balance.json
          if-no-files-found: warn
      - name: R5-a seed-stratified 5-second pace and lead-gap audit
        run: node scripts/qa-f1-v12-r5a-cause.mjs
      - name: R5-a extended FAST limited real-SVG pilot
        env:
          MWS_R5_WINDOW_SECONDS: '240'
          MWS_R5_SEEDS: '2'
          MWS_R5_TRACK_FILTER: 'castle-street-circuit-v1'
          MWS_R5_MODE_FILTER: 'FAST'
          MWS_R5_STOP_AT_LAP_LIMIT: '1'
        run: |
          node scripts/qa-f1-v12-r5-balance.mjs
          mv artifacts/f1-v12-r5-balance.json artifacts/f1-v12-r5a-extended.json
          MWS_R5A_INPUT=artifacts/f1-v12-r5a-extended.json MWS_R5A_OUTPUT=artifacts/f1-v12-r5a-extended-cause.json node scripts/qa-f1-v12-r5a-cause.mjs
      - name: Upload R5-a cause and extended pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5a-cause
          path: |
            artifacts/f1-v12-r5a-cause.json
            artifacts/f1-v12-r5a-extended.json
            artifacts/f1-v12-r5a-extended-cause.json
          if-no-files-found: warn
      - name: Chromium FHD-QHD UI integration
        run: node scripts/qa-f1-unified-v11-browser.mjs
      - name: Publish verified development QA commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$QA_JOB_STATUS" = "success" ]; then status=success; else status=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$status" \
            -f context="MWS F1 Unified Development QA" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Verified GitHub Actions full development QA job: $status"


  # Parallel independent full-race counterfactual, avoids extending existing 35m CI job.
  paired-pit-policy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout paired QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for paired QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate paired Chromium QA syntax
        run: node --check scripts/qa-f1-v12-r5b8-paired-pit.mjs
      - name: Install paired Chromium dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: "R5-b8 paired full NORMAL race: natural pit versus no pit"
        run: node scripts/qa-f1-v12-r5b8-paired-pit.mjs
      - name: Upload R5-b8 paired race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b8-paired-pit
          path: artifacts/f1-v12-r5b8-paired-pit.json
          if-no-files-found: warn

  # Focused REAL Royal Street seed 1 replay: preserving rejected physical steps
  # instead of a 360-second loop that previously hid the collision details.
  royal-street-contact-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout Royal Street QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for Royal Street QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for Royal Street QA
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: R5-b8 Royal Street first physical rejection
        env:
          MWS_R5B3_TRACK: royal-street-circuit-v1
          MWS_R5B3_SEED: '1'
          MWS_R5B3_PORT: '8876'
          MWS_R5B3_OUTPUT: artifacts/f1-v12-r5b8-royal-contact.json
        run: node scripts/qa-f1-v12-r5b3-normal-auto-pit.mjs
      - name: Upload Royal Street first-contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b8-royal-contact
          path: artifacts/f1-v12-r5b8-royal-contact.json
          if-no-files-found: warn

  # Blue Coast 10-lap counterfactual; read-only for the committed race engine.
  blue-coast-pit-counterfactual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
    steps:
      - name: Checkout Blue Coast QA
        uses: actions/checkout@v4
      - name: Setup Node 22 for Blue Coast QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Blue Coast QA syntax
        run: node --check scripts/qa-f1-v12-r5b9-blue-coast-paired.mjs
      - name: Install Chromium for Blue Coast QA
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: "R5-b9 Blue Coast 10-lap: no pit vs SOFT MEDIUM HARD"
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b9-blue-coast-paired.mjs
      - name: R5-b21 verify accepted 20ms and 100ms slowdown-chain accounting
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b21-chain-audit.mjs
      - name: Upload R5-b21 slowdown-chain audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b21-chain-audit-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b21-chain-audit-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b23 audit binding upstream car and first slowdown onset
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b23-upstream-provenance.mjs
      - name: Upload R5-b23 upstream braking-provenance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b23-upstream-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b23-upstream-provenance-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b25 verify true pit and main-track physical separation
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b25-pit-corridor-safety.mjs
      - name: Upload R5-b25 pit-main collision safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b25-pit-corridor-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b25-pit-corridor-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: R5-b27 prove collision-free physical pit avoidance and delayed-traffic improvement
        env:
          MWS_R5B9_SEED: ${{ matrix.seed }}
        run: node scripts/qa-f1-v12-r5b27-active-pit-avoidance.mjs
      - name: Upload R5-b27 pit-avoidance full-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b27-pit-avoidance-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b27-active-pit-avoidance-seed${{ matrix.seed }}.json
          if-no-files-found: warn
      - name: Upload Blue Coast matched-race data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-v12-r5b9-blue-coast-seed${{ matrix.seed }}
          path: artifacts/f1-v12-r5b9-blue-coast-seed${{ matrix.seed }}.json
          if-no-files-found: warn
