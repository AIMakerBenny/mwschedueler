name: V1.0.17 emoticon persistence one-off

on:
  push:
    branches:
      - mws-v1.0.17-emoticon-persistence
    paths:
      - .github/workflows/v1017-emoticon-persistence-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mws-v1.0.17-emoticon-persistence
          fetch-depth: 0

      - name: Apply direct source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n == 0:
                  raise SystemExit(f'missing replacement target in {path}: {old[:120]!r}')
              if count is not None and n != count:
                  raise SystemExit(f'unexpected replacement count in {path}: {n} != {count}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Custom emoticons belong to the existing contactMeta D1 part.
          must_replace(
              'assets/cloud-v5.5.js',
              "const INITIAL_PARTS=['core','contacts','events','posts','activity'];",
              "const INITIAL_PARTS=['core','contacts','contactMeta','events','posts','activity'];",
              1,
          )
          must_replace(
              'assets/cloud-v5.5.js',
              "if(part==='contactMeta')return {contactTags:clone(Array.isArray(d.contactTags)?d.contactTags:[]),contactTagBanners:clone(d.contactTagBanners&&typeof d.contactTagBanners==='object'?d.contactTagBanners:{})};",
              "if(part==='contactMeta')return {contactTags:clone(Array.isArray(d.contactTags)?d.contactTags:[]),contactTagBanners:clone(d.contactTagBanners&&typeof d.contactTagBanners==='object'?d.contactTagBanners:{}),emoticons:clone(Array.isArray(d.emoticons)?d.emoticons:[])};",
              1,
          )
          must_replace(
              'assets/cloud-v5.5.js',
              "contactTags:[],contactTagBanners:{},scheduleClipboard:[],timezones:[]}}",
              "contactTags:[],contactTagBanners:{},emoticons:[],scheduleClipboard:[],timezones:[]}}",
              1,
          )

          # Externalize emoticon data URLs to the already configured R2 workspace bucket,
          # then let the current authenticated D1 save path store only the R2 reference.
          p = Path('src/cf-v57.js')
          s = p.read_text(encoding='utf-8')
          anchor = "async function normalizedSaveRequest(request, base) {\n"
          if anchor not in s:
              raise SystemExit('cf-v57 normalizedSaveRequest anchor missing')
          helper = r'''function parseDataImageV117(value) {
            if (typeof value !== 'string') return null;
            const match = /^data:([^;,]+);base64,(.+)$/s.exec(value);
            if (!match) return null;
            const binary = atob(match[2]);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return { contentType: match[1] || 'application/octet-stream', bytes };
          }

          async function shortHashV117(value) {
            const bytes = new TextEncoder().encode(String(value));
            const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
            return [...hash].slice(0, 16).map((x) => x.toString(16).padStart(2, '0')).join('');
          }

          async function storeEmoticonV117(env, seed, dataUrl) {
            const parsed = parseDataImageV117(dataUrl);
            if (!parsed) return dataUrl;
            const key = `emoticon-${await shortHashV117(seed)}`;
            const row = await env.DB.prepare('SELECT version FROM image_sources WHERE kind=? AND item_key=?').bind('workspace', key).first();
            const version = Math.max(1, Number(row?.version) || 0) + 1;
            await env.IMAGES.put(`workspace/${key}`, parsed.bytes, {
              httpMetadata: { contentType: parsed.contentType },
              customMetadata: { mwsVersion: String(version), source: 'mws-emoticon-upload' },
            });
            await env.DB.prepare(`INSERT INTO image_sources(kind,item_key,source_url,version,content_type,updated_at)
              VALUES('workspace',?,?,?,?,CURRENT_TIMESTAMP)
              ON CONFLICT(kind,item_key) DO UPDATE SET source_url=NULL,version=excluded.version,content_type=excluded.content_type,updated_at=CURRENT_TIMESTAMP`)
              .bind(key, null, version, parsed.contentType).run();
            return `/media/workspace/${encodeURIComponent(key)}?v=${version}`;
          }

          async function externalizeEmoticonsV117(env, body) {
            const list = body?.parts?.contactMeta?.emoticons;
            if (!Array.isArray(list)) return;
            for (let i = 0; i < list.length; i++) {
              const item = list[i];
              if (!item || typeof item !== 'object') continue;
              if (parseDataImageV117(item.src)) {
                const seed = String(item.id || item.name || `item-${i + 1}`);
                item.src = await storeEmoticonV117(env, seed, item.src);
              }
            }
          }

          '''
          s = s.replace(anchor, helper + 'async function normalizedSaveRequest(request, env, base) {\n', 1)
          s = s.replace('  const rewritten = rewriteDirectUrlsToInternal(body, base);', '  await externalizeEmoticonsV117(env, body);\n  const rewritten = rewriteDirectUrlsToInternal(body, base);', 1)
          s = s.replace('? await normalizedSaveRequest(request, base)', '? await normalizedSaveRequest(request, env, base)', 1)
          p.write_text(s, encoding='utf-8')

          # Wait for the queued cloud write before the manager reports an add/delete as complete.
          p = Path('assets/content-planner-host.js')
          s = p.read_text(encoding='utf-8')
          anchor = "function renderEmoticonManagerV114()"
          helper = "async function persistEmoticonsV117(reason){const saver=window.saveData||window.persist;if(typeof saver==='function')await saver(reason);if(document.body?.dataset?.mwsMode==='admin'&&typeof window.mwsV55SaveNow==='function'){const ok=await window.mwsV55SaveNow();if(!ok)throw new Error('이모티콘 온라인 저장에 실패했습니다.')}}\n"
          if anchor not in s:
              raise SystemExit('content planner host emoticon anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          old_delete = "const saver=window.saveData||window.persist;if(typeof saver==='function')await saver('이모티콘 삭제');renderEmoticonManagerV114();sendEmoticons()"
          old_add = "const saver=window.saveData||window.persist;if(typeof saver==='function')await saver('이모티콘 추가');renderEmoticonManagerV114();sendEmoticons()"
          if old_delete not in s or old_add not in s:
              raise SystemExit('emoticon save call targets missing')
          s = s.replace(old_delete, "await persistEmoticonsV117('이모티콘 삭제');renderEmoticonManagerV114();sendEmoticons()", 1)
          s = s.replace(old_add, "await persistEmoticonsV117('이모티콘 추가');renderEmoticonManagerV114();sendEmoticons()", 1)
          p.write_text(s, encoding='utf-8')

          # Remove only the old non-executing JSON script residue from the page.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2, removed = re.subn(r'\n?<script id="mws-supabase-cloud-layer"[^>]*>.*?</script>\n?', '\n', s, flags=re.S)
          if removed < 1:
              raise SystemExit('stale mws-supabase-cloud-layer block not found')
          p.write_text(s2, encoding='utf-8')

          p = Path('assets/app-core.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('These never belong to shared Supabase data.', 'These never belong to shared cloud data.')
          p.write_text(s, encoding='utf-8')

          # Direct V1.0.16 -> V1.0.17 continuation only.
          for filename in ['index.html','content-planner.html','assets/content-planner-host.js','assets/tools.js','src/cf-v571.js','package.json']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('1.0.16', '1.0.17')
              p.write_text(s, encoding='utf-8')

          cloud = Path('assets/cloud-v5.5.js').read_text(encoding='utf-8')
          host = Path('assets/content-planner-host.js').read_text(encoding='utf-8')
          wrapper = Path('src/cf-v57.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          assert "emoticons:clone(Array.isArray(d.emoticons)?d.emoticons:[])" in cloud
          assert "'contactMeta'" in cloud.split('const INITIAL_PARTS=',1)[1].split(';',1)[0]
          assert 'persistEmoticonsV117' in host and 'mwsV55SaveNow' in host
          assert 'externalizeEmoticonsV117' in wrapper and 'mws-emoticon-upload' in wrapper
          assert 'mws-supabase-cloud-layer' not in index
          assert 'CF MWS V 1.0.17' in host

          Path('.github/workflows/v1017-emoticon-persistence-oneoff.yml').unlink()
          PY

      - name: Syntax checks
        run: |
          node --check assets/cloud-v5.5.js
          node --check assets/content-planner-host.js
          node --check assets/tools.js
          node --check src/cf-v57.js
          node --check src/cf-v571.js
          node --check src/index.js

      - name: Commit clean V1.0.17 source
        run: |
          git config user.name "MAWANG Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Persist custom emoticons across refresh V1.0.17"
          git push origin HEAD:mws-v1.0.17-emoticon-persistence
