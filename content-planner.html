<!doctype html>
<meta charset="utf-8">
<title>MAWANG Content Planner</title>
<body style="margin:0;background:#070a12;color:#f5f7ff;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif">
<div id="boot" style="height:100vh;display:grid;place-items:center;color:#94a3c4">컨텐츠 플래너 불러오는 중...</div>
<script>
(async()=>{
  try{
    const files=[
      '/assets/content-planner-pack-1.txt?v=1.0.3',
      '/assets/content-planner-pack-2a.txt?v=1.0.3',
      '/assets/content-planner-pack-2b.txt?v=1.0.3',
      '/assets/content-planner-pack-3a.txt?v=1.0.3',
      '/assets/content-planner-pack-3b.txt?v=1.0.3',
      '/assets/content-planner-pack-4a.txt?v=1.0.3',
      '/assets/content-planner-pack-4b.txt?v=1.0.3',
      '/assets/content-planner-pack-5a.txt?v=1.0.3',
      '/assets/content-planner-pack-5b.txt?v=1.0.3',
      '/assets/content-planner-pack-6a.txt?v=1.0.3',
      '/assets/content-planner-pack-6b.txt?v=1.0.3'
    ];
    const parts=await Promise.all(files.map(url=>fetch(url,{cache:'force-cache'}).then(r=>{
      if(!r.ok)throw new Error('planner payload '+r.status);
      return r.text();
    })));
    const b=parts.join('');
    const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
    if(typeof DecompressionStream!=='function')throw new Error('DecompressionStream unavailable');
    const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('Content Planner load failed',e);
    document.getElementById('boot').textContent='컨텐츠 플래너를 불러오지 못했습니다. 브라우저를 새로고침해 주세요.';
  }
})();
</script>
</body>
