<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAWANG Content Planner</title>
<style>
:root{--b:#070a12;--p:#0e1422;--p2:#151d30;--l:#283653;--t:#f5f7ff;--m:#94a3c4;--a:#8b5cf6}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--t);font:13px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#090e19;border-bottom:1px solid var(--l)}.brand{min-width:240px}.brand b{font-size:14px}.brand small{display:block;color:var(--m);font-size:9px}.tabs{display:flex;gap:5px;flex:1;justify-content:center}.btn,.tabs button{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:8px;padding:8px 10px;font-weight:800}.tabs .on,.primary{background:var(--a)!important;border-color:var(--a)!important}.actions{min-width:240px;display:flex;justify-content:flex-end;gap:5px}.app{height:calc(100vh - 56px)}.home{height:100%;display:grid;place-items:center;padding:24px}.home.hide{display:none}.homebox{width:min(960px,96vw)}.home h1{font-size:32px;margin:8px 0}.muted{color:var(--m)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.mode{padding:20px;border:1px solid var(--l);border-radius:16px;background:linear-gradient(145deg,#11192b,#0c1220);color:var(--t);text-align:left;min-height:180px}.mode p{color:var(--m);line-height:1.5}.creator{height:100%;display:none;grid-template-columns:190px 1fr 220px;grid-template-rows:44px 1fr}.creator.on{display:grid}.bar{grid-column:1/-1;display:flex;align-items:center;gap:5px;padding:6px;background:#0b101c;border-bottom:1px solid var(--l);overflow:auto}.side{padding:9px;background:#0b101c;overflow:auto}.left{border-right:1px solid var(--l)}.right{border-left:1px solid var(--l)}.st{font-size:9px;color:#7f91b8;font-weight:900;letter-spacing:.12em;margin:8px 2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tool{min-height:54px;padding:8px;border:1px solid var(--l);background:#101727;color:var(--t);border-radius:9px;text-align:left}.tool b{display:block;font-size:11px}.tool small{display:block;color:var(--m);font-size:8px;margin-top:3px}.card{border:1px solid var(--l);background:#101727;border-radius:9px;padding:8px;margin-bottom:8px}.card label{display:block;color:var(--m);font-size:9px;margin:5px 0}.card input,.card textarea,.card select,.search{width:100%;border:1px solid var(--l);background:#0b1120;color:var(--t);border-radius:7px;padding:7px}.card textarea{min-height:60px}.workspace{overflow:auto;background:#060911}.ws{height:32px;position:sticky;top:0;z-index:10;display:flex;gap:6px;align-items:center;padding:4px 8px;background:#080d18;border-bottom:1px solid #182237}.ws span:last-child{margin-left:auto;color:var(--m);font-size:9px}.wrap{padding:26px 34px 80px;min-width:max-content;min-height:max-content}.board{width:1600px;height:1000px;position:relative;transform-origin:top left;background:#f8f9fc;color:#111;box-shadow:0 20px 50px #0008;overflow:hidden}.board.grid{background-image:linear-gradient(#dfe4ec 1px,transparent 1px),linear-gradient(90deg,#dfe4ec 1px,transparent 1px);background-size:32px 32px}.board.dot{background-image:radial-gradient(#c6ccd8 1.2px,transparent 1.2px);background-size:24px 24px}.board.paper{background:#fbfaf6}.board.dark{background:#101522;color:#fff}.layer{position:absolute;inset:0;pointer-events:none}.node{position:absolute;pointer-events:auto;min-width:50px;min-height:36px}.node.sel{outline:2px solid var(--a);outline-offset:2px}.drag{display:none;position:absolute;left:0;right:0;top:-17px;height:17px;background:#6f52e5;color:#fff;font-size:8px;align-items:center;justify-content:center;cursor:move}.node.sel .drag{display:flex}.resize{display:none;position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7658e7;cursor:nwse-resize}.node.sel .resize{display:block}.text{padding:6px}.sticky{padding:14px;background:#fff09a;color:#292814}.shape{display:grid;place-items:center;border:3px solid #7c5cff;background:#7c5cff18}.shape.ellipse{border-radius:50%}.image{overflow:hidden;background:#e8ebf1}.image img{width:100%;height:100%;object-fit:cover}.participant{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:center;padding:10px;border:1px solid #3a4b70;border-radius:12px;background:#12192b;color:#fff}.participant img,.av{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#5e45ba;display:grid;place-items:center}.participant small{display:block;color:#aab9da;margin-top:3px}.timeline,.check{padding:10px;border:1px solid #ccd4df;border-radius:10px;background:#fff;color:#172033}.timeline .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ddd;font-size:10px}.check .r{padding:4px 0;font-size:10px}.frame{border:2px dashed #7658e7}.frame span{background:#6f52e5;color:#fff;padding:3px 6px;font-size:9px}.archive{height:100%;display:none;overflow:auto;padding:16px}.archive.on{display:block}.ahead{display:flex;justify-content:space-between;align-items:end;gap:10px}.atools{display:flex;gap:5px}.atools input,.atools select{border:1px solid var(--l);background:var(--p);color:var(--t);padding:8px;border-radius:7px}.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:12px}.prop{border:1px solid var(--l);background:var(--p);border-radius:12px;overflow:hidden;cursor:pointer}.prev{height:130px;background:#171d2c;display:grid;place-items:center;overflow:hidden}.prev img{width:100%;height:100%;object-fit:cover}.pb{padding:10px}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:9px;margin-top:4px}.empty{padding:28px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:10px}.modal{display:none;position:fixed;inset:0;z-index:1000;background:#000b;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.mb{width:min(680px,96vw);max-height:90vh;overflow:auto;padding:14px;background:var(--p);border:1px solid #354462;border-radius:14px}.mh{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.form .full{grid-column:1/-1}.form input,.form textarea{width:100%;padding:8px;border:1px solid var(--l);border-radius:7px;background:#0a1020;color:var(--t)}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:430px;overflow:auto;margin-top:7px}.contact{display:grid;grid-template-columns:36px 1fr auto;gap:7px;align-items:center;padding:7px;border:1px solid var(--l);border-radius:9px;background:#10182a;color:#fff;text-align:left}.contact img,.contact .av{width:36px;height:36px;border-radius:8px}.toast{position:fixed;left:50%;bottom:14px;transform:translate(-50%,16px);opacity:0;padding:8px 12px;background:#131c2f;border:1px solid #405073;border-radius:9px;transition:.15s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:1000px){.creator{grid-template-columns:170px 1fr}.right{display:none}.cards{grid-template-columns:1fr}.brand,.actions{min-width:auto}}
</style></head><body>
<header class="top"><div class="brand"><b>MAWANG CONTENT PLANNER</b><small>기획 캔버스 & 제안서 아카이브</small></div><div class="tabs"><button id="homeTab" class="on">모드 선택</button><button id="createTab">콘텐츠 기획</button><button id="archiveTab">기획안 확인</button></div><div class="actions"><button class="btn" id="newBtn">새 기획</button><button class="btn primary" id="submitTop">기획안 제출</button></div></header>
<main class="app"><section id="home" class="home"><div class="homebox"><div class="muted">CONTENT PLANNER</div><h1>어떤 작업을 시작할까요?</h1><p class="muted">아이디어를 자유롭게 설계하거나 저장한 기획안을 다시 열 수 있습니다.</p><div class="cards"><button class="mode" data-mode="creator"><h2>콘텐츠 기획</h2><p>화이트보드처럼 텍스트, 이미지, 참가자, 타임라인, 체크리스트를 배치합니다.</p></button><button class="mode" data-mode="archive"><h2>기획안 확인</h2><p>제출한 기획안을 카드로 모아 검색하고 다시 편집합니다.</p></button></div></div></section>
<section id="creator" class="creator"><div class="bar"><button class="btn" id="undoBtn">↶</button><button class="btn" id="redoBtn">↷</button><button class="btn" id="dupBtn">복제</button><button class="btn" id="delBtn">삭제</button><span style="margin-left:auto;color:var(--m);font-size:9px">ZOOM</span><input id="zoom" type="range" min="40" max="120" value="75"><span id="zoomTxt">75%</span></div>
<aside class="side left"><div class="st">기본 요소</div><div class="grid"><button class="tool" data-add="text"><b>텍스트</b><small>자유 텍스트</small></button><button class="tool" data-add="sticky"><b>포스트잇</b><small>빠른 메모</small></button><button class="tool" data-add="rect"><b>도형</b><small>사각형</small></button><button class="tool" data-add="ellipse"><b>원형</b><small>타원</small></button><button class="tool" data-add="frame"><b>영역</b><small>그룹 프레임</small></button><button class="tool" data-add="timeline"><b>타임라인</b><small>진행 분량</small></button><button class="tool" data-add="check"><b>체크리스트</b><small>준비 항목</small></button><button class="tool" data-add="participant"><b>참가자</b><small>Scheduler DB</small></button></div><div class="st">자료</div><div class="grid"><button class="tool" id="imageBtn"><b>이미지</b><small>로컬 첨부</small></button><button class="tool" id="jsonOut"><b>JSON 저장</b><small>백업</small></button><button class="tool" id="jsonInBtn"><b>JSON 불러오기</b><small>복원</small></button><button class="tool" id="pngBtn"><b>PNG</b><small>이미지 출력</small></button></div><div class="st">배경</div><div class="card"><select id="bg"><option value="grid">모눈종이</option><option value="dot">도트</option><option value="paper">백지</option><option value="dark">다크보드</option></select></div><div class="card"><div id="contactStatus" class="muted" style="font-size:9px">Scheduler 연락처 연동 대기 중</div></div></aside>
<div class="workspace"><div class="ws"><span id="titleChip">제목 없는 기획</span><span id="countChip">요소 0</span><span id="saveStatus">로컬 자동 저장 준비</span></div><div class="wrap" id="boardWrap"><div id="board" class="board grid"><div id="layer" class="layer"></div></div></div></div>
<aside class="side right"><div class="st">기획 정보</div><div class="card"><label>작업 제목</label><input id="draftTitle"><label>작성자</label><input id="draftAuthor"><label>핵심 메모</label><textarea id="draftSummary"></textarea></div><div class="st">선택 요소</div><div id="inspector" class="card muted">요소를 선택하면 위치와 크기를 확인합니다.</div></aside></section>
<section id="archive" class="archive"><div class="ahead"><div><div class="muted">PROPOSAL ARCHIVE</div><h1 style="margin:4px 0">기획안 확인</h1><small class="muted">기획안과 초안은 현재 이 브라우저에 로컬 저장됩니다.</small></div><div class="atools"><input id="archiveSearch" placeholder="제목 / 작성자"><select id="archiveSort"><option value="newest">최신순</option><option value="oldest">오래된순</option></select><button class="btn primary" data-mode="creator">새 기획</button></div></div><div id="proposalGrid" class="props"></div></section></main>
<input id="imageInput" type="file" accept="image/*" hidden><input id="jsonInput" type="file" accept=".json,application/json" hidden>
<div id="participantModal" class="modal"><div class="mb"><div class="mh"><h2>참가자 선택</h2><button class="btn" data-close="participantModal">닫기</button></div><input id="participantSearch" class="search" placeholder="이름 / 태그 검색"><div id="contactList" class="contacts"></div></div></div>
<div id="submitModal" class="modal"><div class="mb"><div class="mh"><h2>기획안 제출</h2><button class="btn" data-close="submitModal">닫기</button></div><div class="form"><input id="submitTitle" placeholder="기획안 제목"><input id="submitAuthor" placeholder="작성자"><textarea id="submitSummary" class="full" placeholder="핵심 요약"></textarea></div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button id="submitBtn" class="btn primary">제출</button></div></div></div><div id="toast" class="toast"></div>
<script src="/assets/content-planner.js?v=1.0.3"></script></body></html>
